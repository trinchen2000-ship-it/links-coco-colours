    {n:"Falke — Botschafter",g:"🦅",b:"Der Falke ist in vielen indigenen Traditionen der Botschafter zwischen Welten — er fliegt zwischen Erde und Himmel und trägt Nachrichten des Großen Geistes. Als Tattoo steht er für spirituelle Wachheit, die Bereitschaft Botschaften zu empfangen und die Präzision des Falkenjägers.",t:"freiheit,weisheit,stärke"},
    {n:"Schildkröte — Mutter Erde",g:"🐢",b:"Die Weltschildkröte trägt in der Kosmologie vieler nordamerikanischer Völker die Erde auf ihrem Rücken — daher heißt Nordamerika 'Turtle Island'. Als Tattoo steht sie für Mutter Erde selbst, die Geduld der Erdkräfte und die Pflicht zur Fürsorge für unseren Planeten.",t:"heimat,ausdauer,spirituell"},
    {n:"Schlange — Heilerin",g:"🐍",b:"In der Native-American-Medizintradition kennt die Schlange Heilpflanzen und Gifte zugleich. Schlangengift heilt in kleinen Mengen. Als Tattoo steht sie für die duale Kraft der Heilung, Weisheit der Erde und die Fähigkeit das Giftige in Heilendes zu verwandeln.",t:"heilung,transformation,weisheit"},
    {n:"Kolibri — Freude",g:"🐦",b:"Der Kolibri ist Bote der Freude und der Liebe — er kann als einziger Vogel rückwärtsfliegen und damit in die Vergangenheit zurückkehren. Als Tattoo steht er für Lebensfreude, die Leichtigkeit des Augenblicks und die Erinnerung dass selbst kleine Dinge grenzenlose Freude bringen können.",t:"liebe,freude,freiheit"},
    {n:"Hirsch — Sensibler Führer",g:"🦌",b:"Der Hirsch ist in der schamanischen Tradition der sensitive Wegweiser — er kennt jeden Pfad und spürt Gefahr bevor sie sichtbar wird. Als Tattoo steht er für spirituelle Sensibilität, sanfte Führung des Herzens und die Fähigkeit Gefahr zu spüren bevor andere sie sehen.",t:"führung,liebe,spirituell"},
    {n:"Puma — Weibliche Kraft",g:"🦁",b:"Der Puma jagt allein und führt mit Stille — er braucht keine Aufmerksamkeit für seine Kraft. Als Tattoo steht er für stille Macht die sich selbst beweist, weibliche Führungsstärke und die Kraft die in der Einsamkeit und Unabhängigkeit liegt.",t:"stärke,führung,weiblichkeit"},
    {n:"Waschbär — Trickster",g:"🦝",b:"Der Waschbär wäscht seine Nahrung, untersucht alles neugierig und findet immer einen Weg. Als Tattoo steht er für Neugier als Überlebensstrategie, Anpassungsfähigkeit und die spielerische Intelligenz des Opportunisten der aus allem das Beste macht.",t:"transformation,weisheit,kreativität"},
    {n:"Elch — Selbstbewusstsein",g:"🫎",b:"Der Elch trägt sein mächtiges Geweih mit natürlicher Würde — er beansprucht Raum ohne zu kämpfen. Als Tattoo steht er für würdevolles Selbstbewusstsein, die Kraft die durch langen Lebensweg entsteht und den Stolz auf den eigenen Weg.",t:"stärke,ausdauer,identität"},
    {n:"Truthahn — Geschenk",g:"🦃",b:"Der Truthahn gibt sein Leben für die Gemeinschaft und steht für selbstlose Großzügigkeit. Als Tattoo steht er für bedingungslose Großzügigkeit ohne Erwartung und die spirituelle Kraft des Gebens das nichts zurückfordert.",t:"erfolg,spirituell,liebe"},
  ],

  // ===== JAPANISCHE TIERE =====
  tiere_japan:[
    {n:"Kitsune — Fuchs",g:"🦊",b:"Der Kitsune ist Japans magischer Gestaltwandler — je mehr Schwänze er hat desto mächtiger. Neunschwänzige Kitsune sind fast gottgleich. Als Tattoo steht er für Weisheit die durch Alter kommt, magische Verwandlung und die Fähigkeit zwischen Welten zu wandeln.",t:"weisheit,transformation,sinnlichkeit"},
    {n:"Tanuki — Marderhund",g:"🦝",b:"Der Tanuki ist der fröhliche Glücks-Marderhund der schlägt auf seinen magischen Bauch und tanzt. Als Tattoo steht er für Lebensfreude, Sorglosigkeit als spirituelle Haltung und die japanische Überzeugung dass ein lächelndes Herz das beste Glück anzieht.",t:"glück,kreativität,transformation"},
    {n:"Kirin — Einhorn",g:"🦒",b:"Das Kirin erscheint nur bei der Herrschaft eines gerechten Führers und tritt niemals Gras nieder. Als Tattoo steht es für vollkommene Gerechtigkeit, Reinheit des Herzens und die seltene Erscheinung des wahrhaft Guten — so selten wie das Kirin selbst.",t:"reinheit,glück,spirituell"},
    {n:"Tengu — Berggeist",g:"🦅",b:"Tengu sind Berggeister halb Mensch halb Rabe die als Meister der Kampfkunst gelten. Viele Samurai lernten angeblich von ihnen. Als Tattoo steht der Tengu für Meisterschaft durch Disziplin, die spirituelle Dimension der Kampfkunst und die Verbindung zwischen Krieger und Naturgeist.",t:"stärke,weisheit,schutz"},
    {n:"Ryu — Drache",g:"龍",b:"Der japanische Ryu lebt in Seen und Flüssen, bringt Regen und ist weise und wohlgesonnen. Als Tattoo steht er für die heilende Kraft des Wassers, kosmische Weisheit und den Schutz durch einen wohlgesinnten Drachen der über Gewässer wacht.",t:"schutz,glück,macht"},
    {n:"Koi — Tapferkeit",g:"🐟",b:"Der Koi schwimmt stromaufwärts und wird am Drachentor zum Drachen — Metapher für Überwindung. Als Tattoo ist er eines der stärksten japanischen Symbole für Tapferkeit, Ausdauer gegen Widerstände und die Verwandlung die als Belohnung auf Beharrlichkeit folgt.",t:"mut,ausdauer,transformation"},
    {n:"Tsuru — Kranich",g:"🦢",b:"Der Tsuru soll tausend Jahre leben und bleibt seinem Partner ein Leben lang treu. Das Falten von 1000 Origami-Kranichen erfüllt einen Wunsch. Als Tattoo steht er für Langlebigkeit, lebenslange Treue und die Kraft der meditativen Ausdauer.",t:"glück,heilung,ewigkeit"},
    {n:"Schildkröte — Minogame",g:"🐢",b:"Die Minogame ist eine legendäre alte Schildkröte mit langem Moosbewuchs am Schwanz — sie soll zehntausend Jahre alt sein. Als Tattoo steht sie für das höchste Maß an Geduld, extreme Langlebigkeit und die tiefe Weisheit die nur durch außerordentlich langes Leben entsteht.",t:"ausdauer,weisheit,ewigkeit"},
    {n:"Tora — Tiger",g:"🐅",b:"Der Tiger ist in Japan Beschützer der nordwestlichen Himmelsrichtung und vertreibt böse Geister. Er stirbt nach tausend Jahren weiß. Als Tattoo steht er für kraftvollen Schutz, Mut und die Reinheit die durch langes Leben entsteht.",t:"schutz,stärke,mut"},
    {n:"Usagi — Hase",g:"🐇",b:"Der Mondhasé lebt auf dem Mond und stampft Reiskuchen — Symbol der Reinheit und der Freude. Als Tattoo steht er für Mondmagie, Reinheit des Herzens und die japanische Wertschätzung des sanft Freudigen im Leben.",t:"glück,neubeginn,liebe"},
    {n:"Hebi — Schlange",g:"🐍",b:"Die japanische Schlange steht für Weisheit und Regeneration durch die Häutung — sie wird neu geboren. Als Tattoo steht sie für die Kraft der Erneuerung, emotionale Intensität und die duale Natur als heilendes und gefährliches Wesen.",t:"schutz,glück,weisheit"},
    {n:"Kumo — Spinne",g:"🕷",b:"Die Spinne gilt in Japan als Glücksbringer morgens — abends als schlechtes Zeichen. Tsuchigumo sind mächtige Riesenspinnen-Dämonen. Als Tattoo steht sie für schicksalswebende Kraft, Geduld und die ambivalente Natur aller Schöpfer.",t:"transformation,weisheit,kreativität"},
  ],

  // ===== KELTISCHE TIERE =====
  tiere_keltisch:[
    {n:"Hirsch — Cernunnos",g:"🦌",b:"Der Hirsch des Cernunnos trägt das Geweih wie der Gott selbst — beide sind Hüter des Waldes. Der Hirsch erneuert sein Geweih jährlich. Als Tattoo steht er für zyklischen Wandel, spirituelle Autorität und die tiefe Verbindung mit dem ältesten keltischen Gott.",t:"führung,spirituell,transformation"},
    {n:"Hase — Mondgöttin",g:"🐇",b:"Der keltische Hase ist das heilige Tier der Mondgöttin — Boudica ließ Hasen frei um das Ergebnis von Schlachten zu lesen. Als Tattoo steht er für Mondmagie, prophetische Intuition und die Verbindung mit der keltischen Göttin des Frühlings.",t:"spirituell,neubeginn,weiblichkeit"},
    {n:"Rabe — Morrigan",g:"🦅",b:"Die Morrigan erscheint auf dem Schlachtfeld als Rabe und prophezeit Tod und Sieg. Als Tattoo steht der Morrigan-Rabe für das Annehmen des Schicksals, Weisheit im Angesicht des Krieges und die mächtige Göttlichkeit die im Schicksal selbst wohnt.",t:"stärke,transformation,weisheit"},
    {n:"Lachs — Hazel-Weisheit",g:"🐟",b:"Der Lachs des Wissens frisst die Haselnüsse der Weisheit im heiligen Brunnen. Finn McCool berührte ihn zufällig und erlangte alle Weisheit. Als Tattoo steht er für instinktives uraltes Wissen und den Mut die Wahrheit an ihrer Quelle zu suchen.",t:"weisheit,spirituell,transformation"},
    {n:"Schlange — Erneuerung",g:"🐍",b:"Die keltische Schlange häutet sich und wird neu geboren — ältestes Symbol der Erneuerung. Als Tattoo steht sie für radikale Selbsterneuerung, das Ablegen des Alten und die Weisheit der Erde die in der Schlange verkörpert ist.",t:"transformation,heilung,neubeginn"},
    {n:"Adler — Rhiannon",g:"🦅",b:"Der Adler der Göttin Rhiannon steht für Weitblick und Befreiung nach langer Prüfung. Rhiannon ist die keltische Göttin der Pferde und der Schwellen. Als Tattoo steht er für die Freiheit die nach Dunkelheit kommt und die Verbindung mit der Göttin die alle Grenzen überwindet.",t:"freiheit,spirituell,weisheit"},
    {n:"Wildschwein — Krieger",g:"🐗",b:"Der Eber ist das Symbol des keltischen Kriegers — er kämpft bis zum Tod ohne zurückzuweichen. Als Tattoo steht er für unbändigen Kampfgeist, die Ehre die im Stehen bis zuletzt liegt und die archaische Kraft des keltischen Kriegertums.",t:"stärke,mut,wildnis"},
    {n:"Kuh — Heilige",g:"🐄",b:"Die heilige weiße Kuh der Kelten steht für Götter-Gaben und göttliche Fürsorge. Brigid ist mit weißen Kühen verbunden. Als Tattoo steht sie für heilige Fürsorge, göttlichen Überfluss und die keltische Ehrfurcht vor dem Tier das nährt ohne zu fordern.",t:"liebe,schutz,weiblichkeit"},
    {n:"Schwan — Seele",g:"🦢",b:"Der keltische Schwan ist oft eine verwandelte menschliche Seele — die Kinder des Lir wurden in Schwäne verwandelt. Als Tattoo steht er für die unsterbliche Seele, Reinheit nach Prüfung und die Schönheit die entsteht wenn der Geist in Freiheit lebt.",t:"spirituell,liebe,transformation"},
    {n:"Hund — Treuer Begleiter",g:"🐕",b:"Der Hund war in der keltischen Welt der treueste Begleiter — Hundegräber wurden neben Menschengräbern gefunden. Hunde heilten durch Lecken der Wunden. Als Tattoo steht er für bedingungslose Treue und die heilige jahrtausendealte Verbindung zwischen Mensch und Hund.",t:"treue,schutz,heilung"},
    {n:"Wolf — Rudel",g:"🐺",b:"Das Wolf-Rudel ist ein komplexes Sozialgefüge mit klaren Hierarchien und tiefer Loyalität. Rudel-Symbole stehen für Gemeinschaft, gegenseitige Unterstützung und die Stärke die entsteht wenn Individuen zusammenarbeiten. Als Tattoo symbolisiert es Familiensinn, bedingungslose Loyalität und die Kraft der Gemeinschaft.",t:"stärke,schutz,heimat"},
    {n:"Pferd — Epona",g:"🐎",b:"Epona ist die keltisch-gallische Göttin der Pferde — die einzige keltische Gottheit die die Römer übernahmen. Als Tattoo steht das Pferd der Epona für Stärke, Freiheit und den Schutz der Göttin die alle Reiter begleitet.",t:"freiheit,spirituell,transformation"},
  ],

  // ===== HINDUISTISCHE TIERE =====
  tiere_hinduistisch:[
    {n:"Elefant (Ganesha)",g:"🐘",b:"Ganesha — der elefantenköpfige Sohn Shivas und Parvatis — ist der beliebteste aller hinduistischen Götter. Mit seinem Rüssel und seiner Weisheit räumt er Hindernisse aus dem Weg. Er hat eine gebrochene Stoßzähne (geschrieben), ein kleines Mäuse-Reittier und vier Hände. Als Tattoo steht er für Neuanfänge, das Überwinden von Hindernissen und göttliche Weisheit.",t:"weisheit,glück,neubeginn,schutz"},
    {n:"Kuh — Heilig",g:"🐄",b:"Die heilige Kuh ist in Indien das Symbol der Mutter Erde — sie gibt ohne zu nehmen. Kamadhenu, die Wunschkuh, erfüllt alle Wünsche. Als Tattoo steht sie für mütterliche Fürsorge ohne Grenzen, Dankbarkeit für das Lebensnotwendige und die Heiligkeit des Fürsorge-Prinzips.",t:"liebe,heilung,spirituell"},
    {n:"Affe (Hanuman)",g:"🐒",b:"Hanuman, der Affengott, ist der treueste Verehrer Ramas — ein Held der Berge versetzen kann aber in vollständiger Demut lebt. Er steht für Bhakti (Hingabe), übermenschliche Stärke und selflose Loyalität. Als Tattoo steht er für Treue bis zur Selbstaufgabe, spirituelle Kraft und die Kombination von Stärke und Demut.",t:"stärke,liebe,mut"},
    {n:"Kobra (Naga)",g:"🐍",b:"Die Naga-Kobra umschlingt Shivas Hals und steht für kontrollierte Urkraft und Kundalini-Energie. Als Tattoo steht sie für beherrschte Macht, die Schlangenkraft die die Wirbelsäule aufsteigt und die göttliche Kraft des Unbewussten.",t:"schutz,weisheit,spirituell"},
    {n:"Pfau (Saraswati)",g:"🦚",b:"Der Pfau verschlingt Schlangen und ist immun gegen Gift — er wandelt das Giftige in Schönheit. Sein Rad-Gefieder zeigt tausend Augen. Als Tattoo steht er für die Überwindung des Giftigen durch Schönheit und die Verbindung mit der Göttin der Künste.",t:"schönheit,weisheit,kreativität"},
    {n:"Tiger (Durga)",g:"🐅",b:"Durga reitet auf einem Tiger in die Schlacht gegen den Büffeldämon. Der Tiger trägt die Göttin und steht für rohe Kraft die von göttlicher Weisheit gelenkt wird. Als Tattoo steht er für weibliche Macht in ihrer wildesten Form und die kämpferische Energie der Göttin.",t:"stärke,weiblichkeit,mut"},
    {n:"Ratte (Mushika)",g:"🐀",b:"Mushika — die Ratte — ist Ganeshas Reittier: der mächtigste Gott reitet auf dem kleinsten Tier. Sie durchdringt alle Hindernisse. Als Tattoo steht sie für die Weisheit des Kleinen und die Überzeugung dass Stärke keine Größe braucht.",t:"weisheit,erfolg,transformation"},
    {n:"Garuda — Adlerwesen",g:"🦅",b:"Garuda ist der königliche Vogel Vishnus — halb Mensch halb Adler. Er transportiert Vishnu durch den Kosmos und ist der natürliche Feind der Naga-Schlangen. Als Tattoo steht er für triumphierende Stärke, Sieg über das Böse und unaufhaltsame göttliche Energie.",t:"stärke,spirituell,freiheit"},
    {n:"Löwe (Narasimha)",g:"🦁",b:"Narasimha ist die Löwenmensch-Inkarnation Vishnus — er erschien um den Dämon zu töten der weder von Mensch noch Tier getötet werden durfte. Als Tattoo steht er für die kreative Lösung des Unlösbaren und die Kraft Vishnus die neue Formen annimmt wenn nötig.",t:"schutz,stärke,spirituell"},
    {n:"Schildkröte (Kurma)",g:"🐢",b:"Kurma ist die Schildkröten-Inkarnation Vishnus — er trug den Berg Mandara beim kosmischen Quirlen des Milchozeans. Als Tattoo steht er für Beständigkeit unter Last und die göttliche Kraft die sich in Geduld und Stärke ausdrückt.",t:"ausdauer,spirituell,stabilität"},
    {n:"Hamsa — Schwan/Gans",g:"🦢",b:"Hamsa — die heilige Gans — ist das Reittier von Brahma und Saraswati. Sie kann Milch von Wasser trennen: Symbol geistiger Unterscheidungskraft. Als Tattoo steht sie für die Fähigkeit das Echte vom Unechten zu erkennen und die göttliche Gabe spiritueller Klarheit.",t:"spirituell,reinheit,weisheit"},
  ],

  // ===== BUDDHISTISCHER TIERKREIS (12 Tier-Schutzgötter) =====
  tiere_buddhist:[
    {n:"Elefant — Bodhi",g:"🐘",b:"Mayas Mutter träumte von einem weißen Elefanten bevor Buddha geboren wurde — Zeichen der Reinheit und kommenden Weisheit. Als Tattoo steht der buddhistische Elefant für spirituelle Reinheit, die Ankündigung großer Weisheit und tiefe Verbindung zwischen Elefanten und Erleuchtung.",t:"weisheit,spirituell,stärke"},
    {n:"Löwe — Dharma",g:"🦁",b:"Der Löwe flankiert das Dharmarad als Symbol des Buddhas — der Dhamma-Ruf des Erleuchteten heißt 'Löwenbrüllen'. Als Tattoo steht er für den Mut die Wahrheit zu verkünden, den Dharma zu schützen und die Würde die aus echtem Verstehen entsteht.",t:"stärke,schutz,spirituell"},
    {n:"Pferd — Befreiung",g:"🐎",b:"Das weiße Pferd Kalki ist die zehnte und zukünftige Inkarnation Vishnus — er wird am Ende des Kali-Yuga erscheinen um die Welt zu erneuern. Als Tattoo steht es für die Sehnsucht nach endgültiger Befreiung und die Kraft die alles überwindet.",t:"freiheit,spirituell,transformation"},
    {n:"Ochse — Erleuchtung",g:"🐂",b:"Im buddhistischen Gleichnis der zehn Ochsenbilder sucht der Hirte den Ochsen — sein ursprüngliches Bewusstsein. Als Tattoo steht er für die buddhistische Suche nach dem wahren Selbst und die beharrliche spirituelle Praxis die zum Ziel führt.",t:"weisheit,spirituell,ausdauer"},
    {n:"Schlange (Naga)",g:"🐍",b:"Nagas sind göttliche Schlangengeister des hinduistischen und buddhistischen Kosmos — mächtige Halbgötter die Wasserquellen bewachen. Shiva trägt eine Kobra um den Hals. Nagas stehen für Kundalini-Energie — die Schlangenkraft die an der Wirbelsäule aufsteigt. Als Tattoo steht die Naga für spirituelle Transformation, Heilung und kosmische Energie.",t:"schutz,weisheit,spirituell"},
    {n:"Pfau — Dharma",g:"🦚",b:"Der Pfau wandelt Schlangengift in Schönheit — im Buddhismus steht er für die Umwandlung von Leid in Weisheit. Als Tattoo steht er für die spirituelle Alchemy: das Giftige integrieren und in Weisheit verwandeln.",t:"transformation,weisheit,schönheit"},
    {n:"Fisch (Goldfish)",g:"🐟",b:"Die zwei goldenen Fische (Suvarna Matsya) sind eines der acht Glückssymbole des Buddhismus — sie schwimmen frei ohne Angst zu ertrinken. Als Tattoo stehen sie für spirituelle Freiheit, Glück und den erleuchteten Geist der furchtlos durch alle Gewässer des Lebens schwimmt.",t:"freiheit,glück,spirituell"},
    {n:"Krabbe — Karma",g:"🦀",b:"Die Krabbe läuft seitwärts — sie erreicht ihr Ziel auf ungeradem Weg. Im Karma-Denken: wir kommen ans Ziel aber selten auf direktem Weg. Als Tattoo steht sie für Akzeptanz des eigenen Weges auch wenn er ungewöhnlich erscheint.",t:"transformation,spirituell,weisheit"},
    {n:"Hasen im Mond",g:"🐇",b:"In ostasiatischen Kulturen sieht man im Mond einen Hasen der Reiskuchen stampft. In der buddhistischen Geschichte opferte sich der Hase selbst — Buddha ehrte ihn im Mond. Als Tattoo steht er für Selbstopfer aus Liebe und die ewige Erinnerung im Mondlicht.",t:"spirituell,liebe,neubeginn"},
    {n:"Makara — Meerestier",g:"🐉",b:"Das Makara ist ein mythisches Meerestier Indiens — halb Fisch halb Krokodil. Es ist das Reittier der Göttin Ganga und des Gottes Varuna. Als Tattoo steht es für die Macht der heiligen Gewässer und die göttliche Mischung verschiedener Naturkräfte.",t:"transformation,spirituell,schutz"},
    {n:"Suparna-Vogel",g:"🦅",b:"Suparna bedeutet 'schöngeflügelt' und bezeichnet göttliche Vögel im hinduistischen Kosmos. Als Tattoo steht er für göttlichen Aufstieg, die Schönheit des Fliegens und die spirituelle Dimension der Vogelwelt als Boten zwischen Himmel und Erde.",t:"freiheit,spirituell,stärke"},
    {n:"Reh — Erstes",g:"🦌",b:"Im Hirschpark von Sarnath hielt Buddha seine erste Lehrrede — das Reh hörte als erstes die Lehre. Das Dharmarad flankiert von zwei Rehen ist das Symbol des Buddhismus. Als Tattoo steht es für Offenheit für die Wahrheit und die zarte Empfänglichkeit des spirituellen Anfängers.",t:"spirituell,frieden,weisheit"},
  ],

  // ===== AZTEKISCHE TIERE =====
  tiere_azteken:[
    {n:"Jaguar — Krieger",g:"🐆",b:"Der Jaguar-Krieger war die Elite der aztekischen Armee — er trägt Jaguarfell und steht für die Kraft der Unterwelt. Der Jaguar tötet lautlos in der Nacht. Als Tattoo steht er für stille Macht, kriegerische Exzellenz und den aztekischen Mut zur direkten Konfrontation.",t:"stärke,mut,wildnis"},
    {n:"Adler — Krieger",g:"🦅",b:"Der Adlerritter war die Elite-Kriegerklasse der Azteken — er fliegt zur Sonne und verbindet irdischen Kampf mit himmlischer Energie. Als Tattoo steht er für aztekische Kriegerehre und die Überzeugung dass der mutigste Kämpfer dem Göttlichen am nächsten ist.",t:"stärke,mut,führung"},
    {n:"Quetzal — Freiheit",g:"🦜",b:"Der Quetzal stirbt in Gefangenschaft — er ist das Symbol der Freiheit schlechthin in Mesoamerika. Seine langen grünen Federn waren kostbarer als Gold. Als Tattoo steht er für die Überzeugung dass Freiheit das Kostbarste ist und kein Käfig — egal wie golden — einen freien Geist halten kann.",t:"freiheit,schönheit,spirituell"},
    {n:"Kolibri — Huitzilopochtli",g:"🐦",b:"In der aztekischen Tradition sind Kolibris die Seelen gefallener Krieger die als feurige kleine Vögel zurückkehren. Huitzilopochtli selbst ist der Kolibri des Südens. Als Tattoo steht er für die Wiedergeburt der Krieger-Seele und unaufhaltsame Energie im kleinen Körper.",t:"stärke,transformation,spirituell"},
    {n:"Schlange — Quetzalcoatl",g:"🐍",b:"Die gefiederte Schlange vereint Erde (Schlange) und Himmel (Quetzal-Federn) — sie ist die kosmische Einheit aller Gegensätze. Als Tattoo steht sie für die vollkommene Vereinigung von Himmel und Erde und den weisesten Gott Mesoamerikas.",t:"weisheit,transformation,spirituell"},
    {n:"Hund — Totenbegleiter",g:"🐕",b:"Xoloitzcuintle — der mexikanische Nackthund — führte die Seelen sicher durch die neun aztekischen Unterwelten. Als Tattoo steht er für bedingungslose Treue über den Tod hinaus und die Überzeugung dass kein Mensch allein gehen muss.",t:"treue,transformation,schutz"},
    {n:"Fledermaus — Unterwelt",g:"🦇",b:"Zotz ist der aztekische Fledermausgott der Unterwelt — er steht für Nacht, Tod und die verborgene Welt. Als Tattoo steht er für die Kraft der Dunkelheit, Weisheit der Nacht und den Mut in die Unterwelt hinabzusteigen um Wahrheit zu finden.",t:"transformation,spirituell,neubeginn"},
    {n:"Kröte — Tlaltecuhtli",g:"🐸",b:"Tlaltecuhtli ist die aztekische Erdmonstergöttin in Form einer riesigen Kröte — aus ihrem Körper wurde die Erde erschaffen. Als Tattoo steht sie für die Erde als Göttin, die schöpferische Kraft des Monstruösen und die aztekische Kosmologie der Schöpfung aus dem Chaos.",t:"spirituell,neubeginn,stärke"},
    {n:"Adler-Kaktus-Schlange",g:"🦅",b:"Der Adler auf dem Kaktus mit der Schlange ist das Gründungssymbol Mexikos — hier gründeten die Azteken Tenochtitlan. Als Tattoo steht es für die Erfüllung einer göttlichen Prophezeiung und den Mut dem Zeichen zu folgen wohin es auch führt.",t:"identität,macht,spirituell"},
    {n:"Xolotl — Nackter Hund",g:"🐕",b:"Xolotl ist der aztekische Blitz- und Todesgott — ein Hund mit umgekehrten Füßen. Er führte die Seelen durch Mictlan. Als Tattoo steht er für Schutz der Seele nach dem Tod und göttliche Führung durch die dunkelsten Zeiten.",t:"schutz,transformation,treue"},
  ],

  // ===== SLAWISCHE TIERE =====
  tiere_slawisch:[
    {n:"Zhar-Ptitsa — Feuervogel",g:"🔥",b:"Der Zhar-Ptitsa (Feuervogel) leuchtet aus sich selbst heraus — seine Federn leuchten noch nach dem Abfallen. Als Tattoo steht er für die Sehnsucht nach dem Unmöglichen und den Mut es trotzdem zu suchen — und für die Schönheit die entsteht wenn man für etwas brennt.",t:"glück,transformation,spirituell"},
    {n:"Bär — Veles",g:"🐻",b:"In der slawischen Mythologie ist der Bär das heilige Tier des Unterweltgottes Veles — Herr der Magie und Toten. Bären galten als Krieger-Vorfahren. Als Tattoo steht er für die Verbindung mit dem slawischen Totenreich und die archaische Kraft der Vorfahren.",t:"stärke,spirituell,transformation"},
    {n:"Wolf — Perun",g:"🐺",b:"In der slawischen Mythologie ist der Wolf das heilige Tier des Donnergottes Perun. Wölfe galten als Krieger-Seelen und Wächter. Als Tattoo steht dieser Wolf für göttlichen Schutz, kriegerische Stärke und die Verbindung mit den alten slawischen Göttern.",t:"stärke,schutz,mut"},
    {n:"Schlange — Zmey",g:"🐍",b:"Zmey ist der slawische Drache-Schlange — mächtig und ambivalent, manchmal Beschützer manchmal Feind. Als Tattoo steht er für die Akzeptanz der Dualität und die Kraft die in mächtigen aber unkontrollierbaren Kräften liegt.",t:"stärke,weisheit,transformation"},
    {n:"Falke — Sokol",g:"🦅",b:"Der Falke (Sokol) ist in der slawischen Tradition Symbol der Reinheit, Freiheit und Liebe — Helden verwandeln sich in Märchen in Falken. Als Tattoo steht er für slawische Freiheitsliebe und die Verbindung zwischen Liebe und Freiheit.",t:"freiheit,liebe,stärke"},
    {n:"Kuckuck — Schicksal",g:"🐦",b:"Der Kuckuck zählt in slawischen Traditionen die verbleibenden Lebensjahre. Als Tattoo steht er für die Akzeptanz des Schicksals, das bewusste Leben im Wissen um die Vergänglichkeit und die slawische Spiritualität des Schicksals.",t:"weisheit,transformation,spirituell"},
    {n:"Nachtigall — Solovey",g:"🐦",b:"Die Nachtigall gilt als schönster Sänger — und Solovey Razboynich ist ein mächtiger Raubvogel dessen Pfiff tötet. Schönheit und Gefahr in einem. Als Tattoo steht sie für die duale Macht von Musik und Sprache und die slawische Wertschätzung der Poesie.",t:"kreativität,transformation,spirituell"},
    {n:"Fuchs — Lisitsa",g:"🦊",b:"Die schlaue Füchsin überlistet Bären und Wölfe durch Intelligenz. Als Tattoo steht sie für weibliche Cleverness, die Kraft der Intelligenz über rohe Stärke und die slawische Wertschätzung der Schlauheit als Überlebensstrategie.",t:"weisheit,sinnlichkeit,transformation"},
  ]
,
  tiere_nordisch:[
    {n:"Rabe (Huginn & Muninn)",g:"🦅",b:"Odins zwei Raben Huginn (Gedanke) und Muninn (Erinnerung) fliegen täglich um die Welt und berichten ihm alles. Symbol für Allwissenheit, Magie und die Kraft des Geistes über das Vergängliche.",t:["weisheit","magie","spirituell","erinnerung","tier"]},
    
    {n:"Wolf (Freki & Geri)",g:"🐺",b:"Freki (Gieriger) und Geri (Räudiger) sind Odins Wölfe — er füttert sie sein ganzes Fleisch und trinkt selbst nur Wein. Sie symbolisieren Odins wilde Seite unter der weisen Oberfläche. Als Tattoo stehen sie für die Integration des Tierischen ins Göttliche.",t:["treue","stärke","wildnis","tier"]},
    
    {n:"Schlange (Jörmungandr)",g:"🐍",b:"Jörmungandr umschlingt die gesamte Erde und beißt sich in den Schwanz. Bei Ragnarök tötet sie Thor und Thor sie. Als Tattoo steht sie für kosmische Größe, den ewigen Kreislauf und die Weisheit dass das Größte uns am Ende überwindet.",t:["vergänglichkeit","magie","ewigkeit","tier","tod"]},
    {n:"Adler (Hræsvelgr)",g:"🦅",b:"Hræsvelgr sitzt am nördlichen Rand des Himmels — wenn er die Flügel schlägt entsteht Wind. Er ist Herr aller Winde. Als Tattoo steht er für die Naturkraft die Klima erschafft und die nordische Ehrfurcht vor Kräften die über uns stehen.",t:["freiheit","stärke","magie","tier"]},
    {n:"Hirsch (Yggdrasil)",g:"🦌",b:"Eikþyrnir steht auf Walhalls Dach und frisst Yggdrasils Knospen — aus seinen Hörnern tropft Wasser das alle Flüsse speist. Als Tattoo steht er für die kosmische Verbindung zwischen Lebewesen und Kraftquellen.",t:["neubeginn","spirituell","tier","natur"]}
  ],
  tiere_aegyptisch:[
    
    
    
    
    {n:"Schlange (Wadjet)",g:"🐍",b:"Wadjet als aufgerichtete Kobra auf der Pharaonenkrone schützt den König mit tödlichem Gift. Als Tattoo steht sie für königlichen Schutz und die Bereitschaft das Giftige zur Verteidigung des Schutzbefohlenen einzusetzen.",t:["schutz","stärke","spirituell","tier","führung"]},
    
    ],
  tiere_japanisch:[
    {n:"Koi (Nishikigoi)",g:"🐟",b:"Die chinesische Legende besagt: Ein Karpfen der den Wasserfall am Drachentor erklimmt wird zum Drachen. Das Koi-Tattoo steht daher für Beharrlichkeit gegen Widerstände, Mut und die Transformation durch Ausdauer.",t:["erfolg","mut","resilienz","tier"]},
    
    {n:"Kranich (Tsuru)",g:"🦢",b:"Der Tsuru soll tausend Jahre leben und bleibt lebenslang treu. Das Falten von 1000 Origami-Kranichen erfüllt einen Wunsch. Als Tattoo steht er für Langlebigkeit, lebenslange Treue und die Kraft der meditativen Ausdauer.",t:["ewigkeit","hoffnung","tier","natur"]},
    
    {n:"Tiger (Tora)",g:"🐯",b:"Der Tiger ist Beschützer der nordwestlichen Himmelsrichtung in Japan und vertreibt böse Geister. Als Tattoo steht er für kraftvollen Schutz, Mut und die Reinheit die durch langes tapferes Leben entsteht.",t:["mut","schutz","stärke","tier","wildnis"]},
    {n:"Schildkröte (Kame)",g:"🐢",b:"Die Schildkröte lebt nach japanischer Überlieferung zehntausend Jahre. Als Tattoo steht sie für extreme Langlebigkeit, die Weisheit langen Lebens und die japanische Wertschätzung von Alter und Erfahrung.",t:["weisheit","ewigkeit","resilienz","tier"]}
  ],
  tiere_keltisch:[
    {n:"Hirsch (Cernunnos)",g:"🦌",b:"Der Hirsch des Cernunnos erneuert sein Geweih jährlich — Symbol der Erneuerung. Als Tattoo steht er für zyklischen Wandel, spirituelle Autorität und die Verbindung mit dem gehörnten Gott der Kelten.",t:["natur","spirituell","wildnis","tier","männlichkeit"]},
    {n:"Rabe (Morrigan)",g:"🦅",b:"Die Morrigan erscheint als Rabe und prophezeit auf Schlachtfeldern. Als Tattoo steht er für die Weisheit im Angesicht des Krieges, das Akzeptieren des Unvermeidlichen und die mächtige Göttlichkeit die im Schicksal selbst wohnt.",t:["tod","magie","transformation","tier","trauer"]},
    {n:"Lachs des Wissens",g:"🐟",b:"Der Bradán Feasa frisst die Haselnüsse der Weisheit im heiligen Brunnen. Finn McCool berührte ihn und wurde weise. Als Tattoo steht er für instinktives uraltes Wissen und den Mut die Wahrheit an ihrer tiefsten Quelle zu suchen.",t:["weisheit","magie","tier","spirituell"]},
    {n:"Hase (Mondmagie)",g:"🐇",b:"Der keltische Hase ist das heilige Tier der Mondgöttin und Frühlingsenergie. Als Tattoo steht er für Mondmagie, prophetische Intuition und die Verbindung mit der keltischen Göttin der Erneuerung.",t:["neubeginn","weiblichkeit","magie","tier","natur"]},
    {n:"Eber (Torc)",g:"🐗",b:"Der Eber ist das mächtigste Kriegssymbol der Kelten — er kämpft bis zum Tod. Als Tattoo steht er für unbändigen Kampfgeist und die keltische Ehre die im Stehen bis zuletzt liegt.",t:["mut","stärke","führung","tier","männlichkeit"]},
    {n:"Schwan (Götterbotin)",g:"🦢",b:"Schwäne sind in der keltischen Mythologie oft verwandelte Götter oder Seelen. Als Tattoo steht er für die Transformationskraft der Seele, Reinheit nach langer Prüfung und die Verbindung zwischen menschlicher und göttlicher Welt.",t:["spirituell","magie","transformation","tier","trauer"]}
  ],
  tiere_griechisch:[
    {n:"Eule (Athena)",g:"🦉",b:"Die Eule der Athena sieht in der Dunkelheit was andere nicht sehen. Sie ist das Symbol Athens und der Vernunft. Als Tattoo steht sie für intellektuelle Schärfe und die Weisheit die in der Stille der Nacht wächst.",t:["weisheit","führung","spirituell","tier"]},
    {n:"Adler (Zeus)",g:"🦅",b:"Der Adler des Zeus ist sein mächtigstes Symbol — göttlicher Bote und Verkörperung königlicher Macht. Als Tattoo steht er für göttliche Macht, Weitblick und die Überzeugung dass der Mächtigste auch der Freieste ist.",t:["führung","stärke","spirituell","tier","männlichkeit"]},
    {n:"Schlange (Asklepios)",g:"🐍",b:"Der Stab des Asklepios mit windender Schlange ist das ursprüngliche Zeichen der Medizin. Die Schlange steht für Heilung durch Erneuerung. Als Tattoo steht er für Heilungskunst und die spirituelle Verbindung zwischen Medizin und kosmischer Kraft.",t:["heilung","weisheit","tier","neubeginn"]},
    {n:"Delphin (Poseidon)",g:"🐬",b:"Der Delphin ist Poseidons Liebelingsbote — er rettete den Dichter Arion. Als Tattoo steht er für die Freude des Meeres, göttliche Fürsorge und die Verbindung mit dem intelligentesten Meerestier.",t:["freiheit","schutz","glück","tier","natur"]},
    {n:"Pfau (Hera)",g:"🦚",b:"Der Pfau ist Heras heiliges Tier — seine hundert Augen sind die Augen des Riesen Argus. Als Tattoo steht er für göttliche Wachsamkeit, unsterbliche Pracht und die Schönheit die göttlichen Ursprungs ist.",t:["weiblichkeit","ewigkeit","sinnlichkeit","tier"]},
    {n:"Biene (Demeter)",g:"🐝",b:"Die Biene war heilig für Demeter — ihre Priesterinnen hießen Melissai (Bienen). Als Tattoo steht sie für heilige Ordnung, Gemeinschaft und die Überzeugung dass das Schönste gemeinsam entsteht.",t:["erfolg","einheit","natur","tier"]}
  ],
  tiere_chinesisch:[
    
    
    
    
    {n:"Karpfen (Lǐ Yú)",g:"鲤",b:"Der Karpfen springt über das Drachentor und wird zum Drachen — Metapher für sozialen Aufstieg durch Prüfung. Als Tattoo steht er für beharrlichen Aufstieg und die Verwandlung die auf Ausdauer folgt.",t:["erfolg","resilienz","mut","tier","transformation"]}
  ],
  tiere_indianisch:[
    {n:"Adler (Great Spirit)",g:"🦅",b:"Der Adler ist der Bote des Großen Geistes — er fliegt am höchsten und trägt Gebete zum Himmel. Als Tattoo steht er für spirituelle Verbindung mit dem Höchsten und die Würde der Native-American-Spiritualität.",t:["spirituell","freiheit","führung","tier","magie"]},
    {n:"Wolf (Lehrmeister)",g:"🐺",b:"Der Wolf ist der Lehrmeister der indigenen Tradition — er lehrt durch sein Rudel-Leben. Als Tattoo steht er für die Weisheit des Beobachtens, Gemeinschaft als Überlebensstrategie und den Respekt vor dem ältesten Lehrer der Menschheit.",t:["weisheit","treue","einheit","tier","wildnis"]},
    {n:"Bär (Heilbringer)",g:"🐻",b:"Der Bär ist der mächtigste Heiler der Native-American-Tradition. Er kennt Heilpflanzen und heilt sich durch Winterschlaf. Als Tattoo steht er für Heilung aus der eigenen Kraft und die Weisheit des Rückzugs zur Erneuerung.",t:["heilung","stärke","spirituell","tier","achtsamkeit"]},
    {n:"Coyote (Trickster)",g:"🐺",b:"Der Coyote ist der große Trickster der nordamerikanischen Mythologien — Schöpfer, Narr und Lehrmeister in einem. Er bringt Feuer, schafft die Welt, macht Fehler und lernt daraus. Als Tattoo steht er für Humor als spirituelle Kraft, Kreativität durch Scheitern und die Weisheit die im Nichtseriosem liegt.",t:["trickster","magie","transformation","tier"]},
    {n:"Büffel (Weißer Büffel)",g:"🐂",b:"Der Weiße Büffel ist das heiligste Tier vieler Plains-Indianervölker. Er symbolisiert Überfluss, Dankbarkeit und heilige Verpflichtung gegenüber der Natur. Der Weiße Büffel Kalb ist eine Prophezeiung der Lakota. Als Tattoo steht er für tiefe Ehrfurcht vor der Natur, Dankbarkeit für ihre Gaben und spirituelle Verbundenheit mit der Erde.",t:["dankbarkeit","spirituell","natur","tier","einheit"]},
    {n:"Schildkröte (Weltschildkröte)",g:"🐢",b:"In vielen indigenen nordamerikanischen Kulturen trägt eine riesige Schildkröte die Welt auf ihrem Rücken — Nordamerika heißt deshalb 'Schildkröteninsel'. Sie steht für Mutter Erde, Geduld und die Beständigkeit der Welt. Als Tattoo steht sie für die Verbindung mit der Erde, unendliche Geduld und die Last die man gerne trägt.",t:["natur","ewigkeit","weisheit","tier","einheit"]}
  ],
  tiere_hinduistisch:[
    
    
    
    
    {n:"Garuda",g:"🦅",b:"Garuda ist der königliche Vogel Vishnus — halb Mensch, halb Adler. Er transportiert Vishnu durch den Kosmos und ist der natürliche Feind der Naga-Schlangen. Er steht für göttliche Kraft, Sieg über das Böse und die Freiheit des Himmels. Als Tattoo steht Garuda für triumphierende Stärke, Schutz durch das Göttliche und unaufhaltsame Energie.",t:["stärke","freiheit","spirituell","tier","schutz"]}
  ],
  tiere_aztekisch:[
    {n:"Jaguar (Tezcatlipoca)",g:"🐆",b:"Der Jaguar ist das mächtigste Tier Mittelamerikas und heilig für den aztekischen Gott Tezcatlipoca — Herrn der Dunkelheit und verborgenen Kraft. Der Jaguar sieht in der Nacht und bewegt sich lautlos. Als Tattoo steht er für die Kraft die im Verborgenen liegt, Beherrschung der eigenen Schatten und die stille Macht die keine Aufmerksamkeit braucht.",t:["magie","stärke","tod","tier","spirituell"]},
    {n:"Adler (Krieger)",g:"🦅",b:"Der aztekische Adlerritter fliegt zur Sonne — irdischer Kampf verbunden mit himmlischer Energie. Als Tattoo steht er für aztekische Kriegerehre und die göttliche Dimension des Mutes.",t:["mut","stärke","führung","tier","männlichkeit"]},
    {n:"Schlange (Quetzalcoatl)",g:"🐍",b:"Die gefiederte Schlange vereint Erde und Himmel in einem Wesen. Als Tattoo steht sie für die vollkommene Einheit aller Gegensätze und den weisesten Gott Mesoamerikas.",t:["weisheit","magie","spirituell","tier","transformation"]},
    {n:"Quetzal",g:"🦜",b:"Der Quetzal stirbt in Gefangenschaft — das ultimative Symbol der Freiheit. Als Tattoo steht er für die Überzeugung dass Freiheit das Kostbarste ist und kein Käfig einen freien Geist halten kann.",t:["freiheit","natur","spirituell","tier"]}
  ],
  tiere_insekten:[
    {n:"Biene",g:"🐝",b:"Die Biene ist seit Jahrtausenden ein heiliges Tier — in Ägypten Symbol des Pharaos, in Griechenland Priesterinnen der Göttin, im Christentum Symbol des Fleißes. Sie schafft gemeinsam mit anderen eine perfekte Gesellschaft und produziert Honig — das süßeste aller Nahrungsmittel. Als Tattoo steht sie für Gemeinschaft, Fleiß, Ordnung und die Süße des gemeinschaftlichen Lebens.",t:["einheit","erfolg","natur","tier","dankbarkeit"]},
    {n:"Libelle",g:"🪲",b:"Die Libelle lebt als Larve jahrelang unter Wasser bevor sie sich häutet und in die Luft erhebt. Sie steht für die plötzliche Transformation nach langer Vorbereitung, für Anpassungsfähigkeit und für die Fähigkeit, Illusionen zu durchschauen. Als Tattoo steht sie für tiefe Wandlung, Leichtigkeit nach langer Dunkelheit und die Kunst der Anpassung.",t:["transformation","achtsamkeit","natur","tier","loslassen"]},
    {n:"Motte",g:"🦋",b:"Die Motte fliegt ans Licht auch wenn es sie tötet — ein Symbol für unbedingte Sehnsucht und spirituelle Hingabe. Im Sufismus ist die Motte am Licht das Bild des Liebenden der im Geliebten aufgeht. Als Tattoo steht sie für die Kraft der Sehnsucht, spirituelle Hingabe und den Mut, sich für das zu verbrennen was man wirklich liebt.",t:["spirituell","magie","trauer","tier","selbstliebe"]},
    {n:"Spinne (Schicksalsspinnerin)",g:"🕷",b:"Die Spinne webt ihr Netz aus dem eigenen Körper heraus — ein Akt kreativer Schöpfung. In vielen Kulturen ist sie die Weberin des Schicksals: bei den Nornen, bei Anansi, bei Grandmother Spider der Navajo. Als Tattoo steht sie für kreative Schöpfungskraft, Geduld und die Überzeugung, dass jeder sein Schicksal selbst webt.",t:["magie","weisheit","weiblichkeit","tier"]},
    {n:"Schmetterling (Psyche)",g:"🦋",b:"Im Griechischen bedeutet Psyche sowohl 'Schmetterling' als auch 'Seele'. Der Schmetterling ist die unsterbliche Seele die den Körper verlässt. In der Geschichte von Eros und Psyche wird sie schließlich zur Göttin. Als Tattoo steht er für die Unsterblichkeit der Seele, die Kraft der Liebe die transformiert und die Schönheit des spirituellen Erwachens.",t:["spirituell","transformation","tier","tod"]}
  ],
  selbstliebe_achtsamkeit:[
    {n:"Lotusblüte",g:"🪷",b:"Die Lotusblüte wächst aus schlammigem Wasser und öffnet sich makellos — eines der kraftvollsten Symbole des Ostens. Sie steht für Selbstentfaltung, innere Reinheit und den Weg aus dem Dunkel ins Licht.",t:["selbstliebe","achtsamkeit","wachstum","transformation","spirituell"]},
    {n:"Om",g:"ॐ",b:"Om (AUM) ist der Urklang des Universums — die erste Schwingung aus der die Schöpfung entstand. In der Meditation wird Om gesungen um den Geist zur Stille zu bringen. Als Tattoo steht es für die Praxis der Achtsamkeit, die Verbindung mit dem kosmischen Ursprung und die Stille die hinter allem Lärm wartet.",t:["achtsamkeit","spirituell","balance","selbstliebe"]},
    
    {n:"Mondphasen",g:"🌙",b:"Die Mondphasen — zunehmend, voll, abnehmend, dunkel — spiegeln die Zyklen aller Lebewesen. Frauen, Meere und Gefühle folgen dem Mond. Als Tattoo stehen sie für die Akzeptanz aller Lebensphasen, die Weisheit dass nichts permanent ist und die weibliche Mondenergie die durch alle Zyklen trägt.",t:["selbstliebe","achtsamkeit","balance","intuition"]},
    {n:"Sanduhr",g:"⏳",b:"Die Sanduhr macht Zeit sichtbar — jedes Korn das fällt ist unwiederbringlich. Memento Mori. Gleichzeitig dreht man sie um und beginnt neu. Als Tattoo steht sie für die Kostbarkeit des Augenblicks, das Bewusstsein der eigenen Vergänglichkeit und die Kraft des Neubeginns der nach jedem Ende möglich ist.",t:["vergänglichkeit","zeit","achtsamkeit"]},
    
    {n:"Löwenzahn",g:"🌼",b:"Der Löwenzahn ist eines der mutigsten Pflanzen — er wächst durch Asphalt und verschickt seine Samen mit jedem Windhauch. Als Tattoo steht er für Loslassen als aktive Kraft, das Vertrauen dass unsere Samen irgendwo ankommen und die Überzeugung dass Wildheit und Ausdauer jede Einschränkung überwindet.",t:["loslassen","neubeginn","natur","hoffnung"]}
  ]
,
  unalome:[
    {n:"Unalome (klassisch)",g:"𑁍",b:"Buddhistisches Symbol des Erwachens: Die Spirale unten steht für Geburt und Verwirrung, die Windungen für die Kämpfe des Lebens, die gerade Linie für den Moment der Erleuchtung, die Punkte für die Auflösung des Ichs ins Nichts.",t:["spirituell","achtsamkeit","wachstum","selbstliebe","transformation","weisheit"]},
    {n:"Unalome mit Lotus",g:"𑁍🪷",b:"Unalome + Lotusblüte — Erleuchtung und Reinheit vereint, Aufblühen am Ende des Weges",t:["spirituell","achtsamkeit","selbstliebe","wachstum","transformation","natur"]},
    {n:"Unalome (weiblich / lunar)",g:"𑁍",b:"Das weibliche Unalome mit Spirale nach links folgt der Mondenergie — intuitiv, empfangend, zyklisch. Die linke Spirale steht für die innere Reise, die weibliche Weise und den Weg der Intuition zur Erleuchtung. Als Tattoo steht es für die Kraft des weiblichen Weges zur Erleuchtung durch innere Weisheit.",t:["weiblichkeit","intuition","spirituell","achtsamkeit","selbstliebe"]},
    {n:"Unalome (männlich / solar)",g:"𑁍",b:"Das männliche Unalome mit Spirale nach rechts folgt der Sonnenenergie — aktiv, gebend, linear. Die rechte Spirale steht für den aktiven Weg nach außen, die männliche Kraft und den Weg durch Handlung zur Erleuchtung. Als Tattoo steht es für den aktiven spirituellen Weg durch die Welt.",t:["männlichkeit","mut","spirituell","achtsamkeit","stärke"]},
    {n:"Unalome mit Om ॐ",g:"𑁍ॐ",b:"Unalome mit Om verbindet den persönlichen spirituellen Weg (Unalome) mit dem kosmischen Urklang (Om). Es steht für die Erkenntnis dass der individuelle Weg Teil des kosmischen Ganzen ist. Als Tattoo ist es eines der vollständigsten spirituellen Symbole: der Weg des Einzelnen im Klang des Universums.",t:["spirituell","achtsamkeit","magie","transformation","weisheit"]}
  ],
  chakren:[
    {n:"Muladhara — Wurzelchakra",g:"🔴",b:"Das erste Chakra, Muladhara, liegt an der Basis der Wirbelsäule und ist unsere Verbindung zur Erde. Wenn es ausgeglichen ist, fühlen wir uns sicher, geerdet und im Körper zuhause. Farbe: Rot. Element: Erde. Ein blockiertes Wurzelchakra zeigt sich in Angst, Unsicherheit und dem Gefühl der Wurzellosigkeit. Als Tattoo steht es für die Kraft der Erdung und das Fundament des Lebens.",t:["spirituell","stärke","resilienz","natur","balance","achtsamkeit"]},
    {n:"Svadhisthana — Sakralchakra",g:"🟠",b:"Das zweite Chakra liegt unter dem Bauchnabel und ist das Zentrum von Kreativität, Sexualität und Emotion. Es steht für Lebensfreude, sinnliche Wahrnehmung und kreative Energie. Farbe: Orange. Element: Wasser. Als Tattoo symbolisiert es die Kraft der kreativen Lebensenergie, Freude und die Verbindung mit den eigenen Gefühlen.",t:["spirituell","sinnlichkeit","weiblichkeit","selbstliebe","kreativität","achtsamkeit"]},
    {n:"Manipura — Solarplexuschakra",g:"🟡",b:"Das dritte Chakra liegt im Solarplexus und ist das Zentrum des Willens, der Persönlichkeit und des Selbstvertrauens. Es ist der Sitz des 'Ich'. Farbe: Gelb. Element: Feuer. Ein starkes Manipura gibt innere Stärke und Entschlossenheit. Als Tattoo steht es für Willenskraft, Selbstbestimmung und die Kraft, die eigenen Ziele zu verwirklichen.",t:["spirituell","selbstliebe","stärke","mut","führung","achtsamkeit"]},
    {n:"Anahata — Herzchakra",g:"💚",b:"4. Chakra · Grün/Rosa · Element Luft. Das Herzchakra verbindet die drei unteren mit den drei oberen Chakren. Sitz von Liebe, Mitgefühl und Selbstliebe. Sanskrit: अनाहत. 12-blättrige Lotusblüte.",t:["spirituell","liebe","selbstliebe","heilung","einheit","achtsamkeit"]},
    {n:"Vishuddha — Halschakra",g:"🔵",b:"Das fünfte Chakra liegt im Hals und ist das Zentrum von Kommunikation, Wahrheit und Ausdruck. Es steht für die Fähigkeit, authentisch zu sprechen und die eigene Wahrheit zu leben. Farbe: Blau. Element: Äther. Als Tattoo symbolisiert es die Kraft der Sprache, Authentizität und den Mut, die eigene Wahrheit auszusprechen.",t:["spirituell","wahrheit","selbstliebe","weisheit","achtsamkeit"]},
    {n:"Ajna — Stirnchakra / Drittes Auge",g:"🟣",b:"Das sechste Chakra liegt zwischen den Augenbrauen und ist das Zentrum der Intuition und des inneren Sehens. Es steht für Weisheit, Klarheit und die Fähigkeit, über die gewöhnliche Wahrnehmung hinauszusehen. Farbe: Indigo. Als Tattoo symbolisiert es intuitive Weisheit, spirituelle Wahrnehmung und die Verbindung mit dem höheren Selbst.",t:["spirituell","intuition","weisheit","magie","achtsamkeit","selbstliebe"]},
    {n:"Sahasrara — Kronenchakra",g:"🔮",b:"Das siebte Chakra liegt am Scheitel des Kopfes und ist die Verbindung zum göttlichen Bewusstsein. Es steht für Erleuchtung, Einheit und die Transzendenz des Ego. Farbe: Violett oder Weiß. Als Tattoo symbolisiert es das höchste spirituelle Streben, die Verbindung mit dem Göttlichen und die Auflösung aller Grenzen.",t:["spirituell","ewigkeit","einheit","weisheit","transformation","achtsamkeit"]},
    {n:"Alle 7 Chakren (Säule)",g:"🌈",b:"Die sieben Chakren bilden zusammen eine Energiesäule vom Steißbein bis zum Scheitel. Sie repräsentieren die vollständige Entwicklung des Menschen vom Überlebenstrieb bis zur spirituellen Erleuchtung. Als Tattoo steht die Chakren-Säule für Ganzheit, spirituelle Vollständigkeit und das Streben nach Balance auf allen Ebenen des Seins.",t:["spirituell","balance","einheit","selbstliebe","heilung","achtsamkeit"]},
    {n:"Chakra-Mandala",g:"◉",b:"Das Chakra-Mandala zeigt alle sieben Chakren in ihrer geometrischen Form als mandala-artiges Gesamtbild. Es steht für die Vollständigkeit des Energiesystems und die Harmonie aller Ebenen. Als Tattoo steht es für das Streben nach vollständiger Ausrichtung — körperlich, emotional, geistig und spirituell zugleich.",t:["spirituell","balance","achtsamkeit","magie","selbstliebe"]}
  ],
  hinduistisch_vedisch:[
    {n:"Om ॐ / Aum",g:"ॐ",b:"Om (AUM) ist der Urklang der Schöpfung — die erste Vibration aus der alles entstand. A steht für Wachbewusstsein, U für Traumzustand, M für Tiefschlaf. Das vierte Element ist die Stille danach. Om ist der Klang des Universums selbst. Als Tattoo steht es für die Verbindung mit dem kosmischen Ursprung und die Praxis der Achtsamkeit.",t:["spirituell","achtsamkeit","magie","ewigkeit","einheit","selbstliebe"]},
    
    {n:"Bindu (Punkt)",g:"·",b:"Der Bindu ist der heilige Punkt — der Ursprung aller Manifestation. Aus dem Bindu entsteht das Sri Yantra, aus dem Bindu entsteht die Schöpfung. Er steht für das unmanifestierte Potenzial, das Bewusstsein vor aller Form. Als Tattoo ist er das reinste Symbol für den Ursprung, das innere Zentrum und das Bewusstsein selbst.",t:["spirituell","achtsamkeit","ewigkeit","einheit"]},
    {n:"Trishula (Dreizack Shivas)",g:"⋔",b:"Der Trishula ist der dreiköpfige Speer des Gottes Shiva und steht für die drei Kräfte: Schöpfung, Erhaltung und Zerstörung. Er symbolisiert auch Vergangenheit, Gegenwart und Zukunft sowie Wille, Wissen und Handlung. Als Tattoo steht er für die Macht der Dreifaltigkeit und Shivas Herrschaft über die drei Welten.",t:["spirituell","stärke","transformation","magie","männlichkeit"]},
    {n:"Hamsa (Gotteshand)",g:"🤚",b:"Die Hamsa ist die 'Hand der Fatima' im Islam und die 'Hand der Miriam' im Judentum — in Indien und im hinduistischen Kontext die 'Hand der Göttin'. Alle Traditionen teilen ihre Schutzfunktion: Das Auge in der Handfläche weist den bösen Blick ab. Als Tattoo steht sie für universellen Schutz, Segen und die Hand der Göttin.",t:["schutz","spirituell","selbstliebe","weiblichkeit"]},
    {n:"Rudraksha (Samenkorn)",g:"🌰",b:"Rudrakshas sind die Samen des Elaeocarpus-Baums, heilig für Shiva. Die Legende sagt, Shiva weinte und seine Tränen wurden zu Rudrakshas. Sie werden als Gebetsketten getragen. Als Tattoo stehen sie für Shivas Mitgefühl, spirituellen Schutz und die Verbindung mit der Praxis des Gebetes und der Meditation.",t:["spirituell","schutz","achtsamkeit","natur"]}
  ]
,
  okkultismus_hermetik:[
    {n:"Pentagramm",g:"⛤",b:"Fünfzackiger Stern in dem die fünf Elemente Feuer, Wasser, Luft, Erde und Geist vereint sind. In der Magie ein Schutz- und Bannkreissymbol. Der nach oben zeigende Geist-Zacke steht für Herrschaft des Geistes über die Materie.",t:["magie","schutz","spirituell","balance","okkult"]},
    
    {n:"Hexagramm (Siegel Salomons)",g:"✡",b:"Das Hexagramm — zwei überlagerte Dreiecke — ist das Siegel des weisen Königs Salomon und steht für As above so below: was oben ist spiegelt sich unten. Es verbindet Feuer und Wasser, männlich und weiblich. Als Tattoo steht es für die magische Kraft des Gleichgewichts und die Einheit aller Gegensätze.",t:["magie","spirituell","weisheit","okkult","einheit"]},
    
    {n:"As Above So Below",g:"☿",b:"Hermetisches Grundprinzip — was oben ist, ist unten. Entsprechung von Makro- und Mikrokosmos",t:["weisheit","magie","okkult","spirituell","einheit"]},
    {n:"Caduceus (Hermesstab)",g:"⚕",b:"Stab des Hermes — zwei Schlangen, Balance der Gegensätze, Heilung, Kommunikation",t:["heilung","magie","balance","okkult","transformation"]},
    
    {n:"Schwarze Sonne",g:"☀",b:"Die Schwarze Sonne ist ein okkultes Symbol — eine Sonne die nach innen strahlt statt nach außen. Sie steht für das verborgene Licht, die innere Erleuchtung und die Transformation durch das Dunkle. Als Tattoo steht sie für die Kraft die im Schatten liegt und die tiefe Transformation die nur im Verborgenen stattfindet.",t:["magie","transformation","okkult","tod","innere_stärke"]},
    {n:"Chaos-Stern",g:"✳",b:"Der Chaos-Stern mit acht Pfeilen in alle Richtungen ist das Symbol der Chaos-Magie — alle Richtungen sind gleichzeitig möglich, keine Wahrheit ist absolut. Als Tattoo steht er für maximale Freiheit des Denkens, die Ablehnung jeder starren Ideologie und die magische Kraft der unbegrenzten Möglichkeit.",t:["magie","freiheit","okkult","transformation","chaos"]}
  ],
  okkultismus_alchemie:[
    
    {n:"Azoth (Ursubstanz)",g:"☿",b:"Azoth ist die alchemistische Ursubstanz — das erste Material aus dem alles entsteht und in das alles zurückkehrt. Es ist die Quintessenz hinter den vier Elementen, der Geist der Materie. Als Tattoo steht Azoth für die Suche nach dem Ursprung aller Dinge und die mystische Einheit die hinter der sichtbaren Welt liegt.",t:["magie","okkult","transformation","spirituell","heilung"]},
    {n:"Feuer-Dreieck △",g:"△",b:"Das aufwärts gerichtete Dreieck steht in der Alchemie für das Element Feuer — Energie, Wille, Aufstieg. Feuer transformiert alles was es berührt. Als Tattoo steht es für Leidenschaft, Willenskraft und die transformierende Kraft des Feuers im eigenen Leben.",t:["magie","okkult","innere_stärke","transformation","stärke"]},
    {n:"Wasser-Dreieck ▽",g:"▽",b:"Das abwärts gerichtete Dreieck steht in der Alchemie für das Element Wasser — Intuition, Tiefe, das Unbewusste. Wasser fließt immer bergab und findet jeden Weg. Als Tattoo steht es für emotionale Tiefe, Intuition und die Weisheit des Fließens statt des Kämpfens.",t:["magie","okkult","intuition","weiblichkeit","achtsamkeit"]},
    {n:"Luft-Dreieck",g:"△̄",b:"Das aufwärtsweisende Dreieck mit Querstrich ist das alchemistische Zeichen für Luft — das Element des Denkens, der Kommunikation und der Freiheit. Als Tattoo steht es für geistige Freiheit, kreative Intelligenz und die Überzeugung dass der Geist alle Grenzen überschreiten kann wie die Luft durch jeden Spalt.",t:["magie","okkult","freiheit","weisheit","transformation"]},
    {n:"Erde-Dreieck",g:"▽̄",b:"Das abwärtsweisende Dreieck mit Querstrich ist das alchemistische Zeichen für Erde — das stabilste und beständigste Element. Erde ist Fundament und Fruchtbarkeit zugleich. Als Tattoo steht es für Verwurzelung, körperliche Stärke und die Überzeugung dass echte Kraft im Fundament liegt das man nicht sieht.",t:["magie","okkult","balance","natur","resilienz"]},
    {n:"Sol (Sonne/Gold ☉)",g:"☉",b:"In der Alchemie steht Sol für das Gold, das Bewusstsein und das männliche Sonnenprinzip. Die Sonne ist die vollkommene Manifestation des Lichts. Als Tattoo steht Sol für Vollkommenheit, das höchste Bewusstsein und die strahlende Energie, die alles belebt und erleuchtet.",t:["magie","okkult","erfolg","spirituell","männlichkeit"]},
    {n:"Luna (Mond/Silber ☽)",g:"☽",b:"In der Alchemie steht Luna für das Silber, das Unbewusste und das weibliche Mondprinzip. Der Mond reflektiert das Sonnenlicht — er empfängt und gibt weiter. Als Tattoo steht Luna für Intuition, das Unbewusste, weibliche Weisheit und die Kraft der stillen Reflexion.",t:["magie","okkult","intuition","weiblichkeit","spirituell"]},
    {n:"Merkur (Quecksilber ☿)",g:"☿",b:"Merkur ist in der Alchemie das fließende, wandelbare Prinzip — weder fest noch flüssig, weder männlich noch weiblich. Er steht für Transformation, Kommunikation und die Verbindung zwischen Gegensätzen. Als Tattoo symbolisiert er Wandelbarkeit, Geist zwischen den Welten und die Fähigkeit, alle Grenzen zu überschreiten.",t:["magie","okkult","transformation","weisheit","trickster"]},
    {n:"Rebis",g:"☿",b:"Rebis — der 'doppelte Ding' — ist das Bild des vollendeten alchemistischen Werkes: ein Mensch mit männlichem und weiblichem Körper vereint. Es steht für die vollständige innere Integration von Gegensätzen. Als Tattoo symbolisiert es Ganzheit, die Vereinigung aller Gegensätze im Selbst und die vollendete Transformation.",t:["einheit","magie","okkult","transformation","balance"]}
  ],
  okkultismus_kabbalah:[
    {n:"Lebensbaum (Sephiroth)",g:"✡",b:"10 Sephiroth des Lebensbaums — Struktur der göttlichen Emanation, Weg zur Erleuchtung",t:["spirituell","weisheit","magie","okkult","einheit"]},
    {n:"Kether (Krone)",g:"👑",b:"Kether ist die höchste der zehn Sephiroth im Lebensbaum der Kabbalah — die Krone die dem Göttlichen am nächsten ist. Sie steht für die erste Emanation des Unendlichen, reines Sein jenseits aller Attribute. Als Tattoo steht Kether für das Streben nach der höchsten spirituellen Ebene und die Berührung des Göttlichen.",t:["spirituell","führung","magie","okkult","ewigkeit"]},
    {n:"Malkuth (Königreich)",g:"⬡",b:"Malkuth ist die unterste Sephira des Lebensbaums — das Königreich, die physische Welt. Sie empfängt alle Energie der anderen Sephiroth. Als Tattoo steht sie für die Heiligkeit des Körpers und der materiellen Welt, die Überzeugung dass das Göttliche in der Materie wohnt und die Erde selbst ein spiritueller Ort ist.",t:["spirituell","natur","balance","okkult","resilienz"]},
    {n:"Ain Soph (Unendlichkeit)",g:"∞",b:"Ain Soph — das Grenzenlose — ist jenseits des Lebensbaums in der Kabbalah. Es ist das Unendliche das keine Attribute hat, weder Sein noch Nichtsein. Als Tattoo steht es für die mystische Erfahrung des Unbegreiflichen, die Demut vor dem Unendlichen und die kabbalistische Überzeugung dass hinter allem eine grenzenlose Quelle liegt.",t:["ewigkeit","magie","spirituell","okkult","einheit"]},
    ],
  okkultismus_wicca:[
    {n:"Dreifacher Mond (Triple Moon)",g:"☽○☾",b:"Der dreifache Mond — zunehmender Mond, Vollmond, abnehmender Mond — symbolisiert die drei Gesichter der Göttin: Maiden (Jungfrau), Mother (Mutter) und Crone (Alte Weise). Er steht für die drei Phasen des weiblichen Lebens und die zyklische Natur aller Dinge. Als Tattoo steht er für weibliche Kraft, Intuition und die heilige Verbindung mit den Mondzyklen.",t:["weiblichkeit","spirituell","magie","okkult","transformation"]},
    {n:"Triquetra (Dreiheit)",g:"☘",b:"Die Triquetra — drei ineinander verflochtene Vesica-Piscis-Formen — ist ein uraltes keltisches und wiccanisches Symbol. Sie steht für die heilige Dreiheit: Vergangenheit-Gegenwart-Zukunft, Geist-Seele-Körper oder Maiden-Mother-Crone. Als Tattoo steht sie für Einheit in der Dreifaltigkeit und die ewige Verbindung aller Dinge.",t:["einheit","spirituell","magie","okkult","ewigkeit"]},
    {n:"Hexenknotenwerk",g:"🔯",b:"Der Hexenknoten — vier verschlungene Kreise — ist ein altes Schutzsymbol der europäischen Volksmagie. Er bindet böse Energien und schützt Haus und Person. Als Tattoo steht er für magischen Schutz, die Kraft gebundener Intention und die Weisheit der alten Volksmagie.",t:["schutz","magie","okkult","einheit","spirituell"]},
    {n:"Gehörnter Gott",g:"🌙",b:"Der Gehörnte Gott der Wicca-Tradition — Herr des Waldes und der wilden Dinge — steht für die männliche Polarität der Göttin gegenüber. Er ist der Jäger und der Gejagte, Leben und Tod zugleich. Als Tattoo steht er für die Kraft der Wildnis, das männliche Naturprinzip und die wiccanische Einheit von Leben und Tod.",t:["männlichkeit","natur","spirituell","magie","okkult"]},
    ],
  okkultismus_tarot:[
    {n:"Der Narr (0)",g:"🃏",b:"Der Narr ist die nullte Karte des Tarots — er steht am Anfang und am Ende aller Reisen. Mit seinem Bündel auf dem Rücken und dem Blick gen Himmel tritt er sorglos in den Abgrund. Er symbolisiert pures Vertrauen, neuen Anfang und die Bereitschaft, das Unbekannte anzunehmen. Als Tattoo steht er für Mut zum Neubeginn und das Vertrauen ins Leben.",t:["neubeginn","freiheit","mut","magie","transformation"]},
    {n:"Der Magier (I)",g:"✋",b:"Der Magier steht vor einem Tisch mit allen vier Tarot-Symbolen (Stab, Kelch, Schwert, Münze) und zeigt damit, dass er alle Werkzeuge hat. Ein Arm zeigt zum Himmel, der andere zur Erde — As above so below. Als Tattoo steht er für Manifestationskraft, Willenskraft und die Überzeugung, dass alles was man braucht bereits vorhanden ist.",t:["stärke","weisheit","magie","okkult","führung"]},
    {n:"Die Hohepriesterin (II)",g:"🌙",b:"Die Hohepriesterin sitzt zwischen zwei Säulen — einer schwarzen (B für Boaz) und einer weißen (J für Jachin). Sie hält die Tora und trägt eine Mondkrone. Sie steht für verborgenes Wissen, Intuition und das Geheimnis des Unbewussten. Als Tattoo steht sie für feminine Weisheit, das Vertrauen in innere Stimmen und das Mysterium.",t:["intuition","weisheit","weiblichkeit","magie","okkult"]},
    {n:"Die Herrscherin (III)",g:"♀",b:"Die Herrscherin sitzt in einem üppigen Garten und trägt eine Sternenkrone. Sie verkörpert Mutter Natur, Fülle und schöpferische Kraft. Als Tattoo steht sie für mütterliche Energie, kreative Schöpferkraft, Fülle und die Verbindung mit der fruchtbaren Kraft der Natur.",t:["weiblichkeit","natur","liebe","magie","okkult"]},
    {n:"Der Eremit (IX)",g:"🕯",b:"Der Eremit steht allein auf einem Berggipfel mit einer Laterne. Er symbolisiert den weisen alten Mann, der sein Licht für andere hält aber seinen eigenen Weg gehen muss. Als Tattoo steht er für Selbstreflexion, den Mut zur Einsamkeit und die Weisheit die nur im Rückzug von der Welt gefunden werden kann.",t:["weisheit","selbstliebe","achtsamkeit","magie","okkult"]},
    {n:"Das Rad des Schicksals (X)",g:"☸",b:"Das Rad des Schicksals dreht sich unaufhörlich — oben wird unten, Glück wird Unglück. Es steht für Karma, Zyklen und die unaufhaltsame Bewegung des Lebens. Als Tattoo erinnert es daran, dass alles sich wandelt und kein Zustand permanent ist — weder das Leid noch das Glück.",t:["transformation","vergänglichkeit","magie","okkult","zeit"]},
    {n:"Der Tod (XIII)",g:"💀",b:"Die Todeskarte zeigt einen Ritter in schwarzer Rüstung, der über alle Schichten der Gesellschaft reitet. Sie bedeutet selten wörtlichen Tod — viel häufiger steht sie für das Ende eines Kapitels und den Beginn eines neuen. Als Tattoo steht sie für die Bereitschaft, Altes loszulassen damit Neues entstehen kann.",t:["transformation","loslassen","magie","okkult","tod"]},
    {n:"Der Stern (XVII)",g:"⭐",b:"Der Stern zeigt eine nackte Frau die Wasser in einen See und auf die Erde gießt. Nach dem Turm — der Zerstörung — kommt der Stern der Hoffnung. Als Tattoo steht er für Erneuerung nach Dunkelheit, das Vertrauen in die Zukunft und die Gewissheit, dass nach jedem Sturm wieder Sterne zu sehen sind.",t:["hoffnung","heilung","magie","okkult","neubeginn"]},
    {n:"Der Mond (XVIII)",g:"🌕",b:"Der Mond erhellt die Nacht nur halb — er steht für Illusion, Unbewusstes und die Welt der Träume. Ein Krebs kriecht aus dem Wasser, ein Wolf und ein Hund heulen. Als Tattoo steht er für das Eintauchen in die eigene Tiefe, die Reise durch das Unbewusste und die Bereitschaft, sich den eigenen Ängsten zu stellen.",t:["intuition","magie","okkult","weiblichkeit","transformation"]},
    {n:"Die Sonne (XIX)",g:"☀",b:"Die Sonne ist eine der positivsten Karten des Tarots. Ein Kind reitet auf einem weißen Pferd unter einer strahlenden Sonne. Sie steht für Freude, Klarheit, Erfolg und die unschuldige Lebensfreude des Kindes. Als Tattoo symbolisiert sie Lebensfreude, strahlende Energie und die Gewissheit, dass das Gute siegt.",t:["glück","erfolg","magie","okkult","hoffnung"]},
    {n:"Die Welt (XXI)",g:"🌍",b:"Die Welt ist die letzte Karte des großen Arcanum — eine Tänzerin in einem Lorbeerkranz, umgeben von den vier Elementen. Sie steht für Vollendung, Ganzheit und den Abschluss eines großen Zyklus. Als Tattoo steht sie für das Erreichen eines wichtigen Ziels, innere Vollständigkeit und die Bereitschaft für einen neuen Zyklus.",t:["einheit","erfolg","transformation","magie","okkult"]}
  ],

function suchen(q) {
  var el = document.getElementById('res');
  q = q.trim();
  if (!q) {
    el.innerHTML = '<div class="hint">Tippe einen Begriff — Ergebnisse erscheinen sofort.<br><br><b>Beispiele:</b> Selbstliebe · Wolf · Rabe · Chakra · Unalome · Pentagramm · Koi · Vergänglichkeit · Treue</div>';
    return;
  }
  var ql = q.toLowerCase(), ws = ql.split(/\s+/);

  // Kategorie-Labels
  var catLabels = {
    'nordisch':'⚡ Nordisch / Runen','keltisch':'🍀 Keltisch','aegyptisch':'𓂀 Ägyptisch',
    'japanisch':'⛩ Japanisch','spirituell':'☯ Spirituell','amazigh':'ⵣ Amazigh / Berber',
    'astrologie':'✨ Astrologie','alchemie':'🔥 Alchemie','tribal':'🌊 Tribal / Polynesisch',
    'griechisch':'🏛 Griechisch','aztekisch':'☀ Aztekisch','hinduistisch':'🕉 Hinduistisch',
    'slawisch':'⭐ Slawisch','voodoo':'🌺 Voodoo / Adinkra','nativeamerican':'🪶 Native American',
    'chinesisch':'🐉 Chinesisch','tierkreis_west':'♈ Westlicher Tierkreis',
    'tierkreis_china':'🐀 Chinesischer Tierkreis','sternbilder':'🌌 Sternbilder',
    'tiere_nordisch':'🐺 Nordische Tiere','tiere_aegypten':'🐈 Ägyptische Tiere',
    'tiere_nativ':'🦬 Native American Tiere','tiere_japan':'🦊 Japanische Tiere',
    'tiere_keltisch':'🦌 Keltische Tiere','tiere_hinduistisch':'🐘 Hinduistische Tiere',
    'tiere_buddhist':'🕊 Buddhistische Tiere','tiere_azteken':'🐆 Aztekische Tiere',
    'tiere_slawisch':'🔥 Slawische Tiere','selbstliebe_achtsamkeit':'🪞 Selbstliebe & Achtsamkeit',
    'unalome':'𑁍 Unalome','chakren':'🔮 Chakren','hinduistisch_vedisch':'🕉 Hinduistisch / Vedisch',
    'okkultismus_hermetik':'⛤ Okkultismus & Hermetik','okkultismus_alchemie':'⚗ Alchemie',
    'okkultismus_kabbalah':'✡ Kabbalah','okkultismus_wicca':'☽ Wicca & Hexerei',
    'okkultismus_tarot':'🃏 Tarot','heilige_geometrie':'🌀 Heilige Geometrie',
    'tiere_aegyptisch':'🐱 Ägyptische Tiere','tiere_japanisch':'🦊 Japanische Tiere',
    'tiere_keltisch2':'🦌 Keltische Tiere','tiere_griechisch':'🦉 Griechische Tiere',
    'tiere_chinesisch':'🐉 Chinesische Tiere','tiere_indianisch':'🦅 Native American Tiere',
    'tiere_hinduistisch2':'🐘 Hinduistische Tiere','tiere_aztekisch':'🐆 Aztekische Tiere',
    'tiere_insekten':'🐝 Insekten & Käfer','tiere_afrikanisch':'🦁 Afrikanische Tiere',
    'vergaenglichkeit':'⏳ Vergänglichkeit','balance_harmonie':'☯ Balance & Harmonie',
    'resilienz_loslassen':'🌊 Resilienz & Loslassen','mut_hoffnung':'🦁 Mut & Hoffnung',
    'okkultismus_tarot2':'🃏 Tarot'
  };

  function matches(s) {
    return ws.some(function(w) {
      return s.n.toLowerCase().indexOf(w)>=0 ||
        (s.b && s.b.toLowerCase().indexOf(w)>=0) ||
        (s.t && Array.isArray(s.t) && s.t.some(function(t){ return t.indexOf(w)>=0; }));
    });
  }

  function gUrl(n) { return 'https://www.google.com/search?q=Tattoo+'+encodeURIComponent(n)+'+Symbol+Bedeutung'; }

  function karte(sym, name, desc, gold) {
    return '<a class="karte'+(gold?' gold-karte':'')+'" href="'+gUrl(name)+'" target="_blank">'
      +'<div class="sym-box">'+sym+'</div>'
      +'<div class="karte-info">'
      +'<div class="karte-name'+(gold?' gold':'')+'">'+name+'</div>'
      +(desc?'<div class="karte-desc">'+desc+'</div>':'')
      +'</div>'
      +'<span class="google-btn">Google →</span></a>';
  }

  var h = '';
  var totalSym = 0;

  // Bedeutungen
  var fM = MEANS.filter(function(m) {
    return ws.some(function(w) { return m.k.indexOf(w)>=0 || m.t.toLowerCase().indexOf(w)>=0; });
  });
  if (fM.length) {
    h += '<div class="sek"><div class="sek-titel">Bedeutung & Symbolik ('+fM.length+')</div>';
    fM.forEach(function(m){ h += karte(m.e, m.t, '', true); });
    h += '</div>';
  }

  // Symbole gruppiert nach Kategorie
  var grouped = {};
  var groupOrder = [];
  Object.entries(SYMBOLE).forEach(function(entry) {
    var cat = entry[0], arr = entry[1];
    // Duplikate nur INNERHALB einer Kategorie entfernen
    var seenInCat = {};
    var hits = arr.filter(function(s) {
      if (!matches(s)) return false;
      var key = s.n.toLowerCase().replace(/[^a-z0-9äöü]/g,'');
      if (seenInCat[key]) return false;
      seenInCat[key] = true;
      return true;
    });
    if (hits.length > 0) {
      grouped[cat] = hits;
      groupOrder.push(cat);
      totalSym += hits.length;
    }
  });

  if (totalSym > 0) {
    groupOrder.forEach(function(cat) {
      var hits = grouped[cat];
      var label = catLabels[cat] || cat;
      h += '<div class="sek"><div class="sek-titel">'+label+' ('+hits.length+')</div>';
      hits.forEach(function(s){ h += karte(s.g||s.e||'◆', s.n, s.b||'', false); });
      h += '</div>';
    });
  }

  // Traditionen
  var fT = TRADS.filter(function(t) {
    return ws.some(function(w) {
      return t.k.indexOf(w)>=0 || t.t.toLowerCase().indexOf(w)>=0 || (t.d && t.d.toLowerCase().indexOf(w)>=0);
    });
  });
  if (fT.length) {
    h += '<div class="sek"><div class="sek-titel">Traditionen ('+fT.length+')</div>';
    fT.forEach(function(t){ h += karte(t.e, t.t, t.d||'', false); });
    h += '</div>';
  }

  if (!h) h = '<div class="leer">Keine Treffer für <b>'+q+'</b> — probiere: Wolf · Lotus · Chakra · Rabe</div>';
  el.innerHTML = h;
}
