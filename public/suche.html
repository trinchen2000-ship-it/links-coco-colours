<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symbol-Suche · Coco Colours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-dim:rgba(201,168,76,.12);--card:#161616;--card2:#1c1c1c;--border:#272727;--border2:#333;--muted:#666;--white:#f0ede8}
body{background:#0a0a0a;color:var(--white);font-family:'Poppins',sans-serif;min-height:100vh;padding-bottom:60px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#0d0d0d;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar-title{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--gold)}
.back-btn{padding:6px 12px;border:1px solid var(--border);border-radius:7px;font-size:11px;color:var(--muted);text-decoration:none}
.sbox{display:flex;gap:8px;margin:16px 18px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.sbox:focus-within{border-color:var(--gold)}
#q{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Poppins',sans-serif;font-size:16px}
#q::placeholder{color:var(--muted)}
#sbtn{background:var(--gold);border:none;color:#0a0a0a;font-size:12px;font-weight:700;padding:6px 14px;border-radius:7px;cursor:pointer;font-family:'Poppins',sans-serif;flex-shrink:0}
#results{padding:0 18px}
.sec{margin-bottom:20px}
.lbl{font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.chips{display:flex;flex-direction:column;gap:10px}
.chip{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--border2);border-radius:12px;background:var(--card);color:var(--white);text-decoration:none}
.chip.g{border-color:var(--gold);background:var(--gold-dim)}
.chip-e{font-size:28px;flex-shrink:0;width:40px;text-align:center}
.chip-sym{font-size:32px;flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:10px;font-family:serif;line-height:1}
.chip-info{flex:1;min-width:0}
.chip-name{font-size:14px;font-weight:500;color:var(--white)}
.chip-name.gold{color:var(--gold)}
.chip-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4}
.chip-google{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 10px;background:none;cursor:pointer;white-space:nowrap;flex-shrink:0;text-decoration:none}
.chip-google:hover{border-color:var(--gold);color:var(--gold)}
.div{height:1px;background:var(--border);margin:0 0 20px}
.hint{padding:24px 0;color:var(--muted);font-size:13px;line-height:1.8}
.hint b{color:var(--white)}
</style>
</head>
<body>
<div class="topbar">
  <span class="topbar-title">🔍 SYMBOL-SUCHE</span>
  <a href="/berater" class="back-btn">← Zum Berater</a>
</div>
<div class="sbox">
  <input id="q" type="text" placeholder="z.B. Selbstliebe, Wolf, Lotus, Stärke …" autocomplete="off"
    oninput="suchen(this.value)" onkeydown="if(event.key==='Enter')suchen(this.value)">
  <button id="sbtn" onclick="suchen(document.getElementById('q').value)">Suchen</button>
</div>
<div id="results">
  <div class="hint">Tippe einen Begriff — Ergebnisse erscheinen sofort.<br><br>
  <b>Beispiele:</b> Selbstliebe · Freiheit · Wolf · Lotus · Stärke · Schutz · Japan</div>
</div>
