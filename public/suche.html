  astrologie:[
    {n:"Widder ♈",g:"♈",b:"Widder (21. März - 20. April) ist das erste Zeichen des Tierkreises — der Anfang, der erste Schritt. Regiert von Mars steht er für Pioniergeist, Mut und Energie. Der Widder stößt mit den Hörnern voran ohne Zögern. Als Tattoo steht er für den Mut zum ersten Schritt, Leadership und die unaufhaltsame Energie des Anfängers.",t:"mut,stärke,führung"},
    {n:"Stier ♉",g:"♉",b:"Stier (21. April - 21. Mai) steht für Beständigkeit, Sinnlichkeit und Erdverbundenheit. Regiert von Venus liebt er Schönheit, Komfort und Beständigkeit. Als Tattoo steht er für Verlässlichkeit, Genuss des Lebens, Ausdauer und die Kraft die in Ruhe und Beständigkeit liegt.",t:"ausdauer,stärke,stabilität"},
    {n:"Zwillinge ♊",g:"♊",b:"Zwillinge (22. Mai - 21. Juni) stehen für Dualität, Kommunikation und Neugier. Regiert von Merkur sind sie wandelbar, kommunikativ und immer auf der Suche nach neuem Wissen. Als Tattoo steht das Zwillingssymbol für geistige Beweglichkeit, die Fähigkeit verschiedene Perspektiven einzunehmen und die Freude am Austausch.",t:"transformation,kreativität"},
    {n:"Krebs ♋",g:"♋",b:"Krebs (22. Juni - 22. Juli) steht für Fürsorge, Intuition und Heimat. Regiert vom Mond ist er emotional, schützend und tief verwurzelt in Familie und Tradition. Als Tattoo steht er für mütterliche Fürsorge, emotionale Tiefe und die Kraft die in der Verbindung mit Heimat und Familie liegt.",t:"liebe,intuition,heimat"},
    {n:"Löwe ♌",g:"♌",b:"Löwe (23. Juli - 22. August) steht für Kreativität, Selbstausdruck und Führung. Regiert von der Sonne liebt er Aufmerksamkeit und strahlt natürliche Autorität aus. Als Tattoo steht er für Stolz im positiven Sinne, kreative Selbstverwirklichung und die natürliche Würde der eigenen Person.",t:"stärke,mut,führung"},
    {n:"Jungfrau ♍",g:"♍",b:"Jungfrau (23. August - 22. September) steht für Präzision, Dienst und Analyse. Regiert von Merkur liebt sie Ordnung, Detailgenauigkeit und das Verbessern. Als Tattoo steht sie für Handwerkskunst, die Kraft des Dienstes am Ganzen und die Schönheit die in der Perfektion des Details liegt.",t:"weisheit,ausdauer"},
    {n:"Waage ♎",g:"♎",b:"Waage (23. September - 23. Oktober) steht für Balance, Gerechtigkeit und Schönheit. Regiert von Venus sucht sie immer nach Harmonie und dem gerechten Ausgleich. Als Tattoo steht sie für diplomatische Stärke, ästhetisches Empfinden und die tiefe Überzeugung dass Gerechtigkeit und Schönheit die Welt zusammenhalten.",t:"gleichgewicht,harmonie"},
    {n:"Skorpion ♏",g:"♏",b:"Skorpion (24. Oktober - 22. November) steht für Transformation, Intensität und verborgene Tiefen. Regiert von Pluto taucht er in die dunkelsten Tiefen und kommt verändert wieder. Als Tattoo steht er für radikale Ehrlichkeit, die Kraft der Transformation und das Vertrauen in die eigene Fähigkeit, jede Tiefe zu überleben.",t:"transformation,stärke"},
    {n:"Schütze ♐",g:"♐",b:"Schütze (23. November - 21. Dezember) steht für Freiheit, Philosophie und Abenteuer. Regiert von Jupiter strebt er immer nach dem Größeren und Weiseren. Als Tattoo steht er für die Sehnsucht nach Weite, philosophischen Geist und die unaufhaltsame Suche nach Wahrheit und Bedeutung.",t:"freiheit,weisheit"},
    {n:"Steinbock ♑",g:"♑",b:"Steinbock (22. Dezember - 20. Januar) steht für Ambition, Disziplin und Beharrlichkeit. Regiert von Saturn klettert er Schritt für Schritt — sicher und beharrlich — zum Gipfel. Als Tattoo steht er für Ausdauer, die Bereitschaft für langfristige Ziele zu arbeiten und die Stärke die durch Selbstdisziplin entsteht.",t:"ausdauer,erfolg"},
    {n:"Wassermann ♒",g:"♒",b:"Wassermann (21. Januar - 19. Februar) steht für Originalität, Humanismus und Rebellion. Regiert von Uranus denkt er weit voraus und bricht Konventionen. Als Tattoo steht er für das Streben nach einer besseren Welt, intellektuelle Unabhängigkeit und die Bereitschaft, anders zu sein als alle anderen.",t:"freiheit,identität"},
    {n:"Fische ♓",g:"♓",b:"Fische (20. Februar - 20. März) stehen für Mitgefühl, Spiritualität und Träumerei. Regiert von Neptun schwimmen zwei Fische in entgegengesetzte Richtungen — Spannung zwischen Realität und Traum. Als Tattoo stehen sie für spirituelle Tiefe, grenzenloses Mitgefühl und die Gabe, die verborgene Schönheit hinter der Wirklichkeit zu sehen.",t:"liebe,intuition,spirituell"},
    {n:"Sonne ☉",g:"☉",b:"Die Sonne in der Astrologie steht für das Kernwesen, das bewusste Ego und die Lebenskraft. Sie repräsentiert unsere wesentlichste Identität — das, was wir in unserem Herzen sind. Als Tattoo steht das Sonnensymbol für das authentische Selbst, die Kraft des eigenen Wesens und den strahlenden Kern der Persönlichkeit.",t:"stärke,licht,identität"},
    {n:"Mond ☽",g:"☽",b:"Der Mond in der Astrologie steht für Emotionen, das Unbewusste und die innere Welt. Er repräsentiert die mütterliche Energie, Intuition und unsere emotionalen Reaktionen. Als Tattoo steht das Mondsymbol für emotionale Tiefe, Intuition, die Verbindung mit dem Unbewussten und die feminine Mondenergie.",t:"intuition,spirituell,weiblichkeit"},
    {n:"Venus ♀",g:"♀",b:"Venus — Göttin der Liebe und Schönheit — steht in der Astrologie für Liebe, Schönheit, Werte und Beziehungen. Das Venussymbol ist auch das Zeichen für Weiblichkeit. Als Tattoo steht es für Liebe, Schönheitssinn und die Wertschätzung des Lebendigen.",t:"liebe,schönheit,harmonie"},
    {n:"Mars ♂",g:"♂",b:"Mars — Gott des Krieges — steht in der Astrologie für Energie, Antrieb, Leidenschaft und Willen. Das Marssymbol ist auch das Zeichen für Männlichkeit. Als Tattoo steht es für Entschlossenheit, Leidenschaft, die Kraft des Handelns und die mutige Konfrontation mit Hindernissen.",t:"mut,stärke,energie"},
    {n:"Merkur ☿",g:"☿",b:"Merkur — Gott der Kommunikation, des Handels und der Reisenden — steht in der Astrologie für Denken, Sprechen und Lernen. Als Tattoo steht das Merkursymbol für Kommunikationsstärke, geistige Wendigkeit und die Fähigkeit, komplexe Ideen auszudrücken.",t:"weisheit,kreativität,geist"},
    {n:"Jupiter ♃",g:"♃",b:"Jupiter — König der Götter — steht in der Astrologie für Wachstum, Optimismus, Philosophie und Wohlstand. Er ist der Planet des großen Glücks. Als Tattoo steht das Jupitersymbol für Expansion, Weisheit, Großzügigkeit und die Überzeugung, dass das Leben Fülle bereithält.",t:"erfolg,glück,wachstum,weisheit"},
    {n:"Saturn ♄",g:"♄",b:"Saturn — Gott der Zeit und Grenzen — steht in der Astrologie für Disziplin, Struktur, Karma und Lektionen. Er ist der 'große Lehrer'. Als Tattoo steht das Saturnsymbol für Selbstdisziplin, die Akzeptanz von Grenzen als Lehrer und den Respekt vor dem Karma der eigenen Handlungen.",t:"ausdauer,transformation,weisheit"},
    {n:"Uranus ♅",g:"♅",b:"Uranus — der Gott des Himmels — steht in der Astrologie für Rebellion, Originalität und plötzlichen Wandel. Er wurde 1781 entdeckt und brachte damit eine Revolution in die Astronomie. Als Tattoo steht das Uranussymbol für Durchbrechung von Konventionen, revolutionäres Denken und die Kraft plötzlicher Befreiung.",t:"freiheit,transformation,kreativität"},
    {n:"Neptun ♆",g:"♆",b:"Neptun — Gott des Meeres — steht in der Astrologie für Träume, Spiritualität, Illusionen und Mitgefühl. Er löst Grenzen auf und verbindet mit dem Meer des kollektiven Unbewussten. Als Tattoo steht das Neptunsymbol für Kreativität, spirituelle Sensibilität und die Verbindung mit dem Transzendenten.",t:"spirituell,intuition,transformation"},
    {n:"Pluto ♇",g:"♇",b:"Pluto — Gott der Unterwelt — steht in der Astrologie für Transformation, Tod, Wiedergeburt und verborgene Macht. Er steht für die tiefsten, dunkelsten Transformationen. Als Tattoo steht das Plutosymbol für radikale Transformation, die Kraft die aus dem tiefsten Wandel entsteht, und die Bereitschaft, sich vollständig zu erneuern.",t:"transformation,neubeginn,stärke"},
    {n:"Chiron ⚷",g:"⚷",b:"Chiron — der verwundete Heiler der Astrologie — ist ein Kleinplanet zwischen Saturn und Uranus. Als Kentaur der Mythologie konnte er andere heilen aber seine eigene Wunde nicht. Als Tattoo steht er für das Paradox des verwundeten Heilers: unsere tiefsten Verletzungen werden oft zur Quelle unserer größten Stärke.",t:"heilung,transformation,weisheit"},
    {n:"Schwarzer Mond Lilith",g:"⚸",b:"Lilith in der Astrologie steht für das Wilde, Ungezähmte und Abgelehnte im Weiblichen. Als Adams erste Frau weigerte sie sich ihm zu gehorchen und wurde verstoßen. Als Tattoo steht sie für die Rückeroberung weiblicher Kraft, die Ablehnung der Unterwerfung und die heilige Wildheit die in jedem Menschen lebt.",t:"freiheit,weiblichkeit,stärke"},
  ],
  alchemie:[
    {n:"Feuer △",g:"△",b:"Das aufwärtsweisende Dreieck ist das alchemistische Zeichen für Feuer — das transformierendste der vier Elemente. Feuer reinigt, wärmt und vernichtet. In der Alchemie steht es für Energie, Leidenschaft und Aufstieg. Als Tattoo steht das Feuerdreieck für brennende Leidenschaft, transformierende Energie und den Willen der sich nach oben entfaltet.",t:"transformation,stärke,energie"},
    {n:"Wasser ▽",g:"▽",b:"Das abwärtsweisende Dreieck ist das alchemistische Zeichen für Wasser — das Element des Unbewussten und der Intuition. Wasser fließt immer zum tiefsten Punkt. Als Tattoo steht das Wasserdreieck für emotionale Tiefe, die Kraft des Nachgebens und die Weisheit die im Fließen statt im Kämpfen liegt.",t:"intuition,spirituell,fluss"},
    {n:"Luft △̲",g:"⊿",b:"Das Luftdreieck mit Querstrich ist das alchemistische Zeichen für Luft — das Element des Denkens und der Kommunikation. Luft ist überall und verbindet alles. Als Tattoo steht es für Gedankenfreiheit, kreative Intelligenz und die Fähigkeit, sich anzupassen und überall hinzugelangen.",t:"freiheit,weisheit,geist"},
    {n:"Erde ▽̄",g:"⊽",b:"Das Erddreieck mit Querstrich ist das alchemistische Zeichen für Erde — das Element der Stabilität, des Körpers und der Manifestation. Erde ist Fundament und Fruchtbarkeit. Als Tattoo steht es für Erdung, körperliche Stärke und die Kraft die entsteht wenn man verwurzelt und beständig ist.",t:"stabilität,wachstum,heimat"},
    {n:"Feuer+Erde",g:"⋈",b:"Die Kombination von Feuer- und Erddreieck überlagert ergibt ein Hexagramm-ähnliches Symbol, das Geist und Materie vereint. Als Tattoo steht es für die Integration von Energie und Beständigkeit, Leidenschaft und Verwurzelung — die vollkommene Balance zwischen Feuer und Erde.",t:"spirituell,ewigkeit,transformation"},
    
    {n:"Stein der Weisen",g:"⋆",b:"Der Stein der Weisen ist das höchste Ziel der Alchemie — eine mystische Substanz die unedlen Metallen in Gold verwandelt und Unsterblichkeit verleiht. Er steht metaphorisch für die innere Transformation des Alchemisten selbst. Als Tattoo symbolisiert er das lebenslange Streben nach Vervollkommnung und die Überzeugung, dass das Höchste erreichbar ist.",t:"transformation,weisheit,erfolg"},
    {n:"Quintessenz",g:"⊕",b:"Die Quintessenz (fünfte Essenz) ist das mystischste alchemistische Element — der Äther jenseits der vier Elemente. Sie ist der reine Geist hinter der Materie. Als Tattoo steht sie für das Transzendente, die spirituelle Dimension hinter allem Materiellen und das Strebern nach dem Nicht-Greifbaren.",t:"spirituell,ewigkeit"},
    {n:"Sulfur (Seele)",g:"△⊙",b:"In der Alchemie steht Sulfur (Schwefel) für die Seele — das feurige, aktive, männliche Prinzip. Die drei alchemistischen Grundstoffe sind Sulfur (Seele), Merkur (Geist) und Salz (Körper). Als Tattoo steht Sulfur für die feurige Seele, Leidenschaft und das aktive Lebensprinzip das alles antreibt.",t:"stärke,identität,geist"},
    
    {n:"Salz ⊕",g:"⊕",b:"In der Alchemie steht Salz für den Körper — das feste, beständige, kristalline Prinzip. Salz konserviert und bewahrt. Als Tattoo steht es für die Beständigkeit des Körpers, die Würde der materiellen Existenz und die alchemistische Überzeugung, dass der Körper heilig ist.",t:"stabilität,körper,ausdauer"},
    {n:"Sol (Gold)",g:"☀",b:"Das alchemistische Symbol der Sonne steht für das Gold, das höchste aller Metalle, und für das Bewusstsein. Die Sonne ist vollkommene Manifestation des Lichts. Als Tattoo steht Sol für die Vollkommenheit, das strahlende Bewusstsein und das alchemistische Streben nach dem Höchsten.",t:"erfolg,licht,spirituell"},
    {n:"Luna (Silber)",g:"☽",b:"Das alchemistische Symbol des Mondes steht für das Silber und das Unbewusste. Der Mond reflektiert — er empfängt das Sonnenlicht und gibt es weiter. Als Tattoo steht Luna für das Unbewusste, weibliche Intuition und die Kraft die im Empfangen und Weitergeben liegt.",t:"intuition,weiblichkeit,transformation"},
    {n:"Kupfer ♀",g:"♀",b:"Kupfer ist in der Alchemie mit der Göttin Venus verbunden — es ist das wärmste, weichste der Metalle. Das Symbol für Kupfer ist dasselbe wie für Venus und Weiblichkeit. Als Tattoo steht es für Schönheit, Liebe, Wärme und die heilige weibliche Energie die Verbindung schafft.",t:"liebe,heilung,harmonie"},
    {n:"Eisen ♂",g:"♂",b:"Eisen ist in der Alchemie mit dem Gott Mars verbunden — hart, stark, im Feuer geschmiedet. Das Symbol ist identisch mit dem Männlichkeitssymbol. Als Tattoo steht es für Stärke, Entschlossenheit, die Kraft die durch Prüfung entsteht und das aktive männliche Prinzip.",t:"stärke,mut,kraft"},
    
    {n:"Antimony ♁",g:"♁",b:"Antimony (Antimon) war in der Alchemie das Symbol des wilden tierischen Geistes — des rohen, ungezähmten Lebens. Als Tattoo steht es für die ungebändigte Vitalität, die tierische Urkraft die in jedem Menschen schlummert und die Energie die entsteht wenn man seine Natur vollständig akzeptiert.",t:"stärke,natur,transformation"},
    
  ],
  tribal:[
    {n:"Koru",g:"🌀",b:"Die Koru ist eine spiralförmige Form aus der Silberfarn-Pflanze Neuseelands und ein zentrales Maori-Symbol. Sie steht für neues Leben, Wachstum, Kraft und Frieden. Die eingerollte Farnwedel entfaltet sich zur vollen Größe. Als Tattoo steht die Koru für Neubeginn, persönliches Wachstum und den ewigen Kreislauf des Lebens.",t:"neubeginn,wachstum,frieden"},
    {n:"Manaia",g:"⊊",b:"Manaia ist ein heiliges Maori-Wesen — halb Mensch, halb Vogel oder Tier — ein Beschützer und Bote zwischen den Welten. Es steht für spirituellen Schutz und die Verbindung mit dem Übernatürlichen. Als Tattoo steht Manaia für den persönlichen Schutzgeist, die Kraft des spirituellen Beistands und die polynesische Weltanschauung.",t:"schutz,gleichgewicht,spirituell"},
    {n:"Hei Tiki",g:"◉",b:"Das Hei Tiki ist ein Anhänger aus Nephrit in Form eines kleinen Menschen mit großem Kopf — ein Schatz der Maori. Es steht für Fruchtbarkeit, Schutz und Verbindung mit den Vorfahren. Als Tattoo steht es für die Kraft der Ahnen, Fruchtbarkeit in allen Lebensbereichen und tiefe Verbindung mit der Maori-Tradition.",t:"glück,schutz,stärke"},
    {n:"Enata",g:"⊙",b:"Enata sind menschliche Figuren in der polynesischen Tätowierkunst der Marquesas-Inseln. Jede Figur steht für einen Menschen, Vorfahren oder Freund. Als Tattoo können Enata die eigene Familie oder bedeutende Menschen im Leben darstellen und stehen für Verbundenheit, Gemeinschaft und Erinnerung.",t:"verbindung,familie,identität"},
    {n:"Turtle (Honu)",g:"🐢",b:"Die Schildkröte Honu ist eines der heiligsten Tiere der polynesischen Kultur. Sie navigiert über tausende Kilometer Ozean und kehrt immer zum Geburtsort zurück. Sie steht für Navigation, langen Lebensweg und Gesundheit. Als Tattoo symbolisiert sie Orientierung im Leben, Langlebigkeit und die Verbindung mit dem Ozean.",t:"ausdauer,heimat,führung"},
    {n:"Shark Teeth (Niho Mano)",g:"⋏",b:"Das Haifischzahn-Muster (Niho Mano) ist eines der ikonischsten polynesiischen Tattoo-Motive. Der Hai ist der König des Ozeans und steht für Kraft, Schutz und das Streben vorwärts. Das Muster steht auch für Stärke der Vorfahren. Als Tattoo steht es für Schutz in gefährlichen Gewässern und unaufhaltsame Vorwärtsbewegung.",t:"schutz,stärke,mut"},
    {n:"Manta Ray",g:"⋅",b:"Der Mantarochen ist in polynesischen Kulturen ein Symbol für Eleganz, Freiheit und Verbindung mit dem Ozean. Mit seinen breiten Flügeln gleitet er mühelos durch das Wasser. Als Tattoo steht er für Anmut unter Druck, die Freiheit des Meeres und die Fähigkeit, auch in tiefen Gewässern elegant zu navigieren.",t:"freiheit,eleganz,anpassung"},
    {n:"Haida-Adler",g:"🦅",b:"Der Adler ist eines der wichtigsten Wappentiere der Haida-Völker Nordwestkanadiens. Haida-Kunst ist berühmt für ihre kräftigen Linien und charakteristischen Ovoid-Formen. Der Haida-Adler steht für Weitblick, Stärke und die Verbindung mit dem Himmelsreich. Als Tattoo vereint er kraftvolle Kunst mit tiefem spirituellen Symbolgehalt.",t:"freiheit,führung,weisheit"},
    {n:"Spearhead (Maori)",g:"△",b:"Die Speerspitze in der Maori-Tätowierkunst steht für Mut, Kriegertum und den Schutz des Stammes. Maori-Krieger waren gefürchtet und ehrenhaft. Als Tattoo steht sie für Tapferkeit, den Mut zu kämpfen was schützenswert ist, und die Ehrenhaftigkeit des polynesiischen Krieger-Ethos.",t:"stärke,mut,führung"},
    {n:"Fischknochen (Ihu)",g:"⟺",b:"Das Fischknochen-Muster der polynesischen Tätowierkunst steht für Wohlstand, da Fisch die wichtigste Nahrungsquelle der Inselkulturen war. Es symbolisiert auch Stärke — die Wirbelsäule als das Rückgrat des Lebens. Als Tattoo steht es für Überfluss, innere Stärke und die Verbindung mit der ozeanischen Lebensweise.",t:"leben,familie,stärke"},
    {n:"Maori Ta Moko",g:"⊞",b:"Das traditionelle Māori-Tā Moko (Gesichtstätowierung) war keine Dekoration sondern ein Buch — es erzählte die Genealogie, den Status und die Errungenschaften des Trägers. Jedes Muster ist einzigartig. Als Tattoo steht es für die tiefste Form der Identität und die Verbindung mit der polynesischen Tätowier-Tradition.",t:"identität,familie,stärke"},
    {n:"Samoan Pe'a",g:"◼",b:"Das samoanische Pe'a — die traditionelle Ganzkörper-Tätowierung des Mannes — ist eine der komplexesten Tätowierungen der Welt. Es steht für Ehre, Reife und die Übernahme von Verantwortung für die Gemeinschaft. Als Teilmuster steht es für samoanische Identität, Stärke und die Verbindung mit der Kultur.",t:"stärke,ehre,schutz,identität"},
    {n:"Hawaiian Kakau",g:"▲",b:"Das hawaiianische Kakau-Tattooing ist eine uralte Tradition die spirituellen Schutz, Stammeszugehörigkeit und persönliche Geschichte ausdrückt. Es war ein Zeichen von Rang und spiritueller Macht. Als Tattoo steht Kakau für die Verbindung mit der hawaiianischen Tradition und die Kraft des spirituellen Schutzes.",t:"schutz,spirituell,identität"},
    {n:"Tiki",g:"☺",b:"Tiki sind stilisierte menschliche Figuren der polynesischen Kulturen — erste Menschen oder Götter mit großen Augen für Allwissenheit und einer zungenschneidenden Grimasse als Zeichen der Stärke. Als Tattoo steht der Tiki für Schutz vor bösen Geistern, Verbindung mit den Vorfahren und die spirituelle Tiefe der pazifischen Inselkulturen.",t:"schutz,glück,spirituell"},
    {n:"Marquesas-Kreuz",g:"✚",b:"Das Marquesas-Kreuz ist das ikonische Symbol der Marquesas-Inseln — ein gleicharmiges Kreuz mit geschwungenen Enden. Es steht für das Gleichgewicht aller vier Elemente und Himmelsrichtungen. Als Tattoo steht es für kosmisches Gleichgewicht, Harmonie und die Verbindung mit der reichen Tattoo-Tradition der Marquesas.",t:"gleichgewicht,spirituell,verbindung"},
    {n:"Papatūānuku",g:"⊕",b:"Papatūānuku ist die Mutter Erde der Maori — die Urmutter aus deren Körper alle Lebewesen entstanden. Sie liegt unter uns und nährt alles. Als Tattoo steht sie für tiefe Erdverbundenheit, mütterliche Fürsorge der Erde und die Überzeugung dass wir alle Kinder derselben Mutter sind.",t:"heimat,natur,spirituell,mutter"},
  ],
  griechisch:[
    {n:"Meander",g:"⌇",b:"Der Meander ist das klassische griechische Ornament — ein unendliches Mäandermuster, das an den mäandernden Fluss erinnert. Er steht für Unendlichkeit, ewige Bewegung und die Kontinuität des Lebens. Als Tattoo ist er ein elegantes Symbol für die ewige Wiederholung und den endlosen Kreislauf der Existenz.",t:"ewigkeit,verbindung,fluss"},
    {n:"Laurel",g:"🌿",b:"Der Lorbeerkranz war im antiken Griechenland das Symbol des Siegers — bei Olympischen Spielen, in der Dichtkunst und im Krieg. 'Den Lorbeeren ausruhen' kommt daher. Als Tattoo steht er für errungenen Triumph, den Lohn für Anstrengung und die klassische Eleganz des antiken Siegessymbols.",t:"sieg,erfolg,ehre"},
    
    {n:"Labrys",g:"⚒",b:"Die Labrys — die doppelseitige Axt — ist das Hauptsymbol der minoischen Kultur Kretas (2000 v. Chr.) und ein uraltes Zeichen göttlicher weiblicher Macht. Heute ist sie auch ein feministisches Symbol. Als Tattoo steht sie für weibliche Stärke, die Doppelnatur der Kraft (erschaffen und zerstören) und die uralte Göttin-Tradition.",t:"stärke,weiblichkeit,macht"},
    {n:"Phi Φ",g:"Φ",b:"Phi (Φ) ist der Goldene Schnitt — 1,618... — das göttlichste Verhältnis der Mathematik, das in Blütenblättern, Galaxien und im menschlichen Körper vorkommt. Als Tattoo steht es für die verborgene Schönheit der Mathematik, harmonische Proportion und die Überzeugung dass das Universum mathematisch geordnet ist.",t:"schönheit,vollständigkeit,harmonie"},
    {n:"Omega Ω",g:"Ω",b:"Omega ist der letzte Buchstabe des griechischen Alphabets — 'das Ende'. In der Bibel sagt Gott: 'Ich bin das Alpha und das Omega, der Erste und der Letzte.' Als Tattoo steht Omega für Vollendung, das Ende eines Zyklus und die Weisheit die am Ende des Weges wartet.",t:"ewigkeit,vollständigkeit,transformation"},
    {n:"Delta △",g:"△",b:"Delta ist der vierte griechische Buchstabe und steht als Dreieck für Veränderung und Transformation (in Mathematik und Physik). Der Nil-Delta ist das fruchtbarste Land Ägyptens. Als Tattoo steht Delta für den Mut zur Veränderung, die Kraft der Transformation und das Bewusstsein dass Wandel das Einzige Beständige ist.",t:"transformation,neubeginn"},
    {n:"Sigma Σ",g:"Σ",b:"Sigma ist der griechische Buchstabe der Summe — alles zusammengezählt, das Gesamt. Als Tattoo steht Sigma für die Überzeugung, dass das Ganze mehr ist als die Summe seiner Teile, für Vollständigkeit und die Kraft der Integration aller Erfahrungen zu einem ganzen Leben.",t:"vollständigkeit,identität"},
    {n:"Alpha & Omega",g:"Αω",b:"Alpha und Omega — erster und letzter Buchstabe des griechischen Alphabets — stehen für den Anfang und das Ende, die Vollständigkeit der Existenz. Als göttliche Selbstbezeichnung steht die Kombination für Ewigkeit, Vollständigkeit und die Überzeugung dass alles einen Anfang und ein Ende hat.",t:"ewigkeit,vollständigkeit,spirituell"},
    {n:"Gorgoneion",g:"⊛",b:"Das Gorgoneion — das Gesicht der Medusa — wurde in der Antike als Schutzamulett auf Schiffen, Schilden und Gebäuden angebracht. Der Anblick der Medusa versteinerte. Als Tattoo steht es für den Schutz durch Schrecken, die Kraft die im Furchterregenden liegt und die Fähigkeit, Feinde mit dem eigenen Blick abzuwehren.",t:"schutz,stärke,mut"},
    {n:"Trident (Poseidon)",g:"⚡",b:"Der Dreizack des Poseidon ist das Symbol der Macht über das Meer. Mit ihm löste er Stürme aus, spaltete Felsen und erschuf Pferde. Als Tattoo steht er für Beherrschung der Tiefe, unbändige Macht über das Emotionale und die Kraft des Meeresgotts die alles durchdringen kann.",t:"stärke,macht,freiheit"},
    {n:"Pegasus",g:"🦅",b:"Pegasus, das geflügelte Pferd der griechischen Mythologie, entsprang dem Blut der Medusa. Er steht für Inspiration, Kreativität und die Fähigkeit, über das Gewöhnliche hinauszusteigen. Als Tattoo symbolisiert er künstlerische Begeisterung, die Kraft der Vorstellungskraft und die Verbindung zwischen Erde und Himmel.",t:"freiheit,kreativität,transformation"},
    {n:"Schlüssel (Hecate)",g:"🗝",b:"Hecate — Göttin der Magie, der Kreuzwege und der Unterwelt — trägt einen Schlüssel als Symbol. Dieser Schlüssel öffnet Tore zwischen Welten. Als Tattoo steht er für Zugang zu verborgenen Wissen, die Macht der Magie und die Bereitschaft, Türen zu öffnen die anderen verschlossen bleiben.",t:"transformation,weisheit,spirituell"},
    {n:"Ouroboros (griechisch)",g:"◎",b:"Der Ouroboros — die Schlange die sich selbst in den Schwanz beißt — ist ein Symbol das über alle Kulturen bekannt ist. Es steht für den ewigen Kreislauf, Selbstbezüglichkeit und die Einheit aller Dinge. Als Tattoo ist er eines der tiefsten Symbole für Ewigkeit, Selbsterneuerung und die kosmische Einheit.",t:"ewigkeit,zyklus,spirituell"},
    {n:"Hekate-Kreuz",g:"✛",b:"Das Hekate-Kreuz — auch Strophalos oder Hekates Rad — ist ein kreisförmiges Symbol mit einem Labyrinth-ähnlichen Muster. Es steht für die dreifache Göttin Hekate, die Kraft der Magie und den Schutz an Kreuzwegen. Als Tattoo steht es für magische Kraft, den Mut zu Schwellenzeiten und den Schutz der Göttin.",t:"schutz,spirituell,transformation"},
  ],
  aztekisch:[
    {n:"Sonnenstein",g:"☀",b:"Der aztekische Sonnenstein (Tonalpohualli) ist die komplexeste Kalenderdarstellung Mesoamerikas — konzentrische Kreise mit dem Sonnengott Tonatiuh im Zentrum. Er zeigt die 20 Tage-Zeichen und vier vergangene Sonnen-Epochen. Als Tattoo steht er für die aztekische Weltanschauung, kosmische Zeit und die Überzeugung dass wir in der fünften Sonne leben.",t:"stärke,licht,ewigkeit,identität"},
    {n:"Quetzalcoatl",g:"🐍",b:"Quetzalcoatl — die gefiederte Schlange — ist die wichtigste Gottheit Mesoamerikas: Gott der Luft, des Windes, des Morgens und der menschlichen Schöpfung. Er brachte den Menschen Mais und Wissen. Als Tattoo steht er für die Verbindung von Himmel und Erde, Weisheit, Schöpfung und den Mut der schöpferischen Kraft.",t:"transformation,weisheit,spirituell"},
    {n:"Tonatiuh",g:"◉",b:"Tonatiuh ist der aztekische Sonnengott der fünften Sonne — er sitzt im Zentrum des Sonnensteins mit ausgestreckter Zunge. Er forderte Blutopfer um die Sonne am Leuchten zu halten. Als Tattoo steht er für die mächtige Kraft der Sonne, die aztekische Kosmologie und die Überzeugung dass das Leben Opfer erfordert.",t:"stärke,licht,spirituell"},
    {n:"Coatl (Schlange)",g:"〰",b:"Coatl bedeutet auf Nahuatl 'Schlange' — die Schlange ist eines der wichtigsten Tiere in der aztekischen Mythologie. Sie steht für Erneuerung (wegen der Häutung), Erdverbundenheit und kosmische Kraft. Als Tattoo steht sie für Transformation, die Kraft der aztekischen Kosmologie und die heilige Natur der Schlange.",t:"transformation,heilung,neubeginn"},
    {n:"Nahual",g:"🐆",b:"Der Nahual ist das Tiergeist-Alter Ego jedes Menschen in der mesoamerikanischen Tradition. Jeder Mensch hat ein Tier das seine innere Natur spiegelt. Als Tattoo steht der eigene Nahual für die Verbindung mit dem inneren Tier, der tierstischen Seite der Persönlichkeit und der indigenen Lehre der Seelenverwandtschaft mit der Natur.",t:"schutz,stärke,identität,spirituell"},
    {n:"Ollin",g:"✦",b:"Ollin ist das aztekische Symbol für Bewegung und Erderschütterung — es ist das 17. Tageszeichen und steht für die Gegenwart, das 'Jetzt'. Der fünfte und letzte aztekische Schöpfungstag wird durch Erdbeben enden. Als Tattoo steht Ollin für das Leben im gegenwärtigen Moment, die Akzeptanz der Unvorhersehbarkeit und die Kraft der Bewegung.",t:"transformation,stärke,zyklus"},
    {n:"Miquiztli",g:"💀",b:"Miquiztli — der Tod — ist das sechste Tageszeichen des aztekischen Kalenders und steht für den Tod als natürliche Kraft, nicht als Strafe. Als Tattoo steht Miquiztli für die aztekische Akzeptanz des Todes als Teil des Lebens, den Mut im Angesicht der Sterblichkeit und die Überzeugung dass der Tod Anfang ist.",t:"transformation,neubeginn,ewigkeit"},
    {n:"Xochitl (Blume)",g:"✿",b:"Xochitl — die Blume — ist das 20. und letzte Tageszeichen des aztekischen Kalenders und steht für Kunst, Kreativität und göttliche Schöpfung. Xochipilli ist der Gott der Blumen und Künste. Als Tattoo steht Xochitl für die heilige Natur der Kreativität, Schönheit als göttlichen Ausdruck und die aztekische Wertschätzung der Kunst.",t:"schönheit,kreativität,glück"},
    {n:"Tlaloc",g:"🌧",b:"Tlaloc ist der aztekische Regengott mit seinen charakteristischen runden Augen und Fangzähnen. Er war gleichzeitig Lebensspender und Todesbringer — ohne Regen kein Leben, zuviel Regen bedeutet Überschwemmung. Als Tattoo steht er für die duale Natur aller lebenswichtigen Kräfte und die Ehrfurcht vor dem Wetter.",t:"leben,natur,wachstum"},
    {n:"Huitzilopochtli",g:"☀",b:"Huitzilopochtli ist der aztekische Sonnengott und Kriegsgott — Schutzgott der Azteken. Er führte sie zu Tenochtitlan. Sein Name bedeutet 'Kolibri des Südens'. Als Tattoo steht er für die aztekische kriegerische Energie, göttliche Führung und die Kraft des Volkes das seinen Weg findet.",t:"stärke,schutz,mut"},
    {n:"Chalchiuhtlicue",g:"🌊",b:"Chalchiuhtlicue — 'sie mit dem Jaderock' — ist die aztekische Göttin der Gewässer, Seen und Flüsse. Sie hütete die vierte Sonne. Als Tattoo steht sie für die weibliche Kraft des Wassers, die Fürsorge für das Kostbare und die aztekische Wertschätzung des lebensspendenden Elements.",t:"reinheit,schönheit,transformation"},
    {n:"Aztekischer Adler",g:"🦅",b:"Der Adler-Krieger ist einer der höchsten aztekischen Krieger-Orden. Adlerkämpfer trugen Adlerkostüme und galten als die Elite des Krieges. Als Tattoo steht er für aztekische Krieger-Tugenden, Mut im Kampf und die Ehre die durch Tapferkeit erworben wird.",t:"stärke,mut,führung"},
    {n:"Tepeyollotl",g:"🐆",b:"Tepeyollotl — 'Herz des Berges' — ist der aztekische Jagdgott in Form eines Jaguars. Er regiert das Erdbeben und das Echo in Bergen. Als Tattoo steht er für die verborgene Kraft die im Inneren ruht, die jagdhafte Stärke des Jaguars und die aztekische Ehrfurcht vor der Bergwelt.",t:"stärke,transformation,identität"},
    {n:"Xipe Totec",g:"🌱",b:"Xipe Totec — 'Unser Herr der Geschundenen' — ist der aztekische Gott der Jahreszeiten, der Vegetation und der Erneuerung. Er trägt eine abgezogene Haut über seiner eigenen. Als Tattoo steht er für radikale Erneuerung durch schmerzhaften Wandel und die aztekische Akzeptanz dass Wachstum manchmal Häutung erfordert.",t:"neubeginn,wachstum,transformation"},
    {n:"Cem Anahuac",g:"⊕",b:"Cem Anahuac bedeutet 'die ganze Welt' in Nahuatl und steht für das aztekische Weltbild — die Welt als Einheit von Wasser und Land. Als Tattoo steht es für das aztekische kosmische Bewusstsein, die Überzeugung der Einheit aller Dinge und die indigene Weltanschauung Mesoamerikas.",t:"verbindung,ewigkeit,spirituell"},
  ],
  hinduistisch:[
    {n:"Ganesha",g:"🐘",b:"Ganesha — der elefantenköpfige Sohn Shivas und Parvatis — ist der beliebteste Gott des Hinduismus. Er räumt Hindernisse aus dem Weg und segnet jeden Neubeginn. Mit vier Händen, gebrochenem Stoßzahn und seiner Maus als Reittier verkörpert er Weisheit und Humor. Als Tattoo steht er für göttliche Unterstützung bei jedem Anfang.",t:"neubeginn,erfolg,schutz,spirituell"},
    {n:"Trishula",g:"⚔",b:"Shivas Dreizack steht für Schöpfung, Erhaltung und Zerstörung — die drei Grundkräfte des Universums. Er symbolisiert zugleich Vergangenheit, Gegenwart und Zukunft sowie Wille, Wissen und Handlung. Als Tattoo steht der Trishula für die Beherrschung aller drei Zeitebenen und Shivas kosmische Macht.",t:"stärke,spirituell,transformation,gleichgewicht"},
    {n:"Nataraja",g:"♾",b:"Nataraja — 'König des Tanzes' — ist Shiva als kosmischer Tänzer. Er tanzt im Feuerkreis und symbolisiert Schöpfung, Erhaltung und Zerstörung des Universums. Unter seinem Fuß liegt Apasmara — die Unwissenheit. Als Tattoo steht er für die kosmische Energie des Tanzes, den ewigen Kreislauf und Shivas unaufhörliche schöpferische Kraft.",t:"transformation,ewigkeit,spirituell,zyklus"},
    {n:"Chakras (alle 7)",g:"⊕",b:"Die sieben Chakren bilden die Energiesäule des feinstofflichen Körpers — von Muladhara (Erde, Überleben) bis Sahasrara (Geist, Erleuchtung). Sie repräsentieren alle Aspekte menschlicher Erfahrung. Als Tattoo steht die Chakren-Reihe für die vollständige Entwicklung des Menschen auf allen Ebenen.",t:"spirituell,heilung,wachstum"},
    {n:"Hamsa (hinduistisch)",g:"🖐",b:"Die hinduistische Hamsa ist die heilige Gans — das Reittier der Göttin Saraswati und Brahmas. Sie symbolisiert Unterscheidungsvermögen (die Fähigkeit, Milch von Wasser zu trennen). Als Tattoo steht sie für geistige Unterscheidungskraft, spirituelle Reinheit und die Verbindung mit der Göttin der Weisheit.",t:"schutz,spirituell,glück"},
    {n:"Sudarshana Chakra",g:"☸",b:"Das Sudarshana Chakra ist die leuchtende Diskuswaffe des Gottes Vishnu — ein rotierendes Rad mit 108 Zähnen. Es vernichtet das Böse und schützt das Dharma. Als Tattoo steht es für den Schutz des Dharma, Vishnus strahlende Kraft und die Überzeugung dass das Gute am Ende siegt.",t:"schutz,stärke,gerechtigkeit"},
    {n:"Kali-Yantra",g:"△",b:"Das Kali-Yantra ist das geometrische Symbol der Göttin Kali — der mächtigsten und furchteinflößendsten hinduistischen Göttin. Kali vernichtet das Ego und befreit von Illusionen. Als Tattoo steht das Kali-Yantra für radikale Transformation, den Mut zur Auflösung des Ego und die befreiende Kraft der dunklen Göttin.",t:"stärke,schutz,transformation,weiblichkeit"},
    {n:"Padma (Lotus)",g:"🪷",b:"Padma — der Lotus — ist das heiligste Symbol des Hinduismus und Buddhismus. Er wächst aus schlammigem Wasser und blüht makellos. Er ist das Sitz der Götter. Als Tattoo steht er für spirituelle Reinheit, das Aufblühen trotz widriger Umstände und die Überzeugung dass göttliche Vollkommenheit in der Welt möglich ist.",t:"spirituell,neubeginn,reinheit"},
    {n:"Aum mit Auge",g:"ॐ",b:"Die Kombination von Om (ॐ) mit dem Dritten Auge vereint zwei der kraftvollsten hinduistischen Symbole: den Urklang der Schöpfung und das innere Sehen. Als Tattoo steht es für die Verbindung von Klang und Bewusstsein, die simultane Praxis von Mantra und Meditation und den Weg zur inneren Erleuchtung.",t:"spirituell,weisheit,licht"},
    {n:"Sri Chakra",g:"◉",b:"Das Sri Chakra ist eine alternative Bezeichnung für das Sri Yantra — das heiligste geometrische Symbol der Shakta-Tradition. Als Tattoo steht es für die göttliche Mutter, kosmische Schöpfungskraft und die geometrische Darstellung des Universums.",t:"spirituell,weiblichkeit,schöpfung"},
    {n:"Saraswati",g:"🪷",b:"Saraswati — Göttin der Weisheit, Kunst und Sprache — sitzt auf einem weißen Lotus und spielt die Vina. Ihr Tier ist der weiße Schwan oder die Pfau. Als Tattoo steht sie für die heilige Verbindung von Wissen und Kreativität, die Göttin der Musik und die spirituelle Dimension der Kunst.",t:"weisheit,kreativität,spirituell"},
    {n:"Durga (Tiger)",g:"🐯",b:"Durga — die 'Unzugängliche' — ist die mächtigste hinduistische Kriegsgöttin. Sie reitet auf einem Löwen oder Tiger und kämpft gegen den Büffeldämon Mahishasura. Als Tattoo steht sie für weibliche Stärke in ihrer kampflustigsten Form, den Sieg des Göttlichen über das Dunkle und die Kraft der Göttin.",t:"stärke,schutz,weiblichkeit,mut"},
    {n:"Hanuman",g:"🐒",b:"Hanuman — der Affengott — ist der treueste Verehrer Ramas und ein Held der Berge versetzen kann, aber in vollständiger Demut lebt. Er steht für Bhakti (Hingabe), übermenschliche Stärke und selbstlose Loyalität. Als Tattoo steht er für die seltene Verbindung von Kraft und Demut.",t:"stärke,liebe,mut,spirituell"},
    {n:"Nandi (Stier)",g:"🐂",b:"Nandi ist der heilige Stier des Gottes Shiva — sein treuer Begleiter und Wächter. Nandi steht immer vor Shiva-Tempeln und schaut in die Richtung des Gottes. Als Tattoo steht er für bedingungslose Hingabe, treue Begleitung und die hinduistische Ehrfurcht vor der heiligen Kraft des Stiers.",t:"stärke,ausdauer,spirituell"},
    {n:"Kalasha",g:"◎",b:"Der Kalasha — ein Kupfer- oder Tontopf mit Kokosnuss und Mango-Blättern — ist in Indien das Symbol des göttlichen Segens und der Fülle. Er steht für Purnata (Vollständigkeit). Als Tattoo steht er für göttlichen Überfluss, die Vollständigkeit des Lebens und die hinduistische Tradition der auspizösen Zeichen.",t:"glück,erfolg,spirituell"},
    {n:"Bindu",g:"·",b:"Der Bindu — der heilige Punkt — ist in der hinduistischen Kosmologie der Ursprung aller Manifestation. Aus diesem einen Punkt entfaltet sich das gesamte Universum. Er steht für das unmanifestierte Potenzial vor aller Form. Als Tattoo ist er das minimalistische Ur-Symbol: ein Punkt der alles enthält.",t:"spirituell,neubeginn,vollständigkeit"},
  ],
  slawisch:[
    {n:"Kolowrat",g:"✦",b:"Das Kolowrat ist das slawische Sonnenrad mit gebogenen Armen — ein Hakenkreuz im ursprünglichen Sinne als Sonnen- und Glückssymbol. Es steht für die Bewegung der Sonne, kosmische Ordnung und Wohlstand. Als Tattoo steht es für die Verbindung mit der slawischen Tradition und der Kraft des Sonnenlichts.",t:"ewigkeit,licht,zyklus,stärke"},
    {n:"Perun-Zeichen",g:"⚡",b:"Das Perun-Zeichen — ein stilisierter Blitz oder Sonnenrad — ist das Symbol des mächtigsten slawischen Gottes. Perun herrschte über Himmel und Donner und kämpfte ewig gegen den Unterweltgott Veles. Als Tattoo steht es für die Kraft des Donners, göttlichen Schutz und die archaische Kraft des slawischen Himmelsgottes.",t:"schutz,stärke,gerechtigkeit"},
    {n:"Rod-Symbol",g:"◉",b:"Rod ist der erste und höchste slawische Gott — der Schöpfer aller Götter und des Universums. Sein Symbol steht für kosmische Schöpfung, den Ursprung allen Lebens und die Verbindung mit den Vorfahren. Als Tattoo steht es für die Verbindung mit dem Ursprung und der ewigen Schöpferkraft.",t:"heimat,familie,wurzeln,spirituell"},
    {n:"Bereginya",g:"⊞",b:"Bereginya ist die slawische Beschützerin des Hauses und der Familie — eine weibliche Geistgestalt mit erhobenen Armen. Sie findet sich auf traditionellen Stickereien. Als Tattoo steht sie für mütterlichen Schutz, die Kraft der Hausgeister und die slawische Tradition der schützenden weiblichen Energie.",t:"schutz,weiblichkeit,neubeginn"},
    {n:"Triglav",g:"△",b:"Triglav — der 'Dreiköpfige' — ist die slawische Dreifaltigkeitsgottheit, die alle drei Welten repräsentiert: Himmel (Perun), Erde (Svarog), Unterwelt (Veles). Als Tattoo steht er für die slawische Kosmologie, die Einheit der drei Welten und die spirituelle Verbindung mit der vorchristlichen slawischen Tradition.",t:"ewigkeit,weisheit,zyklus"},
    {n:"Molvinets",g:"✡",b:"Molvinets ist ein slawisches Schutzsymbol in Form eines Sonnensymbols oder Knotens. Es schützt vor Krankheit und bösem Blick. Als Tattoo steht es für Schutz aus der slawischen Volkstradition und die Verbindung mit den vorchristlichen Schutzbräuchen der slawischen Völker.",t:"schutz,spirituell"},
    {n:"Ladinets",g:"✦",b:"Ladinets ist ein slawisches Symbol der Liebe und Harmonie — oft in Form von zwei verbundenen Dreiecken oder einem Hexagramm. Er ist dem Gott Lada (Liebe) gewidmet. Als Tattoo steht er für tiefe Liebe, häusliche Harmonie und die slawische Tradition der Liebesgöttin.",t:"liebe,schutz,harmonie"},
    {n:"Weltbaum (Slawisch)",g:"⊕",b:"Der slawische Weltbaum — die kosmische Eiche — verbindet wie Yggdrasil die drei Welten: Himmel (Äste), Erde (Stamm), Unterwelt (Wurzeln). Er ist der Mittelpunkt des slawischen Kosmos. Als Tattoo steht er für kosmische Ordnung, Verwurzelung und die Verbindung aller drei Ebenen der Existenz.",t:"wurzeln,verbindung,spirituell,wachstum"},
    {n:"Veles-Schlange",g:"🐍",b:"Veles, der slawische Unterweltgott, erscheint oft als Schlange oder Drache. Er ist der Herr der Toten, des Viehs und der Magie — ewiger Gegenspieler Peruns. Als Tattoo steht die Veles-Schlange für die Kraft der Unterwelt, verborgene Magie und die Akzeptanz der dunkleren Kräfte des Lebens.",t:"weisheit,transformation,spirituell"},
    {n:"Makosh-Zeichen",g:"⋈",b:"Makosh ist die höchste slawische Göttin — Herrin des Schicksals, des Webens und der Fruchtbarkeit. Sie webt das Schicksal der Menschen. Als Tattoo steht ihr Zeichen für die Verbindung mit dem Schicksal, die Kraft der weiblichen Schöpferin und die slawische Göttin die über alle wacht.",t:"glück,weiblichkeit,erfolg"},
    {n:"Ratiborets",g:"◇",b:"Ratiborets ist ein slawischer Schutzgeist des Kriegers — er wohnt in der Waffe und beschützt den Kämpfer im Kampf. Als Tattoo steht er für die slawische Tradition der Krieger-Spiritualität und die Überzeugung, dass jede echte Kraft einen göttlichen Ursprung hat.",t:"schutz,stärke,mut"},
    {n:"Svarog-Kreuz",g:"⊞",b:"Svarog ist der slawische Himmelsgott und Schmied — er erschuf die Welt und schmiedete die Sonne. Sein Kreuz ist ein komplexes geometrisches Symbol. Als Tattoo steht es für schöpferische Kraft, Handwerkskunst als göttliche Tätigkeit und die slawische Ehrfurcht vor dem Himmelsschmied.",t:"stärke,transformation,schöpfung"},
  ],
  voodoo:[
    {n:"Vévé Baron Samedi",g:"✛",b:"Baron Samedi ist der Herr des Todes im haitianischen Voodoo — jovial, obszön und gleichzeitig heilig. Sein Vévé verbindet Tod und Lebensfreude. Als Tattoo steht es für die Akzeptanz des Todes als Teil des Lebens, schwarzen Humor im Angesicht der Sterblichkeit und die kreolische Kultur Haitis.",t:"transformation,ewigkeit,spirituell"},
    {n:"Vévé Erzulie",g:"♡",b:"Das Vévé der Erzulie Freda — der Liebesgöttin des haitianischen Voodoo — ist ein elegantes Symbol mit Herzen und Blumen. Erzulie steht für Liebe, Schönheit und Weiblichkeit in ihrer höchsten Form. Als Tattoo steht es für die Kraft der Liebe, weibliche Göttlichkeit und die spirituelle Tiefe des karibischen Voodoo.",t:"liebe,schönheit,weiblichkeit"},
    {n:"Vévé Ogou",g:"⚔",b:"Ogou ist der Lwa (Geist) des Krieges und des Feuers im haitianischen Voodoo — ein Krieger der für Gerechtigkeit kämpft. Sein Vévé zeigt Schwerter und Fahnen. Als Tattoo steht es für den Kampf für Gerechtigkeit, kriegerische Stärke und die Bereitschaft, für das Richtige zu streiten.",t:"stärke,schutz,mut"},
    {n:"Vévé Legba",g:"✝",b:"Papa Legba ist der Hüter der Kreuzwege im Voodoo — der erste Lwa der angerufen werden muss, denn er öffnet die Tore zur Geisterwelt. Er erscheint als alter Mann mit einem Stock. Als Tattoo steht sein Vévé für die Öffnung neuer Wege, Kommunikation mit dem Höheren und den Beginn jeder spirituellen Reise.",t:"freiheit,neubeginn,spirituell"},
    {n:"Vévé Damballah",g:"〰",b:"Damballah ist die weiße Schlange des Voodoo — der älteste und reinste Lwa, symbol für Reinheit, Weisheit und kosmische Ordnung. Er spricht nicht sondern zischt. Als Tattoo steht sein Vévé für uralte Weisheit, spirituelle Reinheit und die stille Kraft des kosmischen Gleichgewichts.",t:"weisheit,spirituell,ewigkeit"},
    {n:"Vévé Agwe",g:"🌊",b:"Agwe ist der Lwa des Meeres im Voodoo — Herr aller Gewässer und Schutzpatron der Fischer und Seeleute. Als Tattoo steht sein Vévé für den Schutz auf dem Wasser, die Tiefe des Ozeans als spirituelle Metapher und die karibische Spiritualität der Seefahrernationen.",t:"freiheit,reise,stärke"},
    {n:"Vévé Maman Brigitte",g:"☩",b:"Maman Brigitte ist die Herrin der Friedhöfe im Voodoo — Gemahlin des Baron Samedi. Sie ist die einzige weiße Lwa und mit der keltischen Göttin Brigid verwandt. Als Tattoo steht ihr Vévé für die Weiblichkeit des Todes, Schutz der Verstorbenen und die synkretische Natur des karibischen Voodoo.",t:"schutz,transformation,spirituell"},
    {n:"Adinkra Sankofa",g:"↩",b:"Sankofa zeigt einen Vogel der vorwärtsläuft aber den Kopf zurückdreht. Das Akan-Sprichwort sagt: Es ist nicht falsch zurückzugehen und etwas zu holen was man vergessen hat. Als Tattoo steht Sankofa für die Weisheit aus der Vergangenheit zu lernen ohne in ihr zu verharren — Blick nach vorn mit Wissen um den Weg dahinter.",t:"weisheit,identität,wurzeln,transformation"},
    {n:"Adinkra Gye Nyame",g:"⊛",b:"Gye Nyame — außer Gott — ist das bekannteste Adinkra-Symbol Ghanas und bedeutet: Nichts als Gott. Es steht für die Suprematie des Göttlichen über alle Mächte. Als Tattoo ist es das tiefste Symbol für Gottvertrauen, die Demut des Schöpflings vor dem Schöpfer und die westafrikanische Spiritualität.",t:"spirituell,stärke,ewigkeit"},
    {n:"Adinkra Nyame Dua",g:"⊕",b:"Nyame Dua — Gottes Baum — ist ein Adinkra-Symbol für die Gegenwart Gottes und göttliche Fürsorge. Es steht für heilige Schutzstätten und die Verbindung mit der göttlichen Kraft. Als Tattoo symbolisiert es Schutz durch das Göttliche und die Überzeugung dass Gott stets gegenwärtig ist.",t:"schutz,spirituell,heimat"},
    {n:"Adinkra Dwennimmen",g:"⋈",b:"Dwennimmen — Widderhörner — steht in der Adinkra-Tradition für Stärke und Demut. Der Widder ist stark genug zu kämpfen, aber weise genug zu wissen wann er sich beugen muss. Als Tattoo steht es für die mächtigste Kombination: echte Stärke die keine Demütigung fürchtet.",t:"stärke,weisheit,gleichgewicht"},
    {n:"Adinkra Epa",g:"⊞",b:"Epa — Handschellen — ist ein Adinkra-Symbol für Gesetz, Gerechtigkeit und Sklaverei als Mahnung. Es erinnert an die Pflicht zur Gerechtigkeit und die historische Verantwortung. Als Tattoo steht es für Gerechtigkeit, Freiheit und das Bewusstsein um historisches Unrecht.",t:"gerechtigkeit,freiheit,identität"},
  ],
  nativeamerican:[
    {n:"Traumfänger",g:"⊙",b:"Der Traumfänger der Ojibwe-Tradition wurde über dem Bett aufgehängt — sein Netz fängt böse Träume, die guten Träume gleiten durch das Loch in der Mitte. Der erste Traumfänger wurde von der Spinnfrau Asibikaashi gewoben. Als Tattoo steht er für Schutz während des Schlafes, die Kraft der Intention und die Verbindung mit den Träumen.",t:"schutz,spirituell,heilung"},
    {n:"Thunderbird",g:"🦅",b:"Der Thunderbird ist das mächtigste Wesen vieler nordamerikanischer Kulturen — ein riesiger Adler dessen Augen Blitze sind und dessen Flügel Donner erzeugen. Er kämpft gegen böse Wasserwesen. Als Tattoo steht er für kosmische Macht, den Schutz des Himmelsgeistes und die Kraft die in den Elementen liegt.",t:"stärke,freiheit,spirituell"},
    {n:"Medizinrad",g:"⊕",b:"Das Medizinrad — heiliger Kreis mit vier Himmelsrichtungen — ist das grundlegende spirituelle Symbol vieler Plains-Indianerkulturen. Die vier Richtungen stehen für vier Elemente, vier Lebensalter und vier Aspekte des Selbst. Als Tattoo steht es für ganzheitliches Denken, die Verbindung mit allen Himmelsrichtungen und indigene Weisheit.",t:"gleichgewicht,spirituell,heilung"},
    {n:"Adlerfeder",g:"🪶",b:"Die Adlerfeder ist in der Native-American-Tradition das heiligste aller Geschenke — sie wird nur verliehen für außerordentliche Tapferkeit oder spirituelle Leistung. Sie darf nicht auf den Boden fallen. Als Tattoo steht sie für Ehrung, spirituelle Auszeichnung und die tiefe Verbindung mit dem Geist des Adlers.",t:"freiheit,spirituell,identität"},
    {n:"Schildkröte",g:"🐢",b:"In der griechischen Mythologie ist die Schildkröte mit Hermes verbunden, der aus ihrem Panzer die erste Lyra baute. Sie steht für Weisheit, Langlebigkeit und die Schutzfunktion des Rückzugs. Als Tattoo symbolisiert sie Geduld, langsame aber beständige Bewegung und die Weisheit die mit dem Alter kommt.",t:"heimat,ausdauer,stärke"},
    {n:"Wolf",g:"🐺",b:"Der Wolf ist in den meisten nordamerikanischen Kulturen der Lehrmeister — er zeigt wie man in der Gemeinschaft lebt. Wölfe sind die ältesten Lehrer der Menschheit. Als Tattoo steht der Native-American-Wolf für Loyalität zum Rudel, Weisheit durch Gemeinschaft und die tiefe Verbindung zwischen Wolf und Mensch.",t:"stärke,intuition,führung,identität"},
    {n:"Bär",g:"🐻",b:"Der Bär ist in der Native-American-Tradition das mächtigste Medizintier — Heiler und Krieger zugleich. Er steht für Traumweisheit, mütterliche Stärke und Heilung. Als Tattoo steht er für die doppelte Kraft des Bären: sanft wie eine Mutter aber stark wie ein Krieger wenn es nötig ist.",t:"stärke,heilung,mut"},
    {n:"Vier Winde",g:"✦",b:"Die Vier Winde symbolisieren in der Native-American-Tradition die vier Himmelsrichtungen — Ost, Süd, West, Nord — jede mit eigenen Qualitäten und Schutzgeistern. Als Tattoo stehen sie für die Vollständigkeit des kosmischen Raums, den Schutz aus allen Richtungen und das indigene Weltbild.",t:"gleichgewicht,spirituell,freiheit"},
    {n:"Kokopelli",g:"♬",b:"Kokopelli ist der spielende Flötenspieler des amerikanischen Südwestens — ein Buckeling Trickster der Fruchtbarkeit, Musik und Freude bringt. Als Tattoo steht er für die Lebensfreude, die transformierende Kraft der Musik und die Leichtigkeit die im Spiel liegt. Er erinnert daran, das Leben nicht zu ernst zu nehmen.",t:"neubeginn,glück,kreativität"},
    {n:"Regenbogenschlange",g:"〰",b:"Die Regenbogenschlange ist ein Wesen der australischen Aborigines und vieler anderer Kulturen — eine kosmische Schlange die Wasser und Schöpfung kontrolliert. Als Tattoo steht sie für Schöpfungsmacht, die Verbindung zwischen Wasser und Leben und die Ehrfurcht vor den uralten Schöpfungsmächten.",t:"transformation,heilung,schöpfung"},
    {n:"Pueblo-Sonne",g:"☀",b:"Das Pueblo-Sonnensymbol der Zia-Nation (New Mexico) zeigt vier Gruppen von vier Strahlen — die heilige Zahl vier durchdringt alles. Es steht für Gleichgewicht, die vier Himmelsrichtungen und die Harmonie des Lebens. Als Tattoo steht es für indigenes Gleichgewichtsdenken und die Heiligkeit der Zahl vier.",t:"licht,leben,stärke"},
    {n:"Büffel (Bison)",g:"🦬",b:"Der Büffel war alles für die Plains-Indianer — Nahrung, Kleidung, Unterkunft, Werkzeug und Medizin. Die Büffeljagd war ein heiliger Akt. Als Tattoo steht er für tiefe Dankbarkeit gegenüber der Natur, die Verbindung mit dem Land und die Erinnerung an eine Zeit als Mensch und Tier in Einklang lebten.",t:"stärke,dankbarkeit,gemeinschaft"},
    {n:"Peyote-Blüte",g:"✿",b:"Peyote ist der heilige Kaktus der Huichol und anderer Völker — eine Pflanze der Visionen und spirituellen Einsicht. Die Peyote-Zeremonie öffnet den Geist. Als Tattoo steht die Peyote-Blüte für spirituelle Erfahrung, die Verbindung mit Pflanzengeistern und den mutigen Weg der Selbsterkenntnis.",t:"spirituell,heilung,transformation"},
    {n:"Rabe (Trickster)",g:"🐦",b:"Als Trickster der nordwestamerikanischen Völker erschuf der Rabe die Welt durch List — er stahl das Licht und brachte es in die Welt, befreite die Menschen aus einer Muschel und erfand das Feuer. Als Tattoo steht er für kreative Intelligenz als Schöpfungskraft und die Weisheit die im Chaos liegt.",t:"transformation,weisheit,kreativität"},
    {n:"Schlangenadler",g:"🦅",b:"Der Schlangenadler — Adler der eine Schlange trägt — ist ein mächtiges Symbol in vielen Kulturen, besonders als Gründungszeichen Mexikos. Er vereint Luft und Erde, Himmel und Unterwelt. Als Tattoo steht er für die Überwindung des Niederen durch das Höhere und die Kraft die aus Gegensätzen entsteht.",t:"stärke,gleichgewicht,spirituell"},
  ],
  chinesisch:[
    {n:"Bagua (Ba Gua)",g:"☯",b:"Das Bagua — acht Trigramme — ist das grundlegende Symbol der chinesischen Kosmologie aus dem I Ching. Die acht Trigramme repräsentieren Himmel, Erde, Donner, Wasser, Berg, Wind, Feuer und See. Als Tattoo steht es für die vollständige kosmische Ordnung, Feng-Shui-Schutz und das chinesische Weltbild.",t:"gleichgewicht,schutz,spirituell,ewigkeit"},
    {n:"Drache (Lóng)",g:"龍",b:"Der chinesische Drache Lóng ist fundamental anders als der europäische Drache — er ist gut, weise und bringt Glück und Regen. Als Kaiserlicher Symbol steht er für Macht, Weisheit und kosmische Harmonie. Als Tattoo ist er eines der mächtigsten chinesischen Glückssymbole für Stärke, Weisheit und göttliche Fürsorge.",t:"stärke,glück,schutz"},
    {n:"Phönix (Fènghuáng)",g:"🦅",b:"Der chinesische Phönix Fènghuáng ist das Symbol der Kaiserin und des vollkommenen Paares. Er steht für Harmonie, Tugend und weibliche Gnade. Als Tattoo ist er ein kraftvolles Symbol für weibliche Würde, kosmische Harmonie und die unzerstörbare Schönheit die aus jedem Fall aufsteigt.",t:"transformation,neubeginn,stärke"},
    {n:"双喜 (Doppelglück)",g:"囍",b:"Das Doppelglück-Zeichen 双喜 (Shuāng Xǐ) wird aus zwei chinesischen Zeichen für Freude gebildet und ist das Symbol der Hochzeit und doppelten Freude in China. Als Tattoo steht es für doppeltes Glück, die Vollendung einer Verbindung und den Wunsch nach bleibendem gemeinsamem Glück.",t:"liebe,glück,freude"},
    {n:"福 (Fú)",g:"福",b:"Fú — Glück oder Segen — ist eines der wichtigsten chinesischen Zeichen. Es wird zu Neujahr oft kopfüber aufgehängt damit das Glück 'einfällt'. Als Tattoo steht es für den Wunsch nach Glück, Wohlstand und göttlichem Segen und die tiefe chinesische Überzeugung dass Glück gesucht und eingeladen werden kann.",t:"glück,erfolg"},
    {n:"Koi (Lǐyú)",g:"🐟",b:"Der chinesische Koi-Karpfen (Lǐyú) ist ein Symbol für Ausdauer und Erfolg — wer den Drachen-Tor-Wasserfall hinaufsteigt, wird zum Drachen. Im Chinesischen klingt 鱼 (Fisch) wie 余 (Überfluss). Als Tattoo steht er für materiellen und spirituellen Überfluss, beharrlichen Aufstieg und die Verwandlung durch Ausdauer.",t:"erfolg,ausdauer,mut"},
    {n:"Lotus (Héhuā)",g:"🪷",b:"Der chinesische Lotus (Héhuā) wächst im schlammigen Wasser und blüht makellos — ein Konfuzius-Symbol für moralische Vollkommenheit inmitten von Korruption. Als Tattoo steht er für Reinheit des Herzens, die Fähigkeit schön zu bleiben in schwierigen Umständen und konfuzianische Tugend.",t:"spirituell,neubeginn,reinheit"},
    {n:"Tiger (Hǔ)",g:"🐯",b:"Der chinesische Tiger ist Schutzgott gegen das Böse und Hüter des Westens. Er tötet Dämonen und Krankheiten. Als Tattoo steht er für kraftvollen Schutz, mutige Verteidigung des Eigenen und die chinesische Überzeugung, dass der Tiger der ehrlichste und mutigste aller Kämpfer ist.",t:"stärke,mut,schutz"},
    {n:"Yin-Yang",g:"☯",b:"Das Yin-Yang-Symbol des Taoismus zeigt die fundamentale Dualität der Welt: im Weißen ein schwarzer Punkt, im Schwarzen ein weißer. Yin und Yang sind nicht Gut und Böse sondern komplementäre Kräfte. Als Tattoo steht es für die tiefe Akzeptanz von Gegensätzen als notwendige Einheit.",t:"gleichgewicht,harmonie,ewigkeit"},
    {n:"Glückswolken (Yún)",g:"☁",b:"Yún — die Glückswolken — sind ein klassisches chinesisches Muster das auf Seide, Keramik und Schmuck vorkommt. Wolken stehen für Glück, Wachstum und das Erreichen höherer Ebenen. Als Tattoo verbinden sie chinesische Ästhetik mit dem Wunsch nach Glück und dem Streben nach Höherem.",t:"freiheit,transformation,glück"},
    {n:"Bambus (Zhú)",g:"🎋",b:"Bambus ist in der chinesischen Kultur ein Symbol für Ausdauer, Flexibilität und moralische Integrität. Er biegt sich im Sturm aber bricht nicht. Als eines der vier Gentlemen-Pflanzen steht er für den konfuzianischen Edlen. Als Tattoo steht er für Resilienz, Anpassungsfähigkeit und die Stärke die in der Flexibilität liegt.",t:"stärke,ausdauer,wachstum"},
    {n:"Pflaume (Méihuā)",g:"🌸",b:"Die Pflaumenblüte blüht im Winter — tapfer gegen die Kälte. Sie ist eine der vier Gentlemen-Pflanzen und steht für Ausdauer, Reinheit und Zähigkeit. Als Tattoo ist sie ein Symbol für den Mut im Angesicht widriger Umstände zu blühen und die Schönheit die in schwierigen Zeiten entsteht.",t:"ausdauer,schönheit,stärke"},
    {n:"Chrysantheme (Jú)",g:"🌼",b:"Die Chrysantheme ist in China eine der vier Gentlemen-Pflanzen und blüht im Herbst — Zeichen von Langlebigkeit und Ausdauer. Als Tattoo steht sie für Beständigkeit trotz widrigen Zeiten, Würde im Alter und die östliche Wertschätzung von Langlebigkeit und Anmut.",t:"ausdauer,glück,vollständigkeit"},
    {n:"Schildkröte (Guī)",g:"🐢",b:"Die schwarze Schildkröte (Xuán Wū) ist eines der vier chinesischen Himmels-Wächter und regiert den Norden und Winter. Sie steht für Langlebigkeit, Weisheit und beständige Kraft. Als Tattoo steht sie für ewige Stärke, die Weisheit die mit dem Alter kommt und den chinesischen Respekt vor Beständigkeit.",t:"ausdauer,stabilität,ewigkeit"},
    {n:"Kranich (Hè)",g:"🦢",b:"Der Kranich in China steht für Langlebigkeit, Weisheit und das höhere Leben. Er gilt als 'Vogel der Unsterblichkeit' und transportiert Weise in den Himmel. Als Tattoo steht er für das Streben nach Langlebigkeit, weise Reife und den chinesischen Glauben an die spirituelle Dimension eines langen, weisen Lebens.",t:"ewigkeit,weisheit,schönheit"},
    {n:"Fledermaus (Biān Fú)",g:"🦇",b:"Im Chinesischen klingt Fledermaus (蝠 fú) wie Glück (福 fú) — deshalb gilt sie als mächtiges Glückssymbol. Fünf Fledermäuse stehen für die fünf Arten des Glücks: Gesundheit, Wohlstand, langes Leben, Tugend und friedvoller Tod. Als Tattoo steht sie für umfassendes Glück in allen Lebensbereichen.",t:"glück,erfolg"},
    {n:"Kiefer (Sōng)",g:"🌲",b:"Die Kiefer ist in China Symbol der Langlebigkeit und winterlichen Ausdauer — sie bleibt grün wenn alles andere verdorrt. Mit Bambus und Pflaume bildet sie die drei Winterfreunde. Als Tattoo steht sie für unerschütterliche Treue zu sich selbst, Langlebigkeit und die Kraft die im Ewiggrünen liegt.",t:"stärke,ausdauer,ewigkeit"},
  ],

    {n:"Aszendent",g:"⬆",b:"Der Aszendent ist das aufgehende Sternzeichen zum Zeitpunkt der Geburt — die 'Maske' die wir der Welt zeigen und unsere erste Impression. Er steht für den Körper, das Erscheinungsbild und die Art wie wir auf andere wirken. Als Tattoo steht er für die bewusste Gestaltung der eigenen Außenwirkung.",t:"identität,transformation"},

  // ===== CHINESISCHER TIERKREIS =====
  tierkreis_china:[
    {n:"Ratte 鼠",g:"🐀",b:"Die Ratte ist das erste Tier im chinesischen Tierkreis — sie gewann das Rennen durch Cleverness: sie ritt auf dem Ochsen und sprang als erste ans Ziel. Als Tattoo steht sie für Intelligenz, Schnelligkeit im Denken und die Überzeugung dass der Klügste nicht immer der Stärkste aber immer der Erste ist.",t:"weisheit,erfolg,anpassung"},
    {n:"Ochse 牛",g:"🐂",b:"Der Ochse ist das zweite Tier im chinesischen Tierkreis — stark, beharrlich und zuverlässig. Er kam als zweiter weil er die Ratte transportierte. Als Tattoo steht er für geduldige Beharrlichkeit, die Kraft der langsamen Ausdauer und die Überzeugung dass Verlässlichkeit den Sprinter schlägt.",t:"stärke,ausdauer,stabilität"},
    {n:"Tiger 虎",g:"🐅",b:"Der Tiger ist das dritte Tier im chinesischen Tierkreis — mutig, impulsiv und unabhängig. Er kämpfte gegen Wellen und Wind und kam trotzdem. Als Tattoo steht er für unerschütterlichen Mut, die Bereitschaft gegen widrige Umstände anzukämpfen und die chinesische Bewunderung für den König der Wälder.",t:"stärke,mut,führung,wildnis"},
    {n:"Hase 兔",g:"🐇",b:"Der Hase ist das vierte Tier im chinesischen Tierkreis — elegant, vorsichtig und klug. Er überquerte den Fluss auf Steinen und einem Baumstamm. Als Tattoo steht er für Eleganz und Cleverness als Überlebensstrategie, Feingefühl und die chinesische Wertschätzung des sanft Weisen.",t:"glück,schönheit,frieden,intuition"},
    {n:"Drache 龙",g:"龍",b:"Der Drache ist das mächtigste Tier im chinesischen Tierkreis und das einzige mythische Wesen. Er bringt Regen, Glück und kaiserliche Macht. Als Tattoo ist er das ultimative chinesische Glückssymbol, steht für Stärke mit Weisheit und die Überzeugung dass der Würdigste die Macht trägt.",t:"stärke,glück,schutz,macht"},
    {n:"Schlange 蛇",g:"🐍",b:"Die Schlange ist das sechste Tier im chinesischen Tierkreis — weise, intuitiv und geheimnisvoll. Sie schwamm durch den Fluss und versteckte sich im Huf des Pferdes. Als Tattoo steht sie für stille Weisheit, die Kraft des Verborgenen und die chinesische Überzeugung dass die Schlange die tiefste Wahrheit kennt.",t:"weisheit,intuition,sinnlichkeit,transformation"},
    {n:"Pferd 马",g:"🐎",b:"Das Pferd ist das siebte Tier im chinesischen Tierkreis — frei, energetisch und abenteuerlustig. Als Tattoo steht es für Freiheitsliebe, unaufhaltsame Energie und die Überzeugung dass das Leben für diejenigen schöner ist die schnell und frei durch es hindurchgaloppieren.",t:"freiheit,stärke,energie,ausdauer"},
    {n:"Ziege 羊",g:"🐑",b:"Die Ziege ist das achte Tier im chinesischen Tierkreis — sanft, kreativ und künstlerisch begabt. Als Tattoo steht sie für künstlerische Sensibilität, Sanftheit als Stärke und die chinesische Überzeugung dass Mitgefühl und Kreativität die schönsten menschlichen Eigenschaften sind.",t:"kreativität,liebe,schönheit,harmonie"},
    {n:"Affe 猴",g:"🐒",b:"Der Affe ist das neunte Tier im chinesischen Tierkreis — clever, verspielt und erfinderisch. Er ist wie der Trickster des Westens. Als Tattoo steht er für brillante Intelligenz, die Freude am Spiel mit Ideen und die Überzeugung dass Cleverness und Humor die mächtigsten Waffen sind.",t:"weisheit,kreativität,freiheit"},
    {n:"Hahn 鸡",g:"🐓",b:"Der Hahn ist das zehnte Tier im chinesischen Tierkreis — pünktlich, selbstbewusst und fleißig. Er verkündet den Morgen. Als Tattoo steht er für Pünktlichkeit und Verlässlichkeit, das Selbstbewusstsein den Morgen anzukündigen und die Überzeugung dass der Tag dem gehört der früh aufsteht.",t:"mut,erfolg,identität"},
    {n:"Hund 狗",g:"🐕",b:"Der Hund ist das elfte Tier im chinesischen Tierkreis — treu, loyal und gerecht. Er steht für Ehrlichkeit. Als Tattoo steht er für bedingungslose Loyalität, moralische Integrität und die chinesische Überzeugung dass der treueste Freund des Menschen auch die edelsten menschlichen Tugenden verkörpert.",t:"treue,liebe,schutz"},
    {n:"Schwein 猪",g:"🐖",b:"Das Schwein ist das zwölfte und letzte Tier im chinesischen Tierkreis — großzügig, gutherzig und genussfreudig. Als Tattoo steht es für Großzügigkeit des Herzens, die Freude am guten Leben und die chinesische Überzeugung dass Wohlwollen und Genuss keine Gegensätze sind.",t:"glück,liebe,erfolg"},
  ],

  // ===== STERNBILDER =====
  sternbilder:[
    {n:"Orion — Jäger",g:"⭐",b:"Orion ist das bekannteste Sternbild des Himmels — der mächtige Jäger mit Gürtel, Schwert und Keule. Er wurde von Artemis geliebt und getötet und an den Himmel versetzt. Als Tattoo steht er für den Jäger-Archetypus, die unsterbliche Leidenschaft und die Schönheit die im Streben selbst liegt.",t:"stärke,mut,führung"},
    {n:"Großer Bär — Ursa Major",g:"🐻",b:"Der Große Bär ist das bekannteste Sternbild der Nordhalbkugel. Sein Schwanz zeigt immer zum Polarstern. In vielen Kulturen ist er eine in Sterne verwandelte Gottheit. Als Tattoo steht er für ewige Orientierung, die Verbindung mit dem Nordhimmel und die mythische Kraft des Bären.",t:"schutz,stärke,heimat"},
    {n:"Kleiner Bär — Polarstern",g:"✦",b:"Der Polarstern im Kleinen Bären steht seit Jahrtausenden fest am Himmel — alle anderen Sterne drehen sich um ihn. Seefahrer und Wanderer orientierten sich an ihm. Als Tattoo steht er für den festen inneren Punkt in allem Wandel, absolute Orientierung und die Überzeugung dass es in jedem Sturm einen fixen Punkt gibt.",t:"orientierung,stärke,ewigkeit"},
    {n:"Kassiopeia",g:"✺",b:"Kassiopeia — die eitlen Königin am Himmel — ist in Form eines W oder M am Nordhimmel zu sehen. Sie wurde zur Strafe an den Himmel versetzt. Als Tattoo steht sie für den Mut zur Selbstdarstellung, die Überzeugung an die eigene Schönheit und die mythische Geschichte von Stolz und göttlicher Bestrafung.",t:"schönheit,identität,ewigkeit"},
    {n:"Perseus",g:"⚔",b:"Perseus tötete Medusa, rettete Andromeda und steht am Himmel als ewiger Held. Er trägt den abgeschlagenen Kopf der Medusa als Schutzwaffe. Als Tattoo steht er für Heldenmut, die Kraft die aus dem Unmöglichen das Mögliche macht und die antike Geschichte des Mannes der für Liebe kämpft.",t:"mut,stärke,transformation"},
    {n:"Andromeda",g:"⛓",b:"Andromeda — an Felsen gekettet als Opfer für das Meeresungeheuer — wurde von Perseus gerettet und an den Himmel versetzt. Als Tattoo steht sie für die Kraft der Rettung, die Überzeugung dass das Dunkelste immer einen Ausgang hat und die mythische Liebe die Unmögliches möglich macht.",t:"transformation,freiheit,liebe"},
    {n:"Pegasus — Geflügeltes Pferd",g:"🐴",b:"Pegasus entsprang dem Blut der Medusa als Perseus sie enthauptete. Er ist das Symbol der Inspiration und des Dichters. Als Tattoo steht er für kreative Inspiration die aus dem Schmerz entsteht, die Überzeugung dass aus dem Schlimmsten das Schönste geboren wird und die Freiheit des kreativen Geistes.",t:"freiheit,kreativität,transformation"},
    {n:"Löwe — Leo",g:"🦁",b:"Leo am Sommerhimmel — die Löwengestalt mit dem hellen Stern Regulus am Herzen. In der Antike zeigte Leos Aufgang die Nilflut an. Als Tattoo steht er für königliche Stärke, Führung mit Herz und die antike Verbindung zwischen Himmel und Erde die in den Sternen sichtbar wird.",t:"stärke,führung,mut"},
    {n:"Skorpion — Scorpius",g:"🦂",b:"Scorpius — der Skorpion — kämpfte laut Mythos gegen Orion und beide wurden an den Himmel versetzt: wenn Scorpius aufgeht, geht Orion unter. Als Tattoo steht er für die unversöhnliche Rivalität, intensive Leidenschaft und die Überzeugung dass manche Gegensätze niemals gleichzeitig am Himmel stehen können.",t:"stärke,transformation,geheimnis"},
    {n:"Schwan — Cygnus",g:"🦢",b:"Cygnus — der Schwan — fliegt die Milchstraße entlang mit ausgebreiteten Flügeln. Er ist oft mit Zeus verbunden der sich in einen Schwan verwandelte. Als Tattoo steht er für Eleganz in der Bewegung, die göttliche Verwandlung und die Schönheit des großen weißen Vogels der die Sterne durchquert.",t:"schönheit,transformation,spirituell"},
    {n:"Adler — Aquila",g:"🦅",b:"Aquila — der Adler — trägt laut Mythos den Blitz des Zeus. Er ist der Götterbote am Sommerdreieck. Als Tattoo steht er für göttliche Botschaft, die Stärke des Götterboten und die antike Überzeugung dass die Sterne uns Nachrichten senden wenn wir sie zu lesen verstehen.",t:"stärke,freiheit,spirituell"},
    {n:"Delphin — Delphinus",g:"🐬",b:"Delphinus — ein kleines aber schönes Sternbild — ist der Delphin der den Dichter Arion rettete. Er ist ein Symbol göttlicher Fürsorge im Meer der Sterne. Als Tattoo steht er für Rettung aus der Tiefe, göttliche Fürsorge für Künstler und die Schönheit des Kleinen das trotzdem am Himmel leuchtet.",t:"liebe,freiheit,freude"},
    {n:"Drache — Draco",g:"🐉",b:"Draco — der Drache — umschlingt den Polarstern und bewacht ihn seit Jahrtausenden. In der Antike war Draconis der Polarstern. Als Tattoo steht er für ewige Wachsamkeit, den kosmischen Hüter der sich nie schlafen legt und die archaische Verbindung zwischen Drache und Weltachse.",t:"schutz,stärke,ewigkeit"},
    {n:"Herkules",g:"💪",b:"Herkules — der größte Held der Antike — kämpfte zwölf Aufgaben für seine Erlösung. Sein Sternbild zeigt ihn kniend im Kampf. Als Tattoo steht er für Heldenmut durch Prüfung, die Überzeugung dass echte Größe durch Anstrengung entsteht und die antike Geschichte des Menschen der durch Leiden zur Unsterblichkeit gelangt.",t:"stärke,mut,ausdauer"},
    {n:"Zwillinge — Gemini",g:"♊",b:"Gemini — Kastor und Pollux — sind die Schutzgötter der Seefahrer. Einer ist sterblich, einer unsterblich — sie teilen die Unsterblichkeit. Als Tattoo stehen sie für Brüderlichkeit die über den Tod hinausgeht, das Teilen des Unverzichtbaren und die tiefste Form von Geschwisterliebe.",t:"liebe,verbindung,transformation"},
    {n:"Jungfrau — Virgo",g:"🌾",b:"Virgo — die Jungfrau — ist das zweitgrößte Sternbild des Himmels und oft mit Demeter verbunden die nach Persephone sucht. Als Tattoo steht sie für die mütterliche Suche, Präzision und den Dienst am Ganzen der aus tiefer Liebe entsteht.",t:"harmonie,schönheit,weisheit"},
    {n:"Fische — Pisces",g:"🐟",b:"Pisces — zwei Fische die in verschiedene Richtungen schwimmen — sind durch eine Schnur verbunden. Sie stehen für den ewigen Konflikt zwischen Spiritualität und Materialität, Traum und Realität. Als Tattoo stehen sie für die Akzeptanz dieser Spannung und die Weisheit die im Schwimmen in verschiedene Richtungen gleichzeitig liegt.",t:"spirituell,intuition,liebe"},
    {n:"Steinbock — Capricornus",g:"🐐",b:"Capricornus — der Ziegenfisch — ist ein mythisches Wesen halb Ziege halb Fisch. Er steht für Ausdauer auf dem Weg zum Gipfel und Tiefe des Gefühls. Als Tattoo steht er für die Kombination von Ehrgeiz und Tiefe, den Aufstieg der nie die eigenen Wurzeln vergisst.",t:"stärke,ausdauer,transformation"},
    {n:"Phönix",g:"🔥",b:"Das Phönix-Sternbild am Südhimmel zeigt den mythischen Vogel der aus der Asche aufsteigt. Als Tattoo verbindet er astronomische Navigation mit dem tiefsten aller Wiedergeburtssymbole — Transformation nach vollständigem Verlust, der Mut neu zu beginnen wenn alles verbrannt ist.",t:"transformation,neubeginn,stärke"},
    {n:"Einhorn — Monoceros",g:"🦄",b:"Monoceros — das Einhorn — ist ein unscheinbares Sternbild aber voller Schönheit wenn man es mit einem Teleskop betrachtet. Als Tattoo steht es für die Überzeugung dass die größte Magie oft unsichtbar für bloße Augen ist und für die kindliche Fähigkeit an das Wunderbare zu glauben.",t:"reinheit,spirituell,schönheit"},
  ],

  // ===== NORDISCHE / GERMANISCHE TIERE =====
  tiere_nordisch:[
    {n:"Wolf (Fenrir)",g:"🐺",b:"Der kosmische Riesenwolf der nordischen Mythologie — gefangen von den Göttern, wird er beim Ragnarök losbrechen. Symbol für unbändige Urkraft, das Unvermeidliche und die Grenzen der Kontrolle.",t:"stärke,wildnis,transformation"},
    {n:"Rabe Huginn",g:"🦅",b:"Huginn — Gedanke — ist einer von Odins zwei Raben. Odin schickt ihn jeden Morgen in die Welt um zu sehen und zu hören. Als Tattoo steht Huginn für die Kraft des Gedankens, die Fähigkeit in andere Welten zu denken und die Verbindung zwischen dem menschlichen Geist und dem allsehenden Odin.",t:"weisheit,geist,spirituell"},
    {n:"Rabe Muninn",g:"🦅",b:"Muninn — Erinnerung — ist Odins zweiter Rabe. Odin fürchtet um ihn mehr als um Huginn denn Erinnerungen sind kostbarer als Gedanken. Als Tattoo steht Muninn für die heilige Kraft der Erinnerung, das Bewahren des Wertvollen und die Überzeugung dass was wir erinnern wirklich war.",t:"weisheit,erinnerung,spirituell"},
    {n:"Bär (Berserker)",g:"🐻",b:"Der Berserker trug das Fell des Bären und kämpfte in einem rauschhaften Zustand — halb Mensch, halb Bär. Er konnte keine Wunden fühlen. Als Tattoo steht er für die archaische Kraft die entsteht wenn man das innere Tier freilässt, den Kriegstrance-Zustand totaler Hingabe und die nordische Vorstellung einer jenseitigen Stärke.",t:"stärke,mut,wildnis"},
    {n:"Adler (Weltenauge)",g:"🦅",b:"Der Adler sitzt in der Krone des Weltbaums Yggdrasil und hält Ausschau über alle neun Welten. Er und der Drache Níðhöggr sind ewige Feinde. Als Tattoo steht er für den höchsten Weitblick, die Verbindung mit der Weltachse und die nordische Überzeugung dass wahre Weisheit alles überblickt.",t:"weisheit,freiheit,spirituell"},
    {n:"Schlange Níðhöggr",g:"🐍",b:"Níðhöggr — die Hass-Beißende — nagt seit Anbeginn der Zeit an den Wurzeln von Yggdrasil und wird am Ende der Zeit davonfliegen. Als Tattoo steht sie für die destruktive Kraft die an allem nagt, die Akzeptanz dass selbst das Stärkste vergeht und den Mut im Angesicht des kosmischen Verfalls.",t:"transformation,ewigkeit,wildnis"},
    {n:"Eichhörnchen Ratatoskr",g:"🐿",b:"Ratatoskr läuft den Weltbaum auf und ab und trägt Nachrichten — oft bösartige Gerüchte — zwischen dem Adler in der Krone und dem Drachen in den Wurzeln. Als Tattoo steht er für Kommunikation als doppelschneidiges Schwert, die Kraft und Gefahr von Worten und den nordischen Humor über kosmische Tratschtante.",t:"verbindung,weisheit,transformation"},
    {n:"Hirsch Eikþyrnir",g:"🦌",b:"Eikþyrnir steht auf dem Dach von Walhall und frisst die Zweige Yggdrasils. Aus seinen Hörnern tropft Wasser in den Urquell Hvergelmir. Als Tattoo steht er für die kosmische Verbindung zwischen allem Lebendigen und die nordische Überzeugung dass jede Handlung im Kosmos Konsequenzen hat.",t:"spirituell,neubeginn,natur"},
    {n:"Ziegenbock Tanngrisnir",g:"🐐",b:"Tanngrisnir und Tanngnjóstr sind Thors Ziegenböcke die seinen Wagen ziehen. Er schlachtet sie jeden Abend und isst sie, legt ihre Knochen auf die Häute und am Morgen sind sie wieder lebendig. Als Tattoo steht er für Erneuerung durch vollständige Hingabe und die nordische Magie der Wiedergeburt.",t:"neubeginn,stärke,transformation"},
    {n:"Wölfe Geri & Freki",g:"🐺",b:"Geri (Gieriger) und Freki (Räudiger) sind Odins Wölfe — er gibt ihnen alles Fleisch und trinkt selbst nur Wein. Sie stehen für Odins wilde Seite, seine Verbindung mit den Tieren und die Einheit des Göttlichen mit dem Tierischen. Als Tattoo stehen sie für die Integration der wilden Seite in die weise Persönlichkeit.",t:"stärke,führung,wildnis"},
    {n:"Drache Fáfnir",g:"🐉",b:"Fáfnir verwandelte sich aus Gier in einen Drachen um seinen gestohlenen Goldschatz zu bewachen. Sigurd tötete ihn und aß sein Herz. Als Tattoo steht er für die Gefahr der Gier, die Verwandlung durch Habgier und die Überzeugung dass was wir zu fest festhalten uns letztendlich zerstört.",t:"transformation,stärke,warnung"},
    {n:"Katze Freyas",g:"🐈",b:"Freyas Wagen wird von zwei großen grauen Katzen gezogen. Die Katze ist das heilige Tier der Liebesgöttin. Als Tattoo steht sie für die Verbindung mit Freya, weibliche Unabhängigkeit und die Überzeugung dass Katzen göttergleiche Wesen sind die sich niemandem unterwerfen.",t:"stärke,weiblichkeit,sinnlichkeit"},
  ],

  // ===== ÄGYPTISCHE TIERE =====
  tiere_aegypten:[
    {n:"Katze (Bastet)",g:"🐈",b:"Bastet als Katze ist die Schutzgöttin des Hauses. Katzen wurden in Ägypten mumifiziert und heilig gehalten. Der Tod einer Katze war ein nationales Unglück. Als Tattoo steht sie für göttlichen Hausschutz, die Heiligkeit des Weiblichen und die ägyptische Überzeugung dass Katzen Schutzgeister in Tiergestalt sind.",t:"schutz,weiblichkeit,sinnlichkeit"},
    {n:"Falke (Horus)",g:"🦅",b:"Der Falke des Himmelsgottes Horus fliegt so hoch dass seine Augen Sonne und Mond sind. Er sieht alles von oben. Als Tattoo steht er für königlichen Weitblick, göttliche Überblick und die ägyptische Überzeugung dass der König der Falke auf Erden ist — Abbild des Gottes.",t:"stärke,führung,spirituell"},
    {n:"Ibis (Thoth)",g:"🦤",b:"Der Ibis des Weisheitsgottes Thoth schreibt das Wissen der Götter auf. Thoth erfand Schrift, Mathematik und Magie. Als Tattoo steht er für die heilige Kraft des Wissens, die Verbindung zwischen Schreiben und Göttlichkeit und die ägyptische Überzeugung dass Wissen die höchste Form der Macht ist.",t:"weisheit,kreativität,spirituell"},
    {n:"Krokodil (Sobek)",g:"🐊",b:"Sobek ist der krokodilsköpfige Gott des Nils — mächtig, gefährlich und fruchtbar zugleich. Er steht für die Urgewalt des Wassers, Fruchtbarkeit des Nilschlamms und die duale Natur von Bedrohung und Schutz. Als Tattoo steht das Krokodil für die Akzeptanz der eigenen gefährlichen Seiten und die Kraft die im Uralten liegt.",t:"stärke,schutz,macht"},
    {n:"Kobra (Wadjet)",g:"🐍",b:"Die Kobra Wadjet steht aufgerichtet auf der Pharaonenkrone und schützt den König mit tödlichem Gift. Sie ist eine der ältesten Gottheiten Ägyptens. Als Tattoo steht sie für königlichen Schutz, die Bereitschaft das Giftige zur Verteidigung einzusetzen und die ägyptische Tradition der schützenden Schlange.",t:"schutz,stärke,macht"},
    {n:"Skarabäus (Khepri)",g:"🪲",b:"Der Skarabäus rollt seinen Kotball wie der Gott Khepri die Sonne über den Himmel rollt. Er legt seine Eier im Kotball — Leben entsteht aus der Verwesung. Als Tattoo steht er für tägliche Erneuerung, die Kraft des Neuen das aus dem Alten entsteht und die ägyptische Überzeugung dass das Leben immer weitergeht.",t:"neubeginn,transformation,spirituell"},
    {n:"Schakal (Anubis)",g:"🐺",b:"Der Schakal des Totengottes Anubis lebt am Rande der Wüste — zwischen Leben und Tod. Er wiegt die Herzen der Verstorbenen gegen die Feder der Ma'at. Als Tattoo steht er für den weisen Umgang mit dem Tod, die Gerechtigkeit die nach dem Leben kommt und die ägyptische Überzeugung dass jede Seele bewertet wird.",t:"transformation,schutz,spirituell"},
    {n:"Kuh (Hathor)",g:"🐄",b:"Hathor als heilige Kuh ist die Göttin der Liebe, Schönheit und Musik. Sie ist Mutter der Sonne und Amme der Pharaonen. Als Tattoo steht sie für mütterliche Göttlichkeit, nährende Liebe und die ägyptische Überzeugung dass die Göttin die Welt durch Liebe und Freude trägt.",t:"liebe,schönheit,weiblichkeit"},
    {n:"Widder (Amun)",g:"🐏",b:"Der Widder ist das heilige Tier des Gottes Amun — des Königs der Götter. Die Sphinxen in Karnak haben Widderköpfe. Als Tattoo steht er für königliche Macht, verborgene göttliche Kraft (Amun bedeutet 'der Verborgene') und die ägyptische Überzeugung dass die größte Kraft unsichtbar ist.",t:"stärke,macht,spirituell"},
    {n:"Löwin (Sekhmet)",g:"🦁",b:"Sekhmet als Löwin ist die furchtbarste Göttin Ägyptens — einmal wurde sie ausgeschickt die Menschheit zu vernichten und musste mit rotem Bier betrunken gemacht werden. Als Tattoo steht sie für die Kraft die außer Kontrolle geraten kann, die notwendige Wildheit und die duale Macht von Heilung und Vernichtung.",t:"stärke,heilung,weiblichkeit"},
    {n:"Ibis-Mensch (Thot)",g:"𓅓",b:"Thoth als ibisköpfiger Mensch ist der Gott des Wissens schlechthin — er schrieb das Totenbuch, erfand alle Wissenschaften und ist der weiseste aller Götter. Als Tattoo steht er für die Verbindung von Menschheit und göttlicher Weisheit und die ägyptische Überzeugung dass Wissen göttlich ist.",t:"weisheit,kreativität,spirituell"},
    {n:"Bennu-Vogel",g:"🦢",b:"Der Bennu ist der ägyptische Phönix — ein Reiher der am Anfang der Zeit auf dem ersten Hügel landete. Er ist der Seele des Sonnengottes Ra und steht für Schöpfung und Erneuerung. Als Tattoo steht er für den ägyptischen Ursprungsmythos, die Kraft der Erneuerung und die Verbindung mit der Morgensonne.",t:"neubeginn,spirituell,licht"},
    {n:"Sphinx",g:"🦁",b:"Die Sphinx bewacht das Grab des Pharaos — Löwenkörper für Stärke, Menschenkopf für Weisheit. Sie stellt die große Frage über die Natur des Menschen. Als Tattoo steht sie für die Hüterin des Geheimnisses, die Verbindung von Tier und Mensch und die ägyptische Überzeugung dass Schutz sowohl Stärke als auch Weisheit braucht.",t:"weisheit,stärke,geheimnis"},
  ],

  // ===== NATIVE AMERICAN TIERE =====
  tiere_nativ:[
    {n:"Adler — Weißkopf",g:"🦅",b:"Der Weißkopfseeadler ist das Nationaltier der USA und heiliges Tier vieler nordamerikanischer Völker. Er sieht weiter als jedes andere Tier und fliegt am höchsten. Als Tattoo steht er für Weitblick, Freiheit und die spirituelle Verbindung mit dem Großen Geist — der Adler trägt unsere Gebete zum Himmel.",t:"spirituell,freiheit,führung"},
    {n:"Wolf — Lehrmeister",g:"🐺",b:"In der Tradition vieler indigener Völker ist der Wolf der Lehrmeister — er zeigt, wie man in der Gemeinschaft lebt, jagt und füreinander sorgt. Der Wolf lehrt Loyalität, Strategie und das Gleichgewicht zwischen individuellem Bedürfnis und Gemeinschaftswohl. Als Tattoo steht er für Weisheit durch Beobachtung und die Kraft des Rudels.",t:"weisheit,führung,intuition"},
    {n:"Bär — Heiler",g:"🐻",b:"In der Native-American-Tradition ist der Bär das mächtigste Medizintier — er kennt Heilpflanzen, heilt sich selbst und trägt Traumweisheit. Als Tattoo steht er für die Kraft der Selbstheilung, die Verbindung mit pflanzlicher Medizin und die mütterliche Stärke die heilt ohne zu fragen.",t:"stärke,heilung,schutz"},
    {n:"Büffel — Großes Geschenk",g:"🦬",b:"Der Büffel gab den Plains-Völkern alles: Nahrung, Kleidung, Unterkunft, Werkzeug. Die Büffeljagd war ein heiliger Akt der Dankbarkeit. Als Tattoo steht er für tiefe Dankbarkeit gegenüber der Natur, die Verbindung mit dem Land und die Überzeugung dass alles was wir brauchen gegeben wird.",t:"erfolg,schutz,spirituell"},
    {n:"Eule — Todesbotin",g:"🦉",b:"In vielen Native-American-Traditionen kündigt die Eule den Tod an — ihr Ruf in der Nacht ist ein Zeichen. Doch sie ist auch Hüterin der Schwellen. Als Tattoo steht sie für die Akzeptanz der Sterblichkeit, die Weisheit die nur in der Dunkelheit wächst und die Würde des Übergangs zwischen den Welten.",t:"weisheit,transformation,spirituell"},
    {n:"Rabe — Schöpfer",g:"🦅",b:"Als Schöpfertrickster der Haida und Tlingit erschuf der Rabe die Welt durch List — er stahl das Licht von der Sonne und befreite die Menschen. Als Tattoo steht er für kreative Schöpfungskraft durch Cleverness und die Magie des Unerwarteten das Großes erschafft.",t:"transformation,kreativität,spirituell"},
