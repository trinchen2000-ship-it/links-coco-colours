<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Symbol-Suche · Coco Colours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#c9a84c;--gold-dim:rgba(201,168,76,.12);--card:#161616;--card2:#1c1c1c;--border:#272727;--border2:#333;--muted:#666;--white:#f0ede8}
body{background:#0a0a0a;color:var(--white);font-family:'Poppins',sans-serif;padding-bottom:60px}

/* TOPBAR */
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#0d0d0d;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.top-title{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--gold)}
.top-back{padding:6px 12px;border:1px solid var(--border);border-radius:7px;font-size:11px;color:var(--muted);text-decoration:none}

/* SUCHFELD */
.sfeld{display:flex;gap:8px;margin:16px 18px 0;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:12px 16px}
.sfeld:focus-within{border-color:var(--gold)}
#q{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Poppins',sans-serif;font-size:16px}
#q::placeholder{color:var(--muted)}
#sbtn{background:var(--gold);border:none;color:#0a0a0a;font-size:13px;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer;font-family:'Poppins',sans-serif;flex-shrink:0}

/* ERGEBNISSE */
#res{padding:20px 18px 0}
.hint{color:var(--muted);font-size:13px;line-height:1.9}
.hint b{color:var(--white)}
.sek{margin-bottom:24px}
.sek-titel{font-size:9px;letter-spacing:2.5px;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.leer{color:var(--muted);font-size:14px;padding:20px 0}

/* KARTEN — groß, mit Symbol links */
.karte{display:flex;align-items:flex-start;gap:16px;padding:18px;border:1px solid var(--border2);border-radius:14px;background:var(--card);color:var(--white);text-decoration:none;margin-bottom:12px;transition:border-color .15s}
.karte:hover{border-color:var(--gold)}
.karte.gold-karte{border-color:var(--gold);background:var(--gold-dim)}
.sym-box{width:64px;height:64px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;font-size:34px;font-family:serif;line-height:1}
.karte-info{flex:1;min-width:0}
.karte-name{font-size:15px;font-weight:600;margin-bottom:4px}
.karte-name.gold{color:var(--gold)}
.karte-desc{font-size:12px;color:#aaa;line-height:1.6;margin-top:3px}
.google-btn{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:5px 11px;white-space:nowrap;flex-shrink:0;text-decoration:none;display:block;transition:all .15s}
.google-btn:hover{border-color:var(--gold);color:var(--gold)}
</style>
</head>
<body>

<div class="top">
  <span class="top-title">🔍 SYMBOL-SUCHE</span>
  <a href="/berater" class="top-back">← Zum Berater</a>
</div>

<div class="sfeld">
  <input id="q" type="text"
    placeholder="z.B. Selbstliebe, Wolf, Chakra, Unalome, Rabe …"
    autocomplete="off"
    oninput="suchen(this.value)"
    onkeydown="if(event.key==='Enter')suchen(this.value)">
  <button id="sbtn" onclick="suchen(document.getElementById('q').value)">Suchen</button>
</div>

<div id="res">
  <div class="hint">Tippe einen Begriff — Ergebnisse erscheinen sofort.<br><br>
  <b>Beispiele:</b> Selbstliebe · Wolf · Rabe · Chakra · Unalome · Pentagramm · Koi · Vergänglichkeit · Treue</div>
</div>

<script>


const SYMBOLE={
nordisch:[
    {n:"Fehu",g:"ᚠ",b:"Die erste Rune des Elder Futhark steht für Wohlstand, Vieh und materiellen Besitz. Im alten Norden war Vieh das Maß des Reichtums. Als Tattoo symbolisiert Fehu Fülle, Neubeginn und die Kraft, Dinge zu erschaffen und zu bewahren. Sie lädt ein, Wohlstand nicht zu horten, sondern fließen zu lassen.",t:"freiheit,erfolg,neubeginn"},
    {n:"Uruz",g:"ᚢ",b:"Uruz ist die Rune des Auerochsen — des mächtigen, ausgestorbenen Urrinds. Sie steht für wilde, ungezähmte Kraft, Gesundheit und Ausdauer. Als Tattoo symbolisiert sie tierische Stärke, körperliche Vitalität und die Kraft der Natur. Sie steht auch für den Übergang vom Kind zum Erwachsenen.",t:"stärke,kraft,gesundheit"},
    {n:"Thurisaz",g:"ᚦ",b:"Thurisaz ist der Donnerkeil des Gottes Thor. Sie steht für Schutz, Abwehr und das Setzen von Grenzen. Die Rune kann auch Chaos und Prüfung bedeuten — wie ein Sturm, der reinigt. Als Tattoo steht sie für Selbstschutz, Stärke gegenüber Feinden und die Kraft, Grenzen zu verteidigen.",t:"schutz,kraft,verteidigung"},
    {n:"Ansuz",g:"ᚨ",b:"Ansuz ist die Rune des Gottes Odin und steht für Weisheit, Kommunikation und göttliche Botschaft. Sie repräsentiert das gesprochene Wort, Inspiration und die Verbindung zur höheren Weisheit. Als Tattoo steht sie für Redekunst, Kreativität des Geistes und die Fähigkeit, Botschaften zu empfangen und weiterzugeben.",t:"weisheit,geist,spirituell"},
    {n:"Raidho",g:"ᚱ",b:"Raidho ist die Reise-Rune. Sie steht für Bewegung, den eigenen Lebensweg und die Ordnung des Kosmos. Ursprünglich das Zeichen für Reiten und Reisen, steht sie heute für jeden Lebensweg. Als Tattoo symbolisiert sie Aufbruch, Abenteuer und die Überzeugung, dass der Weg selbst das Ziel ist.",t:"freiheit,reise,neubeginn"},
    {n:"Kenaz",g:"ᚲ",b:"Kenaz ist die Rune des Feuers und der Fackel. Sie steht für Erleuchtung, Kreativität und inneres Feuer. Die Fackel vertreibt die Dunkelheit — so steht Kenaz für das Licht des Wissens und der Inspiration. Als Tattoo symbolisiert sie künstlerische Kreativität, leidenschaftliche Energie und die Erleuchtung des Geistes.",t:"transformation,licht,kreativität"},
    {n:"Gebo",g:"ᚷ",b:"Gebo ist die Rune der Gabe und der Partnerschaft. Das X-förmige Symbol steht für den heiligen Austausch zwischen Göttern und Menschen, zwischen Liebenden und zwischen Freunden. Als Tattoo steht sie für bedingungslose Verbindung, gegenseitiges Geben und Nehmen und die heilige Natur echter Partnerschaft.",t:"liebe,verbindung"},
    {n:"Wunjo",g:"ᚹ",b:"Wunjo ist die Rune der Freude und des Glücks. Sie steht für Harmonie, Erfüllung und das Gefühl, am richtigen Platz zu sein. Als Tattoo symbolisiert sie inneren Frieden, die Freude am Dasein und das Bewusstsein, dass Glück eine innere Haltung ist, keine äußere Umstand.",t:"freude,glück,harmonie"},
    {n:"Hagalaz",g:"ᚺ",b:"Hagalaz ist die Hagelkorn-Rune — destruktiv aber reinigend. Sie steht für unerwartete Prüfungen, chaotische Veränderungen und die Kraft der Natur, die alles Alte hinwegfegt um Neues zu ermöglichen. Als Tattoo steht sie für die Akzeptanz des Unkontrollierbaren und das Wissen, dass Zerstörung oft Transformation vorausgeht.",t:"transformation,stärke,zyklus"},
    {n:"Nauthiz",g:"ᚾ",b:"Nauthiz ist die Rune der Not und der Notwendigkeit. Sie steht für Einschränkungen, Widerstände und den Zwang, unter Druck zu wachsen. Wie Feuer durch Reibung entsteht, entsteht Stärke durch Prüfung. Als Tattoo symbolisiert sie innere Stärke, die in schwierigen Zeiten geboren wird, und die Kraft der Selbstdisziplin.",t:"stärke,ausdauer,mut"},
    {n:"Isa",g:"ᛁ",b:"Isa ist die Eis-Rune — die vollkommene Stille. Sie steht für Innehalten, Innenschau und die Kraft der Stille. Manchmal müssen wir stillhalten, damit sich Dinge klären können. Als Tattoo steht Isa für Achtsamkeit, Meditation und die Weisheit zu wissen, wann man handelt und wann man wartet.",t:"spirituell,stille"},
    {n:"Jera",g:"ᛃ",b:"Jera ist die Ernte-Rune und steht für den natürlichen Kreislauf von Säen und Ernten. Sie symbolisiert Geduld, die Belohnung für harte Arbeit und den unaufhaltsamen Fluss der Zeit. Als Tattoo steht sie für die Überzeugung, dass jede Mühe ihre Zeit braucht und jede gute Tat ihre Frucht trägt.",t:"erfolg,zyklus,ausdauer"},
    {n:"Eihwaz",g:"ᛇ",b:"Eihwaz ist die Eiben-Rune und steht für den Weltenbaum Yggdrasil. Die Eibe ist der Baum des Todes und der Wiedergeburt — sie lebt Tausende von Jahren und ist gleichzeitig hochgiftig. Als Tattoo steht Eihwaz für Ausdauer, die Überwindung des Todes und die Verbindung zwischen den Welten.",t:"transformation,ausdauer,stärke"},
    {n:"Perthro",g:"ᛈ",b:"Perthro ist die Rune des Schicksals und der verborgenen Dinge. Sie wird mit dem Würfelbecher assoziiert — dem Werkzeug der Nornenfrauen, die das Schicksal weben. Als Tattoo steht sie für die Akzeptanz des Unbekannten, das Vertrauen in das Schicksal und die Offenheit für das Mysterium des Lebens.",t:"weisheit,spirituell,transformation"},
    {n:"Algiz",g:"ᛉ",b:"Algiz ist die Schutz-Rune in Form von Elchgeweih oder einer erhobenen Hand. Sie steht für Schutz, Verteidigung und die Verbindung zur höheren Welt. Als Tattoo ist sie ein kraftvolles Schutzzeichen, das vor negativen Energien schützt und gleichzeitig die spirituelle Verbindung stärkt.",t:"schutz,verteidigung,spirituell"},
    {n:"Sowilo",g:"ᛋ",b:"Sowilo ist die Sonnen-Rune und steht für Sieg, göttliches Licht und unaufhaltsame Kraft. Wie die Sonne immer wieder aufgeht, symbolisiert Sowilo den unaufhaltsamen Willen zum Erfolg. Als Tattoo steht sie für Lebensenergie, Führungsstärke und die Überzeugung, dass das Licht immer die Dunkelheit überwindet.",t:"sieg,stärke,licht,erfolg"},
    {n:"Tiwaz",g:"ᛏ",b:"Tiwaz ist die Rune des Kriegsgottes Tyr, der seine Hand opferte um den Fenriswolf zu fesseln. Sie steht für Gerechtigkeit, Selbstaufopferung und ehrenhaften Mut. Als Tattoo symbolisiert sie die Bereitschaft, für das Richtige zu kämpfen und Opfer zu bringen, auch wenn es persönliche Kosten hat.",t:"mut,gerechtigkeit,stärke"},
    {n:"Berkano",g:"ᛒ",b:"Berkano ist die Birken-Rune und steht für Wachstum, Geburt und mütterliche Fürsorge. Die Birke ist der erste Baum, der nach dem Winter austreibt. Als Tattoo steht Berkano für Neubeginn, Fruchtbarkeit, Fürsorge und die nährende weibliche Energie, die neues Leben entstehen lässt.",t:"neubeginn,wachstum"},
    {n:"Ehwaz",g:"ᛖ",b:"Ehwaz ist die Pferde-Rune und steht für Partnerschaft, Loyalität und gemeinsame Bewegung. Das Pferd ist der treue Begleiter auf der Reise. Als Tattoo symbolisiert sie tiefe Verbundenheit, gegenseitiges Vertrauen und die Kraft einer echten Partnerschaft zwischen gleichgesinnten Seelen.",t:"liebe,verbindung,freiheit"},
    {n:"Mannaz",g:"ᛗ",b:"Mannaz ist die Menschheits-Rune und steht für das Selbst, die eigene Natur und die Gemeinschaft der Menschen. Sie erinnert daran, dass wir alle verbunden sind. Als Tattoo steht sie für Selbstkenntnis, Mitgefühl und das Bewusstsein, Teil einer größeren Gemeinschaft von Menschen zu sein.",t:"identität,weisheit,verbindung"},
    {n:"Laguz",g:"ᛚ",b:"Laguz ist die Wasser-Rune und steht für Intuition, Unbewusstes und den Fluss des Lebens. Wasser findet immer seinen Weg. Als Tattoo symbolisiert sie emotionale Tiefe, feminine Weisheit und die Fähigkeit, sich dem natürlichen Fluss des Lebens anzuvertrauen.",t:"intuition,spirituell,fluss"},
    {n:"Ingwaz",g:"ᛜ",b:"Ingwaz ist die Rune des Gottes Freyr und steht für Fruchtbarkeit, innere Stärke und vollendete Kraft. Sie ist das Symbol für das Potenzial, das in einem schlummert. Als Tattoo steht sie für innere Fülle, das Vertrauen in die eigene Schöpferkraft und die Freude an der Fruchtbarkeit des Lebens.",t:"neubeginn,wachstum,heimat"},
    {n:"Dagaz",g:"ᛞ",b:"Dagaz ist die Tages-Rune — die Rune des Durchbruchs. Sie steht für den Moment zwischen Nacht und Tag, zwischen Tod und Wiedergeburt. Als Tattoo symbolisiert sie transformative Momente, Erleuchtung und den Durchbruch nach langer Dunkelheit. Sie steht für Hoffnung und die Gewissheit, dass nach jeder Nacht ein neuer Tag folgt.",t:"transformation,neubeginn,licht"},
    {n:"Othala",g:"ᛟ",b:"Othala ist die Erbe-Rune und steht für Heimat, Vorfahren und ererbtes Vermögen. Sie verbindet uns mit unseren Wurzeln und unserem Erbe. Als Tattoo steht sie für Identität, Verbundenheit mit der Familie und das Bewusstsein, dass wir alle Teil einer langen Ahnenreihe sind.",t:"heimat,wurzeln,identität"},
    {n:"Vegvísir",g:"✦",b:"Der Vegvísir ist der isländische Wikinger-Kompass aus alten Zauberbüchern. Er soll dem Träger helfen, durch jeden Sturm und jedes Unwetter seinen Weg zu finden. Wörtlich bedeutet er 'Wegweiser'. Als Tattoo steht er für innere Orientierung, die Fähigkeit sich nicht zu verlieren — egal wie das Leben stürmt — und die Gewissheit, immer nach Hause zu finden.",t:"schutz,orientierung,stärke,freiheit"},
    {n:"Valknut",g:"⋈",b:"Der Valknut — drei ineinander verschlungene Dreiecke — ist das Symbol des Gottes Odin und steht für die gefallenen Krieger. Er wurde auf Grabsteinen gefunden und symbolisiert den Mut im Angesicht des Todes, die Verbindung zwischen Leben und Tod und die neun Welten. Als Tattoo steht er für Tapferkeit, die Akzeptanz der eigenen Sterblichkeit und Odins Schutz.",t:"mut,transformation,stärke,ewigkeit"},
    {n:"Helm of Awe",g:"✧",b:"Der Ägishjálmur — der Helm der Ehrfurcht — ist ein isländisches Zaubersymbol aus acht Raunen-Strahlen. Er soll absolute Furchtlosigkeit verleihen und Feinde lähmen. Drachen trugen ihn zwischen den Augen. Als Tattoo steht er für unerschütterlichen Schutz, die Fähigkeit Angst zu überwinden und die Kraft die entsteht wenn man keine Furcht mehr kennt.",t:"schutz,stärke,mut"},
    {n:"Mjölnir",g:"⌇",b:"Mjölnir ist der Hammer des Donnergottes Thor — das mächtigste Werkzeug der nordischen Mythologie. Er kann Berge zertrümmern und kehrt immer zu seinem Besitzer zurück. Paradoxerweise wurde er auch für Hochzeitssegnungen benutzt. Als Tattoo steht er für rohe Stärke, göttlichen Schutz, Fruchtbarkeit und die nordische Verbindung zwischen Zerstörung und Schöpfung.",t:"schutz,stärke,kraft"},
    {n:"Yggdrasil",g:"⊕",b:"Yggdrasil ist die kosmische Weltenesche, die alle neun Welten der nordischen Mythologie trägt und verbindet. In seinen Wurzeln liegt Hel, im Stamm Midgard, in der Krone Asgard. Verschiedene Wesen leben in ihm — Adler, Drachen und Eichhörnchen. Als Tattoo steht er für Verbundenheit, die Ordnung des Kosmos und die Überzeugung dass alles miteinander verbunden ist.",t:"verbindung,wachstum,spirituell,wurzeln"},
    {n:"Huginn & Muninn",g:"🦅",b:"Huginn (Gedanke) und Muninn (Erinnerung) sind Odins zwei Raben, die jeden Morgen in die neun Welten fliegen und abends berichten. Odin sagte einst: 'Um Huginn fürchte ich mich nicht, aber um Muninn.' Gedanken verliert man leichter als Erinnerungen. Als Tattoo stehen sie für die Kraft des Geistes, das Festhalten an Erinnerungen und Odins allsehende Weisheit.",t:"weisheit,identität,geist"},
    {n:"Gungnir",g:"⇧",b:"Gungnir ist Odins magischer Speer, der niemals sein Ziel verfehlt. Er wurde von den Zwergen geschmiedet und symbolisiert göttliche Präzision und Autorität. Als Tattoo steht Gungnir für Entschlossenheit, die Kraft des gezielten Willens und die Überzeugung, dass man mit Präzision und Entschlossenheit jedes Ziel erreichen kann.",t:"stärke,führung,macht"},
    {n:"Wolfsknoten",g:"⊞",b:"Der Wolfsknoten ist ein nordisches Symbol das den Geist des Fenriswolfs beschwört — die ungezähmte Urkraft die selbst die Götter nicht vollständig bändigen können. Als Tattoo steht er für wilde Freiheit, die Ablehnung aller Ketten und die Kraft die im Ungezähmten liegt. Er steht auch für den Kampf gegen Einschränkungen.",t:"stärke,freiheit,wildnis"},
    {n:"Sonnenkreu (Sol)",g:"☀",b:"Das germanische Sonnenrad ist eines der ältesten Symbole Europas und findet sich auf bronzezeitlichen Felszeichnungen. Es steht für die Sonne, kosmische Ordnung und den ewigen Kreislauf des Lebens. Als Tattoo symbolisiert es Lebensenergie, die Kraft des Lichts und die tiefe menschliche Verbindung mit der Sonne als Quelle allen Lebens.",t:"licht,stärke,ewigkeit"},
  ],
  keltisch:[
    {n:"Triquetra",g:"⚜",b:"Die Triquetra — drei ineinander verflochtene Spitzen — ist eines der ältesten keltischen Symbole. Ursprünglich ein vorchristliches Symbol der Göttin, wurde sie später mit der christlichen Dreifaltigkeit verbunden. Sie steht für alle heiligen Dreiheiten: Vergangenheit-Gegenwart-Zukunft, Geburts-Leben-Tod, Land-See-Himmel. Als Tattoo symbolisiert sie ewige Verbindung und heilige Dreiheit.",t:"spirituell,verbindung,ewigkeit"},
    {n:"Triskelion",g:"☸",b:"Das Triskelion — drei spiralförmige Arme — ist eines der ältesten Symbole der Menschheit. Auf Newgrange in Irland (3200 v. Chr.) eingraviert, steht es für die drei Kräfte des Lebens, für Bewegung und Fortschritt. Die drei Spiralen symbolisieren oft Geist-Seele-Körper oder die drei Welten der keltischen Kosmologie. Als Tattoo steht es für ewige Bewegung und die Kraft der Dreiheit.",t:"stärke,wachstum,zyklus"},
    {n:"Celtic Knot",g:"∞",b:"Keltische Knoten haben keine erkennbaren Anfangs- und Endpunkte — sie sind eine endlose Linie, die das Unendliche symbolisiert. Sie finden sich in irischen Manuskripten wie dem Book of Kells (800 n. Chr.). Als Tattoo stehen sie für die Unendlichkeit des Lebens, ewige Liebe und die Überzeugung, dass alle Dinge miteinander verbunden sind.",t:"ewigkeit,verbindung,liebe"},
    {n:"Claddagh",g:"♡",b:"Das Claddagh-Symbol aus dem irischen Fischerdorf Claddagh zeigt zwei Hände die ein Herz halten, gekrönt von einer Krone. Die Hände stehen für Freundschaft, das Herz für Liebe, die Krone für Treue. Als Tattoo ist es eines der schönsten Symbole für tiefe, loyale Freundschaft und Liebe, und hat eine jahrhundertealte Tradition als Verlobungs- und Liebeszeichen.",t:"liebe,treue,freundschaft"},
    {n:"Spirale (dreifach)",g:"🌀",b:"Die dreifache Spirale (Triskele) ist das bekannteste Symbol von Newgrange — dem 5000 Jahre alten irischen Megalithgrab. Sie steht für die drei Welten der keltischen Kosmologie und den ewigen Kreislauf von Leben, Tod und Wiedergeburt. Als Tattoo symbolisiert sie die zyklische Natur der Existenz und das Vertrauen in den ewigen Kreislauf.",t:"transformation,neubeginn,zyklus,spirituell"},
    {n:"Awen",g:"⋀",b:"Das Awen ist das heilige Symbol der keltischen Druiden und besteht aus drei Strahlen, die von einem Punkt ausgehen. Es steht für göttliche Inspiration, Kreativität und die Dreiheit von Wahrheit, Schönheit und Güte. Als Tattoo symbolisiert es künstlerische Begabung, spirituelle Erleuchtung und die Verbindung mit der göttlichen Schöpferkraft.",t:"kreativität,spirituell,weisheit"},
    {n:"Tree of Life",g:"⊕",b:"Der keltische Lebensbaum (Crann Bethadh) stand im Zentrum jedes keltischen Stammesgebiets und war heilig. Seine Wurzeln reichen in die Unterwelt, der Stamm steht in der Menschenwelt, die Äste berühren die Götterwelt. Als Tattoo steht er für Verwurzelung im Hier und Jetzt, Verbindung mit den Vorfahren und Streben nach oben.",t:"wurzeln,wachstum,verbindung,heimat"},
    {n:"Dara Knot",g:"⋄",b:"Der Dara-Knoten ist nach dem irischen Wort 'Doire' (Eiche) benannt und steht für das Wurzelsystem der heiligen Eiche. Die keltische Eiche war der heiligste Baum, und ihr Wurzelwerk unter der Erde war ebenso groß wie die Krone darüber. Als Tattoo steht er für unsichtbare innere Stärke, tiefe Verwurzelung und das Vertrauen in das Fundament das man nicht sieht.",t:"stärke,wurzeln,ausdauer"},
    {n:"Brigid-Kreuz",g:"✛",b:"Das Brigid-Kreuz aus Binsen geflochten ist das Symbol der Göttin Brigid — der keltischen Göttin der Heilung, der Schmiede und der Dichtkunst. Es wird am 1. Februar (Imbolc) über Haustüren gehängt für Schutz vor Feuer und Unheil. Als Tattoo steht es für den Übergang, den Frühlingsbeginn und die dreifache Kraft der keltischen Göttin.",t:"schutz,spirituell,heimat"},
    {n:"Sheela Na Gig",g:"⊖",b:"Sheela Na Gig — in Stein gemeißelte Figuren die ihre Vulva zur Schau stellen — finden sich an irischen und britischen Kirchen. Sie stehen für weibliche Urkraft, Fruchtbarkeit und apotropäischen Schutz (das Böse abweisend). Als Tattoo ist es ein mutiges Symbol für die Rückeroberung der weiblichen Körperkraft und die unzähmbare Kraft der Weiblichkeit.",t:"weiblichkeit,stärke,schutz"},
    {n:"Keltisches Kreuz",g:"☩",b:"Das keltische Kreuz verbindet das christliche Kreuz mit dem vorchristlichen Sonnenrad. Der Kreis der Sonne wurde um die Kreuzung der Balken gelegt — eine Synthese zweier Spiritualitäten. Als Tattoo steht es für die Verbindung von Traditionen, kosmische Verbundenheit und den Schutz des göttlichen Lichts.",t:"spirituell,ewigkeit,verbindung"},
    {n:"Cernunnos",g:"🦌",b:"Cernunnos ist der gehörnte Gott der Kelten — halb Mensch, halb Hirsch — der Wildtiere, der Natur und der Unterwelt. Er sitzt im Lotussitz und hält eine Schlange und ein Torque. Als Tattoo steht er für die Verbindung mit der wilden Natur, den Rhythmus der Jahreszeiten und die archaische Kraft des Männlichen in Verbindung mit der Erde.",t:"natur,freiheit,wachstum"},
    {n:"Schlange (keltisch)",g:"🐍",b:"In der keltischen Symbolik steht die Schlange für Regeneration, Heilung und die Kraft der Unterwelt. Sie wechselt die Haut und wird neu geboren. Druidinnen und Druiden hielten Schlangen für heilig. Als Tattoo steht die keltische Schlange für Erneuerung, Heilungskraft und die zyklische Natur des Lebens.",t:"transformation,heilung,neubeginn"},
    {n:"Ogham (Beith)",g:"ᚁ",b:"Ogham ist die älteste irische Schrift — vertikale und diagonale Striche an einem Mittelstab. Beith, die erste Rune, steht für die Birke — den ersten Baum des keltischen Baum-Alphabets. Sie symbolisiert Neubeginn, Reinigung und den ersten Schritt auf einem neuen Weg. Als Tattoo steht sie für frische Anfänge und die Kraft der Erneuerung.",t:"neubeginn,reinheit,wachstum"},
    {n:"Cauldron of Dagda",g:"◎",b:"Der Kessel des Dagda ist einer der vier heiligen Schätze Irlands — ein Kessel der nie leer wird und jeden satt macht. Er steht für göttlichen Überfluss, Wiedergeburt und die unerschöpfliche Quelle des Lebens. Als Tattoo steht er für die Überzeugung, dass das Universum uns nährt wenn wir offen sind, und die Magie der Transformation.",t:"neubeginn,spirituell,erfolg"},
    {n:"Grüner Mann",g:"🌿",b:"Der Grüne Mann — ein Gesicht aus Blättern — ist ein uraltes Symbol das in Kathedralen und Tempeln weltweit gefunden wird. Er steht für die Lebenskraft der Natur, Fruchtbarkeit und die wilde, unzivilisierte Kraft des Waldes. Als Tattoo symbolisiert er die Verbindung zur Natur, den zyklischen Kreislauf und die archaische Kraft des Lebendigen.",t:"natur,neubeginn,wachstum,spirituell"},
    {n:"Herne der Jäger",g:"🦌",b:"Herne der Jäger ist eine englische Geistergestalt mit Hirschgeweih, die durch den Windsor-Wald streift. Er steht für die wilde Seele der Natur, den Übergang zwischen den Welten und die archaische Kraft des Jägers. Als Tattoo symbolisiert er die Verbindung mit dem Wildnisgeist, das Akzeptieren des Kreislaufs von Leben und Tod.",t:"freiheit,transformation,natur"},
    {n:"Schmetterling (keltisch)",g:"🦋",b:"In der keltischen Tradition ist der Schmetterling die Seele eines verstorbenen Menschen, der zurückgekehrt ist. Er steht für Transformation, die Unsterblichkeit der Seele und die Reise zwischen den Welten. Als Tattoo ist er ein zartes aber kraftvolles Symbol für Veränderung, den Glauben an die Kontinuität der Seele und die Schönheit des Wandels.",t:"transformation,spirituell,freiheit"},
    {n:"Pentakel",g:"⛤",b:"Das Pentakel ist das Pentagramm im Kreis — der Kreis bindet und schützt die Magie des Fünfsterns. Es ist das wichtigste Schutzamulett der Wicca-Tradition und steht für die fünf Elemente (Feuer, Wasser, Luft, Erde, Geist) in kosmischer Ordnung. Als Tattoo steht es für gebundene Schutzmagie, spirituelle Balance und die Vereinigung aller Elemente.",t:"schutz,spirituell,gleichgewicht"},
    {n:"Triquestra mit Kreis",g:"⚜",b:"Die Triquetra im Kreis verbindet das keltische Dreifach-Symbol mit dem Kreis der Ewigkeit. Der Kreis schließt die drei Kräfte zusammen und steht für Vollständigkeit. Als Tattoo steht es für die Einheit der heiligen Drei in der Ewigkeit des Kreises — ein besonders kraftvolles Symbol für ewige Verbindung und spirituelle Vollständigkeit.",t:"ewigkeit,spirituell,verbindung"},
  ],
  aegyptisch:[
    {n:"Ankh",g:"☥",b:"Das Ankh ist das Lebenszeichen des alten Ägypten und gilt als Schlüssel des Lebens. Es kombiniert das männliche Tau-Kreuz mit dem weiblichen Oval und symbolisiert die Vereinigung von männlichem und weiblichem Prinzip, aus der das Leben entsteht. Als Tattoo steht es für ewiges Leben, Vitalität und die Verbindung zwischen irdischer und göttlicher Welt.",t:"leben,ewigkeit,spirituell"},
    {n:"Auge des Horus",g:"𓂀",b:"Das Udjat-Auge wurde im Kampf zwischen Horus und Seth verletzt und von Thoth geheilt — seitdem ist es das mächtigste Heilungs- und Schutzsymbol Ägyptens. Es sieht alles und schützt vor allem Bösen. Als Tattoo steht es für allwissenden göttlichen Schutz, die Kraft der Heilung nach Verletzung und die Weisheit die aus Verlust entsteht.",t:"schutz,heilung,weisheit"},
    {n:"Auge des Ra",g:"☀",b:"Das Auge des Ra ist das linke Auge des Sonnengottes Ra — sein Zorn und seine Schutzwaffe. Es unterscheidet sich vom Auge des Horus (rechtes Auge). Das Auge des Ra symbolisiert die unerbittliche Macht der Sonne, göttlichen Zorn der Gerechtigkeit und die beschützende Kraft des Sonnengottes. Als Tattoo steht es für die feurige Kraft der Sonne und unerbittliche Stärke.",t:"stärke,schutz,licht"},
    {n:"Skarabäus",g:"𓆣",b:"Der Skarabäus (heiliger Käfer Ägyptens) rollte Kotballen über den Boden — genau wie die Sonne täglich über den Himmel rollt. Er wurde zum Symbol des Sonnengottes Khepri und steht für Wiedergeburt, Erneuerung und den ewigen Kreislauf. Als Tattoo steht er für Transformation, Neuanfang und die tägliche Kraft zur Erneuerung.",t:"neubeginn,transformation,licht"},
    {n:"Djed-Pfeiler",g:"𓊽",b:"Der Djed-Pfeiler ist das Symbol des Gottes Osiris und der Stabilität. Er stellt die Wirbelsäule des Osiris dar und steht für Beständigkeit, Stärke und das Fundament des Lebens. Als Tattoo symbolisiert er innere Stärke, unerschütterliche Stabilität und die Verwurzelung im Wesentlichen.",t:"stärke,stabilität,ausdauer"},
    {n:"Feather of Ma'at",g:"𓏏",b:"Die Feder der Göttin Ma'at war das kosmische Gleichgewicht des alten Ägypten. Nach dem Tod wurde das Herz des Verstorbenen gegen diese Feder gewogen — war das Herz schwerer (durch Sünde), fraß Ammit es. Als Tattoo steht die Feder der Ma'at für Wahrheit, kosmische Gerechtigkeit, das Bewusstsein des eigenen moralischen Lebens und innere Reinheit.",t:"wahrheit,gerechtigkeit,gleichgewicht"},
    {n:"Ouroboros",g:"◎",b:"Die Schlange die sich selbst in den Schwanz beißt — eines der ältesten Symbole der Menschheit. Erscheint in ägyptischen, griechischen, nordischen und alchemistischen Quellen. Symbol für ewigen Kreislauf, Selbsterneuerung und die Einheit aller Gegensätze.",t:"ewigkeit,zyklus,transformation"},
    {n:"Lotus",g:"🪷",b:"Der ägyptische Lotus (blaue und weiße Seerose) war ein heiliges Symbol der Schöpfung — aus ihm soll die Sonne beim ersten Mal aufgegangen sein. Er steht für Göttin Nefertem, Reinheit und Erleuchtung. Als Tattoo verbindet er ägyptische Schöpfungsmythologie mit universellem Streben nach Reinheit und spiritueller Entfaltung.",t:"spirituell,neubeginn,reinheit"},
    {n:"Wadjet",g:"𓂀",b:"Wadjet, die Kobra-Göttin, ist die Schutzgöttin Unterägyptens und eine der ältesten Gottheiten Ägyptens. Als aufgerichtete Kobra auf der Pharaonenkrone (Uraeus) symbolisiert sie göttlichen Schutz und königliche Macht. Als Tattoo steht sie für entschlossenen Schutz, die Bereitschaft zur Verteidigung und die Kraft der alten Weiblichkeit.",t:"schutz,stärke,macht"},
    {n:"Caduceus",g:"⚕",b:"Der Caduceus — Stab mit zwei sich windenden Schlangen und Flügeln — ist das Symbol des Gottes Hermes/Merkur und des ägyptischen Thoth. Die zwei Schlangen symbolisieren die Balance der Gegensätze: Gut/Böse, Gesundheit/Krankheit, Leben/Tod. Als Tattoo steht er für die Balance aller Gegensätze, Heilung durch Ausgleich und die Verbindung zwischen den Welten.",t:"heilung,gleichgewicht,weisheit"},
    {n:"Tyet (Isisknoten)",g:"♀",b:"Der Tyet — auch Isisknoten oder Blut der Isis — ähnelt dem Ankh, aber mit herabgefalteten Armen. Er symbolisiert den Schutz der Göttin Isis und ihre heilende weibliche Kraft. Als Tattoo steht er für mütterlichen Schutz, weibliche göttliche Energie und die Verbindung mit Isis, der mächtigsten Göttin Ägyptens.",t:"schutz,weiblichkeit,spirituell"},
    {n:"Was-Zepter",g:"⇧",b:"Das Was-Zepter ist das Herrschaftssymbol der ägyptischen Götter und steht für Macht, Würde und göttliche Autorität. Als Tattoo steht es für Führungsstärke, innere Macht und die Fähigkeit, das eigene Leben souverän zu gestalten.",t:"stärke,führung,macht"},
    {n:"Nefertiti-Krone",g:"♦",b:"Nefertiti — 'die Schöne ist gekommen' — war eine der mächtigsten Königinnen Ägyptens. Ihre flache blaue Krone ist unverwechselbar. Als Tattoo steht sie für weibliche Macht ohne Entschuldigung, ägyptische Eleganz und die Überzeugung, dass wahre Schönheit untrennbar mit innerer Stärke verbunden ist.",t:"schönheit,macht,weiblichkeit"},
    {n:"Cartouche",g:"○",b:"Das Cartouche — ein ovaler Ring mit einem horizontalen Strich — umgab den Königsnamen des Pharao und schützte ihn vor bösen Einflüssen. Der Name war heilig; ihn zu kennen bedeutete Macht über jemanden. Als Tattoo steht das Cartouche für die Macht des eigenen Namens, Identität und göttlichen Schutz der Persönlichkeit.",t:"schutz,identität"},
    {n:"Anubis-Jackal",g:"🐺",b:"Anubis, der schakalsköpfige Gott, war der Wächter der Nekropolen und Führer der Seelen durch die Unterwelt. Er wog die Herzen der Verstorbenen gegen die Feder der Ma'at. Als Tattoo steht er für den Übergang zwischen Leben und Tod, Schutz der Seele auf ihrer Reise und die Akzeptanz der eigenen Sterblichkeit.",t:"transformation,schutz,spirituell"},
    {n:"Bastet-Katze",g:"🐱",b:"Bastet, die Katzengöttin, war die Beschützerin des Hauses, der Frauen und der Kinder. Katzen wurden in Ägypten verehrt und ihr Tod war strafbar. Bastet steht für die duale Natur der Katze: sanft und fürsorglich aber auch wild und kämpferisch wenn ihre Lieben bedroht sind. Als Tattoo steht sie für beschützende Mutterliebe und die Stärke des Weiblichen.",t:"schutz,freude,weiblichkeit"},
    {n:"Thoth-Ibis",g:"🦅",b:"Thoth, der ibisköpfige Gott, war der Erfinder der Schrift, der Wissenschaft und der Magie. Er schrieb das Buch der Toten und wog die Herzen der Verstorbenen. Als Tattoo steht Thoth für die heilige Kraft des Wissens, die Verbindung von Wissenschaft und Magie und die Überzeugung dass Wissen der höchste Wert ist.",t:"weisheit,licht,spirituell"},
    {n:"Sekhmet",g:"🦁",b:"Sekhmet ist die löwenköpfige Kriegs- und Heilungsgöttin Ägyptens — eine der furchtbarsten und heiligsten Gottheiten. Ihre Doppelnatur (Kriegerin und Heilerin) zeigt, dass Zerstörung und Heilung zwei Seiten derselben Kraft sind. Als Tattoo steht sie für diese Dualität: die Kraft zu zerstören was schadet und zu heilen was gebrochen ist.",t:"stärke,heilung,weiblichkeit"},
    {n:"Nefer",g:"♭",b:"Das Nefer-Symbol — eine Harfe oder Lunge — bedeutet im Altägyptischen schlicht 'schön', 'gut' oder 'vollkommen'. Es steht für Harmonie, Schönheit und das Anstreben von Vollkommenheit. Als Tattoo ist es ein elegantes Zeichen für den Wunsch nach Schönheit, Güte und Vollkommenheit im eigenen Leben.",t:"schönheit,harmonie,glück"},
    {n:"Kheper (Sonne aufgehend)",g:"🌅",b:"Kheper ist der Skarabäus-Gott der aufgehenden Sonne — die Sonne in der Morgendämmerung. Er rollt die Sonne über den Himmel wie ein Mistkäfer seine Kugel. Als Tattoo steht er für tägliche Wiedergeburt, die Kraft jeden Morgen neu zu beginnen und die unaufhaltsame Energie des Sonnenaufgangs.",t:"neubeginn,licht,transformation"},
  ],
  japanisch:[
    {n:"Enso",g:"○",b:"Der Enso ist ein einfacher Kreis, in einem einzigen Pinselstrich gemalt — das höchste Symbol des Zen-Buddhismus. Die Unvollkommenheit des Kreises zeigt die Unvollkommenheit des Lebens. Als Tattoo steht der Enso für innere Stärke, Erleuchtung, Vollkommenheit in der Unvollkommenheit und den gegenwärtigen Moment.",t:"spirituell,frieden,vollständigkeit"},
    {n:"Torii",g:"⛩",b:"Das Torii-Tor markiert den Übergang vom weltlichen zum heiligen Bereich in Japan. Rote Torii-Tore stehen vor Shinto-Schreinen und symbolisieren den Übergang zwischen zwei Welten. Als Tattoo steht es für spirituelle Schwellen, den Mut, in neue Bereiche einzutreten, und die Ehrfurcht vor dem Heiligen.",t:"spirituell,übergang,transformation"},
    {n:"Koi",g:"🐟",b:"Der Koi schwimmt nach einer alten japanischen Legende stromaufwärts am gelben Fluss entgegen und wird am Drachentor zum Drachen. Als Tattoo ist er eines der mächtigsten Symbole Japans für Beharrlichkeit, Mut angesichts von Widerständen und die Belohnung die auf Ausdauer folgt. Die Farbe hat Bedeutung: Rot steht für Liebe, Schwarz für Überwindung von Hindernissen.",t:"mut,ausdauer,stärke,erfolg"},
    {n:"Kirschblüte",g:"🌸",b:"Die japanische Kirschblüte (Sakura) blüht nur eine Woche im Jahr — intensiv schön und schnell vergänglich. Das Konzept des 'Mono no Aware' (das Pathos der Dinge) feiert die Schönheit des Vergänglichen. Als Tattoo steht die Kirschblüte für die tiefe Schönheit des Augenblicks, die Akzeptanz der Vergänglichkeit und die Würde des Endlichen.",t:"neubeginn,schönheit"},
    {n:"Drache (Ryū)",g:"龍",b:"Der japanische Ryū ist anders als europäische Drachen — er ist gut, weise und steht mit Wasser in Verbindung. Er bringt Regen, schützt Gewässer und symbolisiert kaiserliche Macht und kosmische Stärke. Als Tattoo steht er für Weisheit und Stärke vereint, göttlichen Schutz und die Verbindung zwischen Himmels- und Erdenwelt.",t:"stärke,weisheit,schutz"},
    {n:"Chrysantheme",g:"🌼",b:"Die Chrysantheme ist die kaiserliche Blume Japans und steht für Langlebigkeit, Wiedergeburt und die Sonne. Sie blüht im Herbst, wenn andere Blumen welken — ein Symbol für Ausdauer und Schönheit im Angesicht des Endes. Als Tattoo steht sie für Würde, Vollkommenheit und die Schönheit die im Verblühen liegt.",t:"vollständigkeit,stärke,schönheit"},
    {n:"Welle (Hokusai)",g:"〰",b:"Hokusais 'Große Welle vor Kanagawa' (1831) zeigt eine riesige Welle die Boote zu verschlucken droht, während der Fuji klein im Hintergrund steht. Sie symbolisiert die Kraft der Natur über den Menschen und gleichzeitig die Stärke, dieser Kraft gegenüberzutreten. Als Tattoo steht sie für Respekt vor dem Unaufhaltsamen und Mut im Angesicht des Sturms.",t:"stärke,freiheit,fluss"},
    {n:"Oni-Maske",g:"👹",b:"Die Oni sind japanische Dämonen — riesig, wild, mit Keulen bewaffnet. Doch sie beschützen auch Tempel und Häuser. Die Oni-Maske als Tattoo steht für die Dualität von Bedrohung und Schutz, die eigene dämonische Seite die man anerkennen muss, und die Kraft die in der Konfrontation mit den eigenen Schatten liegt.",t:"schutz,stärke"},
    {n:"Furinkazan",g:"風",b:"Furinkazan ist Shingen Takedas Kriegsbanner: 'Schnell wie Wind, ruhig wie Wald, heftig wie Feuer, unbeweglich wie Berg.' Es stammt aus Sun Tzus Kriegskunst. Als Tattoo steht es für die vier Qualitäten eines vollständigen Menschen — Entschlossenheit, Ruhe, Leidenschaft und Beständigkeit.",t:"stärke,weisheit,mut"},
    {n:"Peonie (Botan)",g:"🌹",b:"Die Pfingstrose (Botan) gilt in Japan als 'König der Blumen'. Sie steht für Wohlstand, Tapferkeit und weibliche Stärke. Ihre üppigen Blüten symbolisieren Reichtum und die Bereitschaft zum Risiko. Als Tattoo steht sie für Kühnheit, Wohlstand und die Überzeugung, dass Schönheit und Stärke sich nicht ausschließen.",t:"erfolg,glück,weiblichkeit"},
    {n:"Hannya-Maske",g:"😈",b:"Die Hannya-Maske aus dem japanischen Noh-Theater zeigt einen eifersüchtigen, in einen Dämon verwandelten weiblichen Geist. Sie symbolisiert die zerstörerische Kraft unkontrollierter Emotionen. Als Tattoo steht sie für die Dualität von Schönheit und Schrecken, intensive Leidenschaft und die menschliche Fähigkeit zur Transformation durch Schmerz.",t:"transformation,stärke,leidenschaft"},
    {n:"Daruma",g:"◯",b:"Die Daruma-Puppe ist ein japanischer Glücksbringer der den buddhistischen Mönch Bodhidharma darstellt. Man malt zuerst ein Auge ein und formuliert einen Wunsch — erst wenn der Wunsch erfüllt ist, malt man das zweite Auge. Als Tattoo steht es für Ausdauer, Zielstrebigkeit und die Kraft des Wunsches.",t:"ausdauer,mut,erfolg,neubeginn"},
    {n:"Tomoe (Mitsudomoe)",g:"☯",b:"Das Mitsudomoe — drei Comma-Formen im Kreis — findet sich auf japanischen Trommeln und Familienwappen. Es steht für Gleichgewicht, den ewigen Kreislauf und die drei Kräfte Himmel-Erde-Mensch. Als Tattoo symbolisiert es harmonische Bewegung, das Gleichgewicht der Kräfte und die kosmische Verbindung aller drei Welten.",t:"gleichgewicht,zyklus,stärke"},
    {n:"Seigaiha",g:"◠",b:"Das Seigaiha-Muster — überlappende Halbkreise wie Schuppen oder Wellen — ist eines der ältesten japanischen Muster. Der Name bedeutet 'Blaue Meereswellen'. Es steht für Glück, Wohlstand und Schutz. Als Tattoo ist es ein elegantes Symbol für die fließende Kraft des Meeres, ewigen Schutz und das Anstreben von Fülle.",t:"glück,schutz,frieden"},
    {n:"Fudo Myoo",g:"🔥",b:"Fudo Myoo ist der 'Unbewegte Weise' des japanischen Buddhismus — ein furchteinflößender blauer Dämonenbezwinger mit Schwert und Lasso. Er ist der Beschützer vor allen Hindernissen und bösen Kräften. Als Tattoo steht er für unerschütterliche Entschlossenheit, den Schutz des Dharma und die Kraft die entsteht wenn man sich nicht bewegen lässt.",t:"schutz,stärke,transformation"},
    {n:"Raijin",g:"⚡",b:"Raijin ist der japanische Donnergott — wild, furchteinflößend, mit Trommeln um sich herum. Er steht für die rohe Kraft des Sturms, aber auch für die reinigende Wirkung des Donners. Als Tattoo steht er für ungezügelte Energie, die Kraft der Natur und die Akzeptanz dass Stürme notwendig und reinigend sind.",t:"stärke,energie,transformation"},
    {n:"Fujin",g:"🌀",b:"Fujin ist der japanische Windgott — meist mit einem großen Sack dargestellt aus dem er den Wind lässt. Er ist der Bruder des Donnergottes Raijin. Als Tattoo steht er für die ungreifbare Kraft des Windes, Freiheit und Bewegung, und die Überzeugung dass die unsichtbaren Kräfte die mächtigsten sind.",t:"freiheit,transformation,stärke"},
    {n:"Benzaiten",g:"♪",b:"Benzaiten ist die japanische Göttin der Schönheit, Musik und Weisheit — die einzige Frau unter den Sieben Glücksgöttern. Sie spielt die Biwa und schützt die Kunst. Als Tattoo steht sie für die Verbindung von Schönheit und Weisheit, künstlerische Begabung und die spirituelle Dimension der Musik.",t:"kreativität,schönheit,glück"},
    {n:"Tsuru (Kranich)",g:"🦢",b:"Der japanische Kranich (Tsuru) soll tausend Jahre leben. Das Falten von tausend Origami-Kranichen (Senbazuru) erfüllt einen Wunsch. Als Tattoo steht der Kranich für Langlebigkeit, Geduld, Treue (Kraniche bleiben lebenslang zusammen) und die Kraft der Intention wenn man sich einem Ziel mit Ausdauer widmet.",t:"glück,frieden,ausdauer"},
    {n:"Kitsune (Fuchs)",g:"🦊",b:"Der japanische Fuchsgeist mit übernatürlichen Kräften — je mehr Schwänze, desto älter und mächtiger. Als Bote des Gottes Inari steht er zwischen den Welten. Symbol für Weisheit, Verwandlung und göttliche List.",t:"weisheit,transformation,spirituell"},
    {n:"Namazu",g:"🐟",b:"Namazu ist ein riesiger Wels in der japanischen Mythologie, der unter der Erde lebt und Erdbeben verursacht wenn er sich bewegt. Als Tattoo steht er für die unberechenbare Kraft der Natur, die Demut gegenüber Kräften die wir nicht kontrollieren können, und den Humor im Angesicht des Chaos.",t:"stärke,natur,transformation"},
    {n:"Tengu",g:"🦅",b:"Tengu sind japanische Berggeister — halb Mensch, halb Rabe — die als Meister der Kampfkunst gelten. Viele Samurai lernten angeblich von Tengu. Sie stehen für Arroganz und Hochmut aber auch für überlegene Fähigkeiten. Als Tattoo steht der Tengu für Meisterschaft durch Disziplin und die spirituelle Dimension der Kampfkunst.",t:"stärke,weisheit,spirituell"},
  ],
  spirituell:[
    {n:"Om / Aum",g:"ॐ",b:"Om (AUM) ist der Urklang der hinduistischen Kosmologie — die erste Vibration aus der das Universum entstand. A = Schöpfung, U = Erhaltung, M = Auflösung. Die Stille danach ist Brahman selbst. Als Tattoo steht es für die Verbindung mit dem kosmischen Ursprung, die Praxis der Meditation und die Überzeugung dass alles aus einem Klang entstanden ist.",t:"spirituell,verbindung,frieden"},
    {n:"Unalome",g:"𑁇",b:"Das Unalome ist ein buddhistisch-hinduistisches Symbol das den individuellen Weg zur Erleuchtung darstellt. Die Spirale am Anfang steht für den Kreislauf des Leidens und der Verwirrung. Die zunehmend gerader werdende Linie zeigt den Weg zur Klarheit. Die Punkte am Ende symbolisieren das Auflösen ins Nichts. Als Tattoo steht es für den persönlichen spirituellen Weg.",t:"spirituell,transformation,neubeginn"},
    {n:"Mandala",g:"◉",b:"Mandala bedeutet auf Sanskrit 'Kreis' und ist in buddhistischen und hinduistischen Traditionen eine heilige geometrische Darstellung des Kosmos. Das Zeichnen von Mandalas ist selbst eine Meditationspraxis. Als Tattoo steht das Mandala für die Suche nach dem eigenen Mittelpunkt, die Schönheit der Symmetrie und die Meditation als tägliche Praxis.",t:"spirituell,vollständigkeit,frieden"},
    {n:"Blume des Lebens",g:"✿",b:"Das Muster aus 19 überlappenden Kreisen findet sich in ägyptischen Tempeln, keltischen Kirchen und Leonardo da Vincis Notizbüchern. Es enthält alle platonischen Körper und gilt als geometrische Blaupause der gesamten Schöpfung.",t:"spirituell,verbindung,ewigkeit"},
    {n:"Merkaba",g:"✡",b:"Die Merkaba ist eine doppelte Tetraeder-Form — zwei Dreiecke in entgegengesetzte Richtungen. Im Hebrätischen bedeutet sie Wagen oder Streitwagen. In der Kabbala und in New-Age-Traditionen steht sie für das Lichtkörper-Fahrzeug der Seele. Als Tattoo steht sie für spirituellen Aufstieg, den Körper als Tempel des Geistes und multi-dimensionale Bewusstheit.",t:"spirituell,schutz,transformation"},
    {n:"Hamsa",g:"🖐",b:"Die Hamsa — Hand mit Auge — ist in vielen Kulturen des Nahen Ostens und Nordafrikas das wichtigste Schutzsymbol. Im Islam ist es die Hand der Fatima (Tochter des Propheten), im Judentum die Hand der Miriam. Das Auge in der Handfläche wehrt den Bösen Blick ab. Als Tattoo steht sie für universellen Schutz und die Kraft der heiligen Weiblichkeit.",t:"schutz,glück,spirituell"},
    {n:"Yin Yang",g:"☯",b:"Das Yin-Yang-Symbol aus dem Taoismus zeigt die fundamentale Dualität aller Existenz — aber immer im Gleichgewicht. Im schwarzen Bereich ist ein weißer Punkt, im weißen ein schwarzer: jede Kraft trägt den Keim der Gegenkraft in sich. Als Tattoo steht es für die tiefe Akzeptanz der Gegensätze als notwendige Teile eines Ganzen.",t:"gleichgewicht,harmonie"},
    {n:"Sri Yantra",g:"△",b:"Das Sri Yantra ist das heiligste geometrische Symbol des Hinduismus — neun ineinander verschlungene Dreiecke, die aus einem zentralen Punkt entstehen. Fünf Dreiecke zeigen abwärts (Shakti/weiblich), vier aufwärts (Shiva/männlich). Es steht für die göttliche Schöpfung. Als Tattoo symbolisiert es kosmische Schöpfungskraft, die Einheit aller Gegensätze und göttliche Fülle.",t:"spirituell,weisheit"},
    {n:"Dharma-Rad",g:"☸",b:"Das Dharmarad (Dharmachakra) ist das Symbol des buddhistischen Dharma — die acht Speichen stehen für den Achtfachen Pfad. Als Buddha seine erste Lehrrede hielt, 'drehte er das Rad des Dharma'. Als Tattoo steht es für den Beginn des spirituellen Weges, die Struktur des buddhistischen Lebens und die ewige Bewegung des Dharma.",t:"spirituell,weisheit,frieden"},
    {n:"Bodhi-Baum",g:"🌳",b:"Unter dem Bodhi-Feigenbaum in Bodh Gaya erlangte Siddhartha Gautama die Erleuchtung und wurde zum Buddha. Der Bodhi-Baum steht für den Moment der Erweckung, die Kraft der Ausdauer in der Meditation und die Möglichkeit der Befreiung für jeden Menschen. Als Tattoo steht er für den Glauben an die eigene Erleuchtungsmöglichkeit.",t:"spirituell,weisheit,wachstum"},
    
    {n:"Seed of Life",g:"⊙",b:"Die Seed of Life besteht aus sieben überlappenden Kreisen und ist die Grundlage der Blume des Lebens. Sie steht für die sieben Schöpfungstage und den Ursprung allen Lebens. Als Tattoo symbolisiert sie den göttlichen Ursprung, die erste Entfaltung der Schöpfung und das Potenzial das in jedem Beginn liegt.",t:"spirituell,neubeginn,verbindung"},
    {n:"Metatrons Würfel",g:"✡",b:"Metatrons Würfel enthält alle fünf platonischen Körper und entsteht aus der Frucht des Lebens (heilige Geometrie). Er gilt als die Blaupause der Schöpfung — alle geometrischen Formen des Universums sind darin enthalten. Als Tattoo steht er für die geometrische Ordnung hinter der Schöpfung, göttliches Design und die Verbindung mit dem Engel Metatron.",t:"spirituell,weisheit,ewigkeit"},
    {n:"Vesica Piscis",g:"⋈",b:"Die Vesica Piscis entsteht wenn zwei gleiche Kreise so überlappen, dass jeder Mittelpunkt auf dem Rand des anderen liegt. Die entstehende Mandelform gilt als Symbol der göttlichen Schöpfung und des weiblichen Prinzips. Als Tattoo steht sie für die schöpferische Kraft aus der Überschneidung, die Verbindung zweier Welten und das Tor zur Manifestation.",t:"spirituell,verbindung,schöpfung"},
    {n:"Fibonacci-Spirale",g:"🌀",b:"Die Fibonacci-Spirale folgt der Zahlenreihe 1,1,2,3,5,8,13... und findet sich in Schneckenhäusern, Blütenkronen, Galaxien und menschlichem Körper. Sie steht für den Goldenen Schnitt und die mathematische Ordnung hinter der Natur. Als Tattoo symbolisiert sie göttliche Proportion, organisches Wachstum und die verborgene Mathematik des Lebens.",t:"natur,schönheit,ewigkeit"},
    {n:"Auge der Vorsehung",g:"👁",b:"Das Allsehende Auge im Dreieck — bekannt von der US-Dollar-Note — steht für die göttliche Allgegenwart und Allwissenheit. Es findet sich in Freimaurerei, Christentum und Esoterik. Als Tattoo steht es für die Überzeugung, dass ein höheres Bewusstsein alles sieht und begleitet, für Erleuchtung und die spirituelle Dimension der Wachheit.",t:"weisheit,spirituell,schutz"},
    {n:"Unendlichkeit ∞",g:"∞",b:"Das Unendlichkeitszeichen (∞) — eine liegende Acht — ist ein modernes mathematisches Symbol aber auch uraltes Sinnbild für das Ewige. Es steht für endlosen Kreislauf, ewige Verbindung und das Transzendieren der Zeit. Als Tattoo steht es für ewige Liebe, unendliche Möglichkeiten und die Überzeugung, dass manche Verbindungen über den Tod hinausgehen.",t:"ewigkeit,freiheit,liebe"},
    {n:"Pentagram",g:"⛤",b:"Das Pentagramm — fünfzackiger Stern — ist seit der Antike bekannt. Pythagoras nutzte es als Erkennungszeichen, mittelalterliche Alchemisten als Schutzsymbol. Als aufrechter Stern steht er für Geist über Materie. Als Tattoo ist er ein kraftvolles Symbol für Schutz, die fünf Elemente im Gleichgewicht und die Verbindung zwischen menschlichem und göttlichem Bereich.",t:"schutz,spirituell,gleichgewicht"},
    {n:"Hexagram",g:"✡",b:"Das Hexagramm — Davidstern, Siegel Salomons — ist ein Sechsstern aus zwei überlagerten Dreiecken. Im Judentum, Islam und in der Esoterik steht er für As above so below, die Verbindung von Oben und Unten, Feuer und Wasser, männlichem und weiblichem Prinzip. Als Tattoo steht er für die Einheit der Gegensätze und das magische Gleichgewicht.",t:"gleichgewicht,spirituell,schutz"},
    {n:"Chakra Ajna",g:"◉",b:"Ajna — das Dritte Auge — liegt zwischen den Augenbrauen und ist das Sechste Chakra. Es steht für Intuition, inneres Sehen und Weisheit jenseits der rationalen Wahrnehmung. Im aktivierten Zustand ermöglicht es das Wahrnehmen subtiler Energien. Als Tattoo steht es für spirituelle Wahrnehmung, Vertrauen in die eigene Intuition und das Streben nach höherer Weisheit.",t:"intuition,weisheit,spirituell"},
    {n:"Lotus-Unalome",g:"𑁇",b:"Das Lotus-Unalome verbindet zwei der kraftvollsten buddhistischen Symbole: den Weg zur Erleuchtung (Unalome) mit der Reinheit (Lotus). Die Lotusblüte am Ende des Unalome-Weges steht für die Blüte am Ende aller Mühen. Als Tattoo ist es eines der schönsten Symbole für persönliches Wachstum, spirituellen Weg und die Schönheit die am Ende wartet.",t:"spirituell,neubeginn,wachstum"},

  amazigh:[
    {n:"Yaz",g:"ⵣ",b:"Das Yaz (ⵣ) ist das wichtigste Symbol der Amazigh-Kultur Nordafrikas. Es zeigt einen freien Mann mit erhobenen Armen — das Zeichen der Freiheit. Die Amazigh nennen sich selbst 'freie Menschen' (Imazighen). Als Tattoo steht Yaz für Freiheit, kulturelle Identität und den Stolz auf die uralte Berber-Tradition.",t:"freiheit,identität,stärke"},
    {n:"Tifinagh-Kreuz",g:"+",b:"Das Tifinagh-Kreuz verbindet das uralte Amazigh-Schriftsystem mit dem universellen Schutzsymbol des Kreuzes. Als Tattoo steht es für die Verbindung von kultureller Identität und universellen Werten, die Verschmelzung von Tradition und Spiritualität und den Stolz auf das nordafrikanische Erbe.",t:"schutz,gleichgewicht,orientierung"},
    {n:"Schlange (Aẓar)",g:"𓆙",b:"Die Schlange Aẓar ist ein heiliges Tier der Amazigh-Tradition — sie bewacht Häuser und Quellen und steht für Weisheit der Erde und Schutz. In vielen Berber-Familien wurden Hausschlangen als Ahnengeister verehrt. Als Tattoo steht sie für die Verbindung mit den Vorfahren, erdverbundene Weisheit und den Schutz des Hauses.",t:"schutz,heilung,transformation"},
    {n:"Mond & Stern",g:"☾",b:"Mond und Stern sind das wichtigste Schutzsymbol der nordafrikanischen und islamischen Tradition. In der Amazigh-Kultur steht der Mond für weibliche Energie, der Stern für göttliche Führung. Als Tattoo steht die Kombination für Schutz in der Nacht, Orientierung im Dunkeln und die Verbindung zwischen weiblicher Mondenergie und göttlichem Licht.",t:"zyklus,weiblichkeit,neubeginn"},
    {n:"Agounni",g:"◯",b:"Agounni ist ein traditionelles Amazigh-Schutzsymbol — ein geometrisches Muster das auf Schmuck, Keramik und Teppichen vorkommt. Es steht für Fruchtbarkeit und Schutz vor dem bösen Blick. Als Tattoo ist es ein Zeichen der Amazigh-Identität, der Verbindung mit der nordafrikanischen Tradition und der Kraft der uralten Schutzmagie.",t:"schutz,vollständigkeit,zyklus"},
    {n:"Handfläche (Tafust)",g:"✋",b:"Die Tafust — die offene Hand — ist ein universelles Schutzsymbol der Amazigh-Kultur und schützt vor dem bösen Blick. Sie ähnelt der Hamsa, hat aber ihre eigene nordafrikanische Geschichte. Als Tattoo steht sie für aktiven Schutz, die Kraft der abwehrenden Geste und die Verbindung mit der uralten Berber-Tradition.",t:"schutz,familie,stärke"},
    {n:"Dreieck (Talest)",g:"△",b:"Das Dreieck (Talest) ist in der Amazigh-Kunst eines der häufigsten Symbole und steht für Weiblichkeit, Fruchtbarkeit und Schutz. Oft nach unten weisend als Zeichen der Göttin. Als Tattoo steht es für weibliche Urkraft, Fruchtbarkeit und die geometrische Sprache der nordafrikanischen Tradition.",t:"stärke,weiblichkeit,identität"},
    {n:"Wasser (Aman)",g:"〰",b:"Aman — Wasser — ist in den nordafrikanischen Wüstenregionen das heiligste Element. In Amazigh-Symbolen steht Wasser für Leben selbst, Reinigung und die seltene Kostbarkeit. Als Tattoo steht das Wassersymbol für das Lebenswichtige, die Dankbarkeit für das Wesentliche und die tiefe Verbindung mit der Wüstenlandschaft.",t:"leben,freiheit,anpassung"},
    {n:"Raute (Tasna)",g:"◇",b:"Die Raute (Tasna) ist eines der häufigsten Motive in Amazigh-Teppichen und Keramik. Sie steht für das Auge — das Schutzauge das den bösen Blick abwehrt — und für Fruchtbarkeit. Als Tattoo ist sie ein elegantes geometrisches Zeichen der Berber-Kultur mit kraftvoller Schutzfunktion.",t:"schutz,weiblichkeit,fruchtbarkeit"},
    {n:"Zickzack (Anzar)",g:"⋀",b:"Der Zickzack steht in Amazigh-Symbolen für den Regengeist Anzar und damit für Wasser, Leben und Erneuerung. In Nordafrika ist Regen selten und heilig. Als Tattoo steht der Zickzack für die Kraft des Lebens-spendenden Regens, Erneuerung nach Dürre und die Sehnsucht nach Fülle.",t:"stärke,natur,spirituell"},
    {n:"Kreuzritzung",g:"✕",b:"Die Kreuzritzung — ein in Stein geritztes Kreuz — ist eines der ältesten Menschheitszeichen und findet sich auf prähistorischen Felszeichnungen weltweit. Es steht für die vier Himmelsrichtungen, die Verbindung von Himmel und Erde und das Ur-Symbol der menschlichen Orientierung im Raum. Als Tattoo ist es das reinste Symbol für kosmische Ausrichtung und universelle Verbundenheit.",t:"gleichgewicht,verbindung,schutz"},
    {n:"Spiralkette",g:"⊃",b:"Spiralketten sind klassische Amazigh-Schmuckmotive — sie finden sich auf Silberschmuck und Teppichen. Die Spirale steht für ewige Bewegung, Wachstum und den Lebensfluss. Als Tattoo verbindet sie nordafrikanische Ästhetik mit universeller Symbolik für Wachstum und Vitalität.",t:"ewigkeit,verbindung,zyklus"},
    {n:"Vogel (Agazzal)",g:"🦅",b:"Der Vogel (Agazzal) ist in der Amazigh-Tradition ein Bote zwischen Welten und ein Symbol der Seele. Er steht für Freiheit, Spiritualität und die Fähigkeit, über irdische Grenzen hinwegzufliegen. Als Tattoo steht er für die freie Seele, spirituelle Botschaft und die Sehnsucht nach Freiheit.",t:"freiheit,weisheit,spirituell"},
    {n:"Sonne (Tafukt)",g:"☀",b:"Tafukt — die Sonne — ist in der Amazigh-Kultur ein Symbol des Lebens und der Wärme. In den nordafrikanischen Gebirgen war die Sonne sowohl lebensnotwendig als auch gefährlich. Als Tattoo steht die Amazigh-Sonne für Lebensenergie, Wärme, Kraft und die Verbindung mit dem nordafrikanischen Kulturerbe.",t:"licht,stärke,leben"},
    {n:"Zwei Dreiecke",g:"⋈",b:"Zwei einander zugewandte Dreiecke symbolisieren in der Alchemie die Verbindung von Feuer (△) und Wasser (▽) — Gegensätze die sich anziehen und ausgleichen. Als Tattoo steht die Kombination für die heilige Hochzeit der Gegensätze, das Gleichgewicht aller Kräfte und die alchemistische Vereinigung.",t:"gleichgewicht,liebe,harmonie"},
