<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tattoo-Berater · Coco Colours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
html,body{background:#0a0a0a!important}
/* ===== BERATER PAGE OVERRIDES ===== */
html,body{height:100%;background:#0a0a0a!important;color:#f0ede8;overflow:hidden;}
.b-page{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto;}
.b-topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:#0d0d0d;border-bottom:1px solid var(--border);flex-shrink:0;}
.b-logo{display:flex;align-items:center;gap:10px;}
.b-logo img{width:34px;height:34px;border-radius:50%;object-fit:cover;filter:invert(1);}
.b-logo-name{font-family:'Tan Mon Cheri',serif;font-size:.9rem;letter-spacing:3px;color:var(--gold);}
.b-logo-sub{font-size:9px;letter-spacing:2px;color:var(--muted);display:block;}
.b-reset{padding:6px 12px;background:none;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-family:'Poppins',sans-serif;font-size:11px;cursor:pointer;}
.b-reset:hover{border-color:var(--gold);color:var(--gold);}

/* Search bar */
.b-search{padding:12px 18px;background:#111;border-bottom:1px solid var(--border);flex-shrink:0;}
.b-search-wrap{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;transition:border-color .2s;}
.b-search-wrap:focus-within{border-color:var(--gold);}
.b-search-wrap input{flex:1;background:none;border:none;outline:none;color:var(--white);font-family:'Poppins',sans-serif;font-size:14px;}
.b-search-wrap input::placeholder{color:var(--muted);}
.b-search-icon{color:var(--muted);font-size:16px;}
.b-search-clear{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:0;display:none;}
.b-search-clear.show{display:block;}

/* Search results */
.b-results{padding:0 18px;flex-shrink:0;}
.b-results-inner{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-top:8px;overflow:hidden;max-height:0;transition:max-height .3s ease;}
.b-results-inner.show{max-height:400px;overflow-y:auto;}
.b-result-section{padding:10px 14px 6px;}
.b-result-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:8px;}
.b-result-chips{display:flex;flex-wrap:wrap;gap:6px;}
.b-result-chip{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;color:var(--white);cursor:pointer;background:var(--card2);transition:all .15s;}
.b-result-chip:hover{border-color:var(--gold);color:var(--gold);}
.b-result-chip.gold{border-color:var(--gold);color:var(--gold);background:var(--gold-dim);}
.b-result-divider{height:1px;background:var(--border);margin:0 14px;}
.b-no-results{padding:16px 14px;font-size:13px;color:var(--muted);text-align:center;}

/* Berater content */
.b-progress{height:2px;background:var(--border);flex-shrink:0;}
.b-prog-fill{height:100%;background:linear-gradient(to right,var(--gold),var(--gold-l));transition:width .4s ease;}
.b-meta{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;flex-shrink:0;}
.b-step-lbl{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;}
.b-back{background:none;border:none;color:var(--muted);font-size:12px;font-family:'Poppins',sans-serif;cursor:pointer;padding:0;}
.b-back:hover{color:var(--white);}
.b-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 30px;}
.b-content::-webkit-scrollbar{display:none;}
</style>
</head>

  if(!ST.history.length)return;
  const last=ST.history.pop();
  const fns={showWelcome,showStilQ,showTradition,showMeaning,showSlot};
  if(fns[last.fn])fns[last.fn](...(last.args||[]),true);
}

function showStilQ(qi,back){
  if(!back)ST.answers=ST.answers.slice(0,qi);
  const q=SQ[qi];
  const pct=Math.round(qi/SQ.length*85);
  setHdr(pct,`Stil-Finder · ${qi+1}/${SQ.length}`,true);
  let h=`<div class="q-label">Stil-Finder</div><div class="q-title">${q.q}</div><div class="q-opts">`;
  q.opts.forEach((o,i)=>{h+=`<button class="q-opt" onclick="answerStil(${qi},${i})"><span class="opt-e">${o.e}</span><div><div class="opt-t">${o.t}</div><div class="opt-d">${o.d}</div></div></button>`;}); 
  h+='</div>';
  html('popupContent',h);
}

function answerStil(qi,ai){
  ST.answers[qi]=ai;
  push('showStilQ',qi);
  if(qi===3&&ai===0){fromStil=true;showTradition();}
  else if(qi===3&&ai===1){fromStil=false;showStilQ(4);}
  else if(qi<SQ.length-1){showStilQ(qi+1);}
  else{showStilResult(null);}
}

function showStilResult(symData){
  setHdr(100,'Dein Stil',true);
  const a=ST.answers;
  const w=new Array(SR.length).fill(0);
  const maps=[
    {0:[0,2],1:[2,6],2:[1,7],3:[5,7],4:[1,3],5:[4,6]},
    {0:[2,3],1:[0,4],2:[1,7],3:[7],4:[6,3],5:[5,4]},
    {0:[2,3],1:[4,0],2:[1,3],3:[7,5],4:[1,3]},
    null,
    {0:[1,0],1:[2,6],2:[3],3:[2,6],4:[5,6]},
    {0:[0,2],1:[1,6],2:[4,3]},
    {0:[0,1],1:[1,2],2:[3,4]},
  ];
  a.forEach((ans,qi)=>{if(maps[qi])(maps[qi][ans]||[]).forEach(i=>{if(i<w.length)w[i]+=2;});});
  const r=SR[w.indexOf(Math.max(...w))]||SR[0];
  // Alle Ergebnis-Begriffe für den Slot speichern
  ST.slotPool=[...r.ex, ...(symData||[]).map(s=>s.n)];
  let h=`<div class="result-tag">${r.tag}</div>
    <div class="result-style">${r.name}</div>
    <p class="result-desc">${r.desc}</p>
    <div class="result-chips">${r.traits.map(t=>`<span class="result-chip">${t}</span>`).join('')}</div>
    <p class="q-label" style="margin-bottom:10px">Beispiele</p>
    ${r.ex.map(e=>`<div style="padding:9px 12px;background:var(--card);border:1px solid var(--border);border-radius:9px;font-size:12px;color:#bbb;margin-bottom:7px">→ ${e}</div>`).join('')}`;
  if(symData&&symData.length){
    h+=`<p class="sym-title" style="margin-top:20px">Passende Symbole</p><div class="sym-cards">`
      +symData.map(s=>`<div class="sym-card"><div class="sym-glyph">${s.g}</div><div class="sym-info"><div class="s-trad">${s.trad||''}</div><div class="s-name">${s.n}</div><div class="s-mean">${s.b}</div></div></div>`).join('')
      +`</div>`;
  }
  h+=endCTA(true);
  html('popupContent',h);
}

  if(!back)push('showMeaning');

  h+=`</div><button class="q-weiter" id="qWeiter" onclick="submitMean()" disabled>Symbole zeigen →</button>`;
  html('popupContent',h);
}
function submitMean(){
  const meanings=[...document.querySelectorAll('#qopts .q-opt.sel')].map(b=>b.dataset.k);
  ST.meaning=meanings;
  const result=[];
  ST.tradition.forEach(tk=>{
    const tradObj=TRADS.find(t=>t.k===tk);
    const pool=(SYMBOLE[tk]||[]).map(s=>({...s,trad:tradObj?.t||''}));
    const scored=pool.map(s=>{
      const tags=(s.t||'').split(',');
      return{...s,score:meanings.filter(m=>tags.includes(m)).length};
    }).sort((a,b)=>b.score-a.score);
    if(scored.length)result.push(scored[0]);
  });
  const top=result.sort((a,b)=>b.score-a.score).slice(0,4);
  if(fromStil)showStilResult(top);
  else showSymResult(top);
}

function showSymResult(syms){
  setHdr(100,'Deine Symbole',true);
  const tradN=ST.tradition.map(k=>TRADS.find(t=>t.k===k)?.t||k).join(' · ');
  const meanN=ST.meaning.map(k=>MEANS.find(m=>m.k===k)?.t||k).join(', ');
  ST.slotPool=syms.map(s=>s.n); // Symbole für Slot speichern
  let h=`<div class="result-tag">${tradN}</div>
    <div class="result-style" style="font-size:22px;line-height:1.2;margin-bottom:12px">${meanN}</div>

  slotRes=[];
  [0,1,2].forEach(i=>{
    const chosen=getRandom(source);
    slotRes.push(chosen);
    const inner=document.getElementById('ri'+i);
    let items='';
    for(let j=0;j<20;j++){
      const m=getRandom(source);
      items+=`<div class="slot-item"><div class="slot-glyph" style="font-size:13px;font-family:'Poppins',sans-serif;font-weight:500">${m}</div></div>`;
    }
    items+=`<div class="slot-item" style="background:rgba(201,168,76,.07)"><div class="slot-glyph" style="font-size:14px;font-family:'Poppins',sans-serif;font-weight:600;color:var(--gold)">${chosen}</div></div>`;
    inner.innerHTML=items;
    inner.style.transition='none';inner.style.transform='translateY(0)';
    let pos=0;const spd=7+i*2;
    const iv=setInterval(()=>{pos-=spd;if(pos<-(inner.children.length-2)*95)pos=0;inner.style.transform=`translateY(${pos}px)`;},16);
    setTimeout(()=>{
      clearInterval(iv);
      const total=(inner.children.length-1)*95;
      inner.style.transition='transform 0.45s cubic-bezier(.2,.8,.3,1)';
      inner.style.transform=`translateY(-${total}px)`;
      if(i===2)setTimeout(()=>{spinning=false;document.getElementById('spinBtn').disabled=false;showSlotResult();},500);
    },600+i*500);
  });
}

  'Black & Grey': ['schwarz','grau','realistisch','realism','dunkel','schattierung','shade'],
  'Fineline': ['fein','dünn','zart','fineline','fine','linear','linie'],

  'Ornamental': ['ornament','mandala','zierlich','dekorativ','muster'],
  'Fineline Trash': ['trash','grunge','zerfallen','abstract','kreativ'],
  'Old School': ['old school','anker','rose','klassisch','sailor'],
};

function onSearch(q) {
  const input = document.getElementById('bSearchInput');
  const clear = document.getElementById('bSearchClear');
  const results = document.getElementById('bResults');
  q = q.trim();
  clear.className = q ? 'b-search-clear show' : 'b-search-clear';
  if (!q) { results.innerHTML=''; results.className='b-results-inner'; return; }
  
  const ql = q.toLowerCase();
  const words = ql.split(/\s+/);
  
  // Search meanings
  const foundMeans = MEANS.filter(m => 
    words.some(w => m.k.includes(w) || m.t.toLowerCase().includes(w))
  );
  
  // Search symbols
  const foundSymbols = [];
  Object.entries(SYMBOLE).forEach(([trad, syms]) => {
    syms.forEach(s => {
      if (words.some(w => 
        s.n.toLowerCase().includes(w) || 
        (s.b && s.b.toLowerCase().includes(w)) ||
        (s.t && s.t.some(tag => tag.includes(w)))
      )) {
        if (foundSymbols.length < 8) foundSymbols.push(s);
      }
    });
  });
  
  // Search styles
  const foundStyles = [];
  Object.entries(STYLE_KEYWORDS).forEach(([style, kws]) => {
    if (kws.some(kw => words.some(w => kw.includes(w) || w.includes(kw)))) {
      if (!foundStyles.includes(style)) foundStyles.push(style);
    }
  });
  
  // Also check motive tags
  const foundMotives = [];
  if (typeof MOTIVE_DATA !== 'undefined') {
    Object.entries(MOTIVE_DATA).forEach(([cat, motives]) => {
      motives.forEach(m => {
        if (words.some(w => 
          m.n.toLowerCase().includes(w) || 
          (m.b && m.b.toLowerCase().includes(w)) ||
          (m.t && m.t.some(t => t.includes(w)))
        )) {
          if (foundMotives.length < 6) foundMotives.push(m);
        }
      });
    });
  }
  
  let html = '';
  
  if (foundMeans.length > 0) {
    html += `<div class="b-result-section">
      <div class="b-result-label">Bedeutung & Symbolik</div>
      <div class="b-result-chips">
        ${foundMeans.map(m => `<span class="b-result-chip gold" onclick="clickMeaning('${m.k}')">${m.e} ${m.t}</span>`).join('')}
      </div>
    </div>`;
  }
  
  if (foundSymbols.length > 0) {
    if (html) html += '<div class="b-result-divider"></div>';
    html += `<div class="b-result-section">
      <div class="b-result-label">Passende Symbole</div>
      <div class="b-result-chips">
        ${foundSymbols.map(s => `<span class="b-result-chip" onclick="clickSymbol('${s.n}')">${s.e || '◆'} ${s.n}</span>`).join('')}
      </div>
    </div>`;
  }
  
  if (foundStyles.length > 0) {
    if (html) html += '<div class="b-result-divider"></div>';
    html += `<div class="b-result-section">
      <div class="b-result-label">Passende Stile</div>
      <div class="b-result-chips">
        ${foundStyles.map(s => `<span class="b-result-chip" onclick="clickStyle('${s}')">${s}</span>`).join('')}
      </div>
    </div>`;
  }

  if (foundMotives.length > 0) {
    if (html) html += '<div class="b-result-divider"></div>';
    html += `<div class="b-result-section">
      <div class="b-result-label">Passende Motive</div>
      <div class="b-result-chips">
        ${foundMotives.map(m => `<span class="b-result-chip">${m.n}</span>`).join('')}
      </div>
    </div>`;
  }
  
  if (!html) html = '<div class="b-no-results">Keine Ergebnisse — probiere andere Begriffe.</div>';
  
  results.innerHTML = html;
  results.className = 'b-results-inner show';
}

function clearSearch() {
  document.getElementById('bSearchInput').value = '';
  document.getElementById('bSearchClear').className = 'b-search-clear';
  document.getElementById('bResults').innerHTML = '';
  document.getElementById('bResults').className = 'b-results-inner';
}

  clearSearch();

  ST.meaning = [key];

function clickSymbol(name) {
  clearSearch();

  document.getElementById('bSearchInput').value = name;
  onSearch(name);
}

function clickStyle(style) {
  clearSearch();
  // Start style flow
  showWelcome();
}
